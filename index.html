              <div class="ic-sub">${esc(supOfRep(r.repId))} · ${dayName(r.date)} ${esc(r.date)}</div>
            </div>
            ${ratingChip(r)}
          </div>
          <div class="ic-rows">
            <div><span class="k">${t('fld_date')}</span><span class="v">${esc(r.date)}</span></div>
            <div><span class="k">${t('fld_delivered_orders')}</span><span class="v">${r.orders}</span></div>
            <div><span class="k">${t('fld_system_rejected')}</span><span class="v"><span class="chip red">${num(r.systemRejected||0)}</span></span></div>
            <div><span class="k">${t('fld_driver_rejected')}</span><span class="v"><span class="chip amber">${num(r.driverRejected||0)}</span></span></div>
            <div><span class="k">${t('fld_total_orders')}</span><span class="v"><span class="chip violet">${total}</span></span></div>
            <div><span class="k">${t('fld_delivery_rate')}</span><span class="v"><span class="chip ${rate>=70?'green':rate>=40?'amber':'red'}">${rate}%</span></span></div>
            <div><span class="k">${t('fld_hours')}</span><span class="v">${r.hours}h</span></div>
            <div><span class="k">${t('fld_total_km')}</span><span class="v">${totalKmCell(r)}</span></div>
            <div><span class="k">${t('fld_accepted')}</span><span class="v"><span class="chip green">${r.accepted}</span></span></div>
            <div><span class="k">${t('fld_rejected')}</span><span class="v"><span class="chip red">${r.rejected}</span></span></div>
            <div><span class="k">${t('kpi_violations')}</span><span class="v"><span class="chip amber">${r.violations}</span></span></div>
            <div><span class="k">🕒 ${t('fld_created')}</span><span class="v" style="font-size:11px">${formatDateTime(r.createdAt)}</span></div>
          </div>
          ${actionsCards(r)}
        </div>`;}).join('') : `<div class="empty" style="grid-column:1/-1">${t('no_data')}</div>`}
    </div>`;
  const addBtn = canEdit
    ? `<button class="btn btn-primary btn-sm" id="addReport">➕ ${t('btn_create_report')}</button>` : '';
  return `
  <div class="card">
    <div class="card-head">📅 ${t('t_daily')} ${isSupervisor()?`<span class="chip violet">${t('my_reps')}</span>`:''} <span class="spacer"></span>
      <div class="view-toggle">
        <button data-view="reports:table" class="${mode==='table'?'active':''}">📋 ${t('view_table')}</button>
        <button data-view="reports:cards" class="${mode==='cards'?'active':''}">🎴 ${t('view_cards')}</button>
      </div>
      ${addBtn}
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="field"><label>${t('date1')}</label><input type="date" id="d1" value="${d1}"></div>
        <div class="field"><label>${t('date2')}</label><input type="date" id="d2" value="${d2}"></div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn btn-primary btn-sm" id="applyDates">${t('btn_view')}</button>
        ${d2?`<button class="btn btn-sm" id="clearD2">✖ ${t('btn_cancel')}</button>`:''}
        <span class="spacer"></span>
        <span class="chip blue">${list1.length}</span>
        ${d2?`<span class="chip violet">${list2.length}</span>`:''}
      </div>
    </div>
  </div>
  <div class="grid g4">
    ${kpiCard('📦', t('fld_delivered_orders'), A.orders + (d2?` / ${B.orders}`:''), '#6366f1',
      d2 && B.orders ? Math.round(((A.orders-B.orders)/B.orders)*100) : null)}
    ${kpiCard('⏱️', t('kpi_hours'), A.hours + (d2?` / ${B.hours}`:''), '#10b981',
      d2 && B.hours ? Math.round(((A.hours-B.hours)/B.hours)*100) : null)}
    ${kpiCard('⚠️', t('kpi_violations'), A.violations + (d2?` / ${B.violations}`:''), '#f59e0b',
      d2 && B.violations ? Math.round(((A.violations-B.violations)/B.violations)*100) : null)}
    ${kpiCard('📊', t('kpi_avg'), (list1.length?round1(A.orders/list1.length):0) +
      (d2?` / ${list2.length?round1(B.orders/list2.length):0}`:''), '#8b5cf6')}
  </div>
  <div class="grid g2">
    <div class="card"><div class="card-head">📦 ${d2 ? t('t_compare') : t('t_orders_rep')}</div>
      <div class="card-body">${
        d2 ? chartBarGrouped(compareRows, '#94a3b8', db.settings.color, d1, d2)
           : renderChart(db.settings.chartTypes.orders || 'bar',
               reps.map(r=>({label:r.name, value:sum(list1.filter(x=>x.repId===r.id),'orders')})),
               db.settings.color,
               ['#6366f1','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ef4444'])
      }</div></div>
    <div class="card"><div class="card-head">⭐ ${t('driver_rating_title')}</div>
      <div class="card-body">${
        (()=>{
          const dist = {A:0,B:0,C:0,D:0,E:0,F:0};
          [...list1, ...list2].forEach(r=>{ const l = r.rating || calcRating(r.orders); if(dist[l]!==undefined) dist[l]++; });
          return chartDonut(
            ['A','B','C','D','E','F'].map(l=>({label:l, value:dist[l]})),
            ['#10b981','#3b82f6','#8b5cf6','#f59e0b','#f97316','#ef4444'], true);
        })()
      }</div></div>
  </div>
  <div class="card">
    <div class="card-head">📋 ${t('t_daily')} — ${d1} ${d2?' | '+d2:''}</div>
    ${mode==='table' ? tableHTML : `<div class="card-body">${cardsHTML}</div>`}
  </div>`;
}
function agg(list){
  return {
    count:list.length, orders: sum(list,'orders'), hours: round1(sum(list,'hours')),
    violations: sum(list,'violations'), accepted: sum(list,'accepted'), rejected: sum(list,'rejected'),
    totalKm: sum(list,'totalKm')
  };
}
function afterDaily(){
  $('#d1')?.addEventListener('change', e=>{ state.daily.d1 = e.target.value; render(); });
  $('#d2')?.addEventListener('change', e=>{ state.daily.d2 = e.target.value; render(); });
  $('#applyDates')?.addEventListener('click', ()=>{
    state.daily.d1 = $('#d1').value || todayStr();
    state.daily.d2 = $('#d2').value || '';
    render(); toast(t('msg_updated'),'ok');
  });
  $('#clearD2')?.addEventListener('click', ()=>{ state.daily.d2=''; render(); });
  $('#addReport')?.addEventListener('click', ()=> dailyReportModal());
  bindReportActions();
  bindViewToggles();
  bindChartTypeButtons();
}
function bindViewToggles(){
  $$('[data-view]').forEach(b=> b.onclick = ()=>{
    const [k,v] = b.dataset.view.split(':');
    state.viewModes[k] = v; render();
  });
}
function bindChartTypeButtons(){
  $$('[data-ct]').forEach(b=> b.onclick = ()=>{
    const [k,v] = b.dataset.ct.split(':');
    db.settings.chartTypes[k] = v;
    saveDB(); render();
  });
}
function bindReportActions(){
  if(!canEditSection('daily')) return;
  $$('[data-edit-report]').forEach(b=> b.onclick = ()=> reportModal(b.dataset.editReport));
  $$('[data-del-report]').forEach(b=> b.onclick = ()=>{
    if(!confirm(t('msg_confirm_del'))) return;
    const rec = db.reports.find(x=>x.id===b.dataset.delReport);
    db.reports = db.reports.filter(x=>x.id!==b.dataset.delReport);
    saveDB(); render(); toast(t('msg_deleted'),'ok');
    if(rec) addNotif('حذف تقرير', `${repName(rec.repId)} — ${rec.date}`, 'err');
    if(isCloudReady() && isSupervisorAutoSync()) pushToCloud(true);
    else if(isCloudReady()) fullSync(true);
  });
}
function dailyReportModal(){
  if(!state.user) return;
  const reps = visibleReps();
  if(!reps.length){
    toast(isSupervisor()?'لا يوجد سائقون مسندون إليك':'أضف سائقاً أولاً','warn');
    return;
  }
  const initDate = state.daily.d1 || todayStr();
  const buildRows = (dateStr)=> reps.map(r=>{
    const existing = db.reports.find(x=> x.repId===r.id && x.date===dateStr);
    const startKm = existing && existing.startKm!=='' && existing.startKm!==undefined ? num(existing.startKm) : '';
    const endKm = existing && existing.endKm!=='' && existing.endKm!==undefined ? num(existing.endKm) : '';
    const totalKm = (startKm!=='' && endKm!=='') ? Math.max(0, endKm-startKm) : '';
    const sysRej = existing ? num(existing.systemRejected||0) : 0;
    const drvRej = existing ? num(existing.driverRejected||0) : 0;
    const delivered = existing ? num(existing.orders) : '';
    const totalOrders = (delivered==='' ? 0 : delivered) + sysRej + drvRej;
    const delivRate = totalOrders>0 ? Math.round(((delivered||0)/totalOrders)*100) : 0;
    return `<tr data-rep-row="${r.id}">
      <td>
        <div class="rep-name">${esc(r.name)}</div>
        <div class="rep-sub">${esc(supName(r.supervisorId))} · ${esc(r.code)}</div>
      </td>
      <td><input type="number" min="0" step="1" data-f="orders" value="${delivered}" placeholder="0"></td>
      <td><input type="number" min="0" step="1" data-f="systemRejected" value="${sysRej}" placeholder="0"></td>
      <td><input type="number" min="0" step="1" data-f="driverRejected" value="${drvRej}" placeholder="0"></td>
      <td><span class="chip violet" data-f="totalOrders">${totalOrders}</span></td>
      <td><span class="chip ${delivRate>=70?'green':delivRate>=40?'amber':'red'}" data-f="deliveryRate">${delivRate}%</span></td>
      <td><input type="number" min="0" step="0.1" data-f="hours" value="${existing?existing.hours:''}" placeholder="0"></td>
      <td><input type="number" min="0" step="1" data-f="startKm" value="${startKm}" placeholder="0"></td>
      <td><input type="number" min="0" step="1" data-f="endKm" value="${endKm}" placeholder="0"></td>
      <td><span class="chip violet" data-f="totalKm">${totalKm!==''?totalKm:'—'}</span></td>
      <td><input type="number" min="0" step="1" data-f="accepted" value="${existing?existing.accepted:0}"></td>
      <td><input type="number" min="0" step="1" data-f="rejected" value="${existing?existing.rejected:0}"></td>
      <td><span class="chip amber" data-f="total">${existing?existing.violations:0}</span></td>
      <td><input type="text" data-f="notes" value="${esc(existing?.notes||'')}" placeholder="${t('fld_notes')}"></td>
    </tr>`;
  }).join('');
  const buildBody = (dateStr)=> `
    <form id="drForm" novalidate>
      <div class="form-grid" style="margin-bottom:16px">
        <div class="field">
          <label>${t('fld_date')} <span class="req">*</span></label>
          <input type="date" id="bulkDate" required value="${dateStr}">
        </div>
        <div class="field">
          <label>🕒 ${t('fld_created')} <span class="small muted">${t('fld_auto_total')}</span></label>
          <input type="text" id="regTime" readonly value="${formatDateTime(new Date().toISOString())}">
        </div>
      </div>
      <div class="tbl-wrap" style="max-height:52vh;overflow-y:auto">
        <table class="bulk-table">
          <thead><tr>
            <th>${t('fld_rep')}</th>
            <th>${t('fld_delivered_orders')}</th>
            <th>${t('fld_system_rejected')}</th>
            <th>${t('fld_driver_rejected')}</th>
            <th>${t('fld_total_orders')} <span class="small muted">${t('fld_auto_total')}</span></th>
            <th>${t('fld_delivery_rate')} <span class="small muted">${t('fld_auto_total')}</span></th>
            <th>${t('fld_hours')}</th>
            <th>${t('fld_start_km_report')}</th>
            <th>${t('fld_end_km_report')}</th>
            <th>${t('fld_total_km')} <span class="small muted">${t('fld_auto_total')}</span></th>
            <th>${t('fld_accepted')}</th>
            <th>${t('fld_rejected')}</th>
            <th>${t('kpi_violations')}</th>
            <th>${t('fld_notes')}</th>
          </tr></thead>
          <tbody id="bulkRows">${buildRows(dateStr)}</tbody>
        </table>
      </div>
      <div class="small muted" style="margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--border)">
        💡 ${t('t_bulk_hint')}
      </div>
      <div id="drErr" class="err" style="display:none;margin-top:10px"></div>
    </form>`;
  openModal({
    title: `➕ ${t('btn_create_report')} ${isSupervisor()?`· ${t('my_reps')}`:''}`,
    body: buildBody(initDate),
    wide: true,
    submitText: t('btn_send'),
    onMount(root){
      const dateInp = root.querySelector('#bulkDate');
      const rowsContainer = root.querySelector('#bulkRows');
      const recompute = ()=>{
        rowsContainer.querySelectorAll('[data-rep-row]').forEach(row=>{
          const acc = num(row.querySelector('[data-f=accepted]').value);
          const rej = num(row.querySelector('[data-f=rejected]').value);
          row.querySelector('[data-f=total]').textContent = acc + rej;
          const sKm = row.querySelector('[data-f=startKm]').value;
          const eKm = row.querySelector('[data-f=endKm]').value;
          const totEl = row.querySelector('[data-f=totalKm]');
          if(sKm !== '' && eKm !== ''){
            totEl.textContent = Math.max(0, num(eKm) - num(sKm));
          } else {
            totEl.textContent = '—';
          }
          const delivered = num(row.querySelector('[data-f=orders]').value);
          const sysRej = num(row.querySelector('[data-f=systemRejected]').value);
          const drvRej = num(row.querySelector('[data-f=driverRejected]').value);
          const total = delivered + sysRej + drvRej;
          const rate = total > 0 ? Math.round((delivered/total)*100) : 0;
          row.querySelector('[data-f=totalOrders]').textContent = total;
          const rateEl = row.querySelector('[data-f=deliveryRate]');
          rateEl.textContent = rate + '%';
          rateEl.className = 'chip ' + (rate>=70?'green':rate>=40?'amber':'red');
        });
      };
      rowsContainer.addEventListener('input', e=>{
        const f = e.target.dataset.f;
        if(['accepted','rejected','startKm','endKm','orders','systemRejected','driverRejected'].includes(f)) recompute();
      });
      dateInp.addEventListener('change', ()=>{
        const newDate = dateInp.value;
        if(!newDate) return;
        rowsContainer.innerHTML = buildRows(newDate);
        recompute();
        const rt = root.querySelector('#regTime');
        if(rt) rt.value = formatDateTime(new Date().toISOString());
      });
      recompute();
    },
    onSubmit(root){
      const date = root.querySelector('#bulkDate').value;
      const err = root.querySelector('#drErr');
      if(!date){ err.textContent = t('msg_required'); err.style.display='block'; return false; }
      let saved = 0;
      $$('[data-rep-row]', root).forEach(row=>{
        const repId = row.dataset.repRow;
        const ordersRaw = row.querySelector('[data-f=orders]').value;
        const sysRejRaw = row.querySelector('[data-f=systemRejected]').value;
        const drvRejRaw = row.querySelector('[data-f=driverRejected]').value;
        const hoursRaw = row.querySelector('[data-f=hours]').value;
        const startKmRaw = row.querySelector('[data-f=startKm]').value;
        const endKmRaw = row.querySelector('[data-f=endKm]').value;
        const accepted = num(row.querySelector('[data-f=accepted]').value);
        const rejected = num(row.querySelector('[data-f=rejected]').value);
        const notes = row.querySelector('[data-f=notes]').value.trim();
        const isEmpty = ordersRaw === '' && hoursRaw === '' && !accepted && !rejected &&
                        startKmRaw === '' && endKmRaw === '' && !notes &&
                        sysRejRaw === '' && drvRejRaw === '';
        if(isEmpty) return;
        const orders = num(ordersRaw);
        const systemRejected = num(sysRejRaw);
        const driverRejected = num(drvRejRaw);
        const totalOrders = orders + systemRejected + driverRejected;
        const deliveryRate = totalOrders > 0 ? Math.round((orders/totalOrders)*100) : 0;
        const hours = num(hoursRaw);
        const violations = accepted + rejected;
        const rating = calcRating(orders);
        const startKm = startKmRaw === '' ? '' : num(startKmRaw);
        const endKm = endKmRaw === '' ? '' : num(endKmRaw);
        const totalKm = (startKm !== '' && endKm !== '') ? Math.max(0, endKm - startKm) : '';
        const existing = db.reports.find(x=> x.repId===repId && x.date===date);
        if(existing){
          Object.assign(existing, { orders, systemRejected, driverRejected, totalOrders, deliveryRate,
            hours, violations, accepted, rejected, rating,
            startKm, endKm, totalKm, notes: notes || '', updatedAt: new Date().toISOString() });
        } else {
          db.reports.push({
            id: uid(), repId, date, orders, systemRejected, driverRejected, totalOrders, deliveryRate,
            hours, startTime:'', endTime:'',
            startKm, endKm, totalKm,
            violations, accepted, rejected, rating,
            notes: notes || '',
            createdAt: new Date().toISOString()
          });
        }
        saved++;
      });
      if(!saved){
        err.textContent = t('msg_bulk_empty'); err.style.display='block'; return false;
      }
      saveDB(); render();
      addNotif('تقرير يومي', `${saved} ${t('nav_reps')} — ${date}`, 'ok');
      toast(t('msg_report_sent'), 'ok');
      if(isCloudReady()){
        if(isSupervisorAutoSync()) pushToCloud(true);
        else fullSync(true);
      }
      return true;
    }
  });
}

        <input type="text" readonly value="${rec?num(rec.deliveryRate||0)+'%':'0%'}" id="delivRateOut"></div>
      <div class="field"><label>${t('fld_hours')} <span class="req">*</span></label>
        <input type="number" name="hours" min="0" step="0.1" required value="${rec?rec.hours:''}" placeholder="0.0"></div>
      <div class="field"><label>${t('fld_start_km_report')}</label>
        <input type="number" name="startKm" min="0" step="1" value="${startKmVal}" id="sKmInp" placeholder="0"></div>
      <div class="field"><label>${t('fld_end_km_report')}</label>
        <input type="number" name="endKm" min="0" step="1" value="${endKmVal}" id="eKmInp" placeholder="0"></div>
      <div class="field"><label>${t('fld_total_km')} <span class="small muted">${t('fld_auto_total')}</span></label>
        <input type="number" name="totalKm" readonly value="${rec && rec.totalKm!=='' ? num(rec.totalKm) : ''}" id="tKmOut"></div>
      <div class="field"><label>${t('fld_start')} ${t('fld_optional')}</label>
        <input type="time" name="startTime" value="${rec?rec.startTime||'':''}"></div>
      <div class="field"><label>${t('fld_end')} ${t('fld_optional')}</label>
        <input type="time" name="endTime" value="${rec?rec.endTime||'':''}"></div>
      <div class="field"><label>${t('fld_rating')} (A-F)</label>
        <div style="display:flex;align-items:center;gap:8px;padding:6px 0">
          <span class="chip grade ${rec?rec.rating||calcRating(rec.orders):calcRating(0)}" id="ratingChip">${rec?rec.rating||calcRating(rec.orders):calcRating(0)}</span>
        </div></div>
      <div class="field"><label>${t('fld_accepted')} <span class="req">*</span></label>
        <input type="number" name="accepted" min="0" step="1" required value="${rec?rec.accepted:0}" id="accInp"></div>
      <div class="field"><label>${t('fld_rejected')} <span class="req">*</span></label>
        <input type="number" name="rejected" min="0" step="1" required value="${rec?rec.rejected:0}" id="rejInp"></div>
      <div class="field"><label>${t('kpi_violations')} <span class="small muted">${t('fld_auto_total')}</span></label>
        <input type="number" name="violations" readonly value="${rec?rec.violations:0}" id="violOut"></div>
      <div class="field" style="grid-column:1/-1"><label>${t('fld_notes')}</label>
        <textarea name="notes" rows="2">${esc(rec?.notes||'')}</textarea></div>
      <div id="rErr" class="err" style="grid-column:1/-1;display:none"></div>
    </form>`;
  openModal({
    title: rec ? `${t('btn_edit')} — ${t('t_daily')}` : `${t('btn_create_report')}`,
    body,
    onMount(root){
      const form = $('#rForm', root);
      const ordersInp = form.orders;
      const accInp = form.accepted;
      const rejInp = form.rejected;
      const sKm = $('#sKmInp', root);
      const eKm = $('#eKmInp', root);
      const tKm = $('#tKmOut', root);
      const violOut = $('#violOut', root);
      const sysRejInp = $('#sysRejInp', root);
      const drvRejInp = $('#drvRejInp', root);
      const totalOrdOut = $('#totalOrdOut', root);
      const delivRateOut = $('#delivRateOut', root);
      const upd = ()=>{
        violOut.value = num(accInp.value) + num(rejInp.value);
        const l = calcRating(num(ordersInp.value));
        const chip = $('#ratingChip', root);
        if(chip){ chip.className = 'chip grade ' + l; chip.textContent = l; }
        if(sKm.value !== '' && eKm.value !== ''){
          tKm.value = Math.max(0, num(eKm.value) - num(sKm.value));
        } else {
          tKm.value = '';
        }
        const delivered = num(ordersInp.value);
        const sysR = num(sysRejInp.value);
        const drvR = num(drvRejInp.value);
        const total = delivered + sysR + drvR;
        const rate = total > 0 ? Math.round((delivered/total)*100) : 0;
        totalOrdOut.value = total;
        delivRateOut.value = rate + '%';
      };
      ordersInp.addEventListener('input', upd);
      accInp.addEventListener('input', upd);
      rejInp.addEventListener('input', upd);
      sKm.addEventListener('input', upd);
      eKm.addEventListener('input', upd);
      sysRejInp.addEventListener('input', upd);
      drvRejInp.addEventListener('input', upd);
      upd();
    },
    onSubmit(root){
      const form = $('#rForm', root), err = $('#rErr', root);
      const data = Object.fromEntries(new FormData(form));
      const req = ['repId','date','orders','hours','accepted','rejected'];
      if(req.some(k=> data[k]==='' || data[k]==null)){
        err.textContent = t('msg_required'); err.style.display='block'; return false;
      }
      if(isSupervisor() && !isRepVisible(data.repId)){
        err.textContent = t('msg_no_perm'); err.style.display='block'; return false;
      }
      const a = num(data.accepted), rj = num(data.rejected);
      const v = a + rj;
      const hours = num(data.hours);
      const rating = calcRating(num(data.orders));
      const startKm = data.startKm === '' ? '' : num(data.startKm);
      const endKm = data.endKm === '' ? '' : num(data.endKm);
      const totalKm = (startKm !== '' && endKm !== '') ? Math.max(0, endKm - startKm) : '';
      const systemRejected = num(data.systemRejected);
      const driverRejected = num(data.driverRejected);
      const totalOrders = num(data.orders) + systemRejected + driverRejected;
      const deliveryRate = totalOrders > 0 ? Math.round((num(data.orders)/totalOrders)*100) : 0;
      if(rec){
        if(!canEditSection('daily')){ err.textContent = t('msg_no_perm'); err.style.display='block'; return false; }
        Object.assign(rec, {
          repId:data.repId, date:data.date, orders:num(data.orders),
          systemRejected, driverRejected, totalOrders, deliveryRate,
          startTime:data.startTime||'', endTime:data.endTime||'', hours,
          startKm, endKm, totalKm,
          violations:v, accepted:a, rejected:rj, rating, notes:data.notes||'',
          updatedAt: new Date().toISOString()
        });
        addNotif('تعديل تقرير', `${repName(data.repId)} — ${data.date}`, 'warn');
        toast(t('msg_updated'),'ok');
      } else {
        db.reports.push({
          id:uid(), repId:data.repId, date:data.date, orders:num(data.orders),
          systemRejected, driverRejected, totalOrders, deliveryRate,
          startTime:data.startTime||'', endTime:data.endTime||'', hours,
          startKm, endKm, totalKm,
          violations:v, accepted:a, rejected:rj, rating, notes:data.notes||'',
          createdAt:new Date().toISOString()
        });
        addNotif('تقرير جديد', `${repName(data.repId)} — ${data.orders} طلب (${rating})`, 'ok');
        toast(t('msg_report_sent'),'ok');
      }
      saveDB(); render();
      if(isCloudReady()){
        if(isSupervisorAutoSync()) pushToCloud(true);
        else fullSync(true);
      }
      return true;
    }
  });
}

function viewReps(){
  const q = (state.repQuery||'').trim().toLowerCase();
  const base = visibleReps();
  const rows = base.filter(r=> !q ||
      [r.name,r.phone,r.code,r.region,r.app,r.plate||'', carName(r.carId)].join(' ').toLowerCase().includes(q));
  const mode = state.viewModes.reps || 'table';
  const canEdit = canEditSection('reps');
  const allReports = visibleReports();

  const selectedDay = state.repsDay || todayStr();
  const dayReports = allReports.filter(r=>r.date===selectedDay);
  const dayRepOrders = (repId)=> sum(dayReports.filter(r=>r.repId===repId),'orders');
  const prevDay = addDaysStr(selectedDay, -1);
  const prevDayReports = allReports.filter(r=>r.date===prevDay);
  const prevDayRepOrders = (repId)=> sum(prevDayReports.filter(r=>r.repId===repId),'orders');

  const tableHTML = `
    <div class="tbl-wrap" style="border:0"><table><thead><tr>
      <th>${t('fld_name')}</th><th>${t('fld_code')}</th><th>${t('fld_phone')}</th>
      <th>${t('fld_app')}</th><th>${t('fld_car_assigned')}</th>
      <th>${t('fld_supervisor')}</th><th>${t('fld_region')}</th>
      <th>${t('fld_delivered_orders')}</th>
      ${canEdit?`<th></th>`:''}
    </tr></thead><tbody>
      ${rows.length ? rows.map(r=>`<tr>
        <td><b>${esc(r.name)}</b></td>
        <td><span class="chip gray">${esc(r.code)}</span></td>
        <td class="small" dir="ltr">${esc(r.phone)}</td>
        <td class="small"><span class="chip blue">${esc(r.app||'—')}</span></td>
        <td class="small">${carCell(r)}</td>
        <td>${r.supervisorId?`<span class="chip violet">${esc(supName(r.supervisorId))}</span>`:'<span class="chip red">—</span>'}</td>
        <td class="small">${esc(r.region)}</td>
        <td><b>${dayRepOrders(r.id)}</b> ${deltaChip(dayRepOrders(r.id), prevDayRepOrders(r.id))}</td>
        ${canEdit?`<td>${actionsCell(r)}</td>`:''}
      </tr>`).join('') : emptyRow(canEdit?9:8)}
    </tbody></table></div>`;
  const cardsHTML = `
    <div class="cards-grid">
      ${rows.length ? rows.map(r=>`
        <div class="item-card">
          <div class="ic-header">
            <div class="ic-avatar">${esc((r.name||'?').charAt(0))}</div>
            <div style="flex:1;min-width:0">
              <div class="ic-name">${esc(r.name)}</div>
              <div class="ic-sub" dir="ltr">${esc(r.phone)}</div>
            </div>
          </div>
          <div class="ic-rows">
            <div><span class="k">${t('fld_code')}</span><span class="v">${esc(r.code)}</span></div>
            <div><span class="k">${t('fld_app')}</span><span class="v"><span class="chip blue">${esc(r.app||'—')}</span></span></div>
            <div><span class="k">${t('fld_car_assigned')}</span><span class="v">${r.carId?esc(carName(r.carId)):'—'}</span></div>
            <div><span class="k">${t('fld_supervisor')}</span><span class="v">${esc(supName(r.supervisorId))}</span></div>
            <div><span class="k">${t('fld_region')}</span><span class="v">${esc(r.region)}</span></div>
            <div><span class="k">${t('fld_delivered_orders')}</span><span class="v">${dayRepOrders(r.id)} ${deltaChip(dayRepOrders(r.id), prevDayRepOrders(r.id))}</span></div>
          </div>
          ${canEdit?`<div class="ic-actions">
            <button class="btn btn-ghost btn-sm" data-edit-rep="${r.id}">✏️</button>
            <button class="btn btn-ghost btn-sm" data-del-rep="${r.id}">🗑️</button>
          </div>`:''}
        </div>`).join('') : `<div class="empty" style="grid-column:1/-1">${t('no_data')}</div>`}

  const addBtn = canEdit ? `<button class="btn btn-primary btn-sm" id="addRep">➕ ${t('btn_add')}</button>` : '';

function afterReps(){
  $('#repDayPicker')?.addEventListener('change', e=>{
    state.repsDay = e.target.value || todayStr();
    render();
  });
  $('#repTodayBtn')?.addEventListener('click', ()=>{
    state.repsDay = todayStr();
    render();
  });
  $('#addRep') && ($('#addRep').onclick = ()=> repModal());
  $('#repSearch') && ($('#repSearch').oninput = e=>{ state.repQuery = e.target.value; render();
    const el = $('#repSearch'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length);} });
  bindViewToggles();
  if(!canEditSection('reps')) return;
  $$('[data-edit-rep]').forEach(b=> b.onclick = ()=> repModal(b.dataset.editRep));
  $$('[data-del-rep]').forEach(b=> b.onclick = ()=>{
    if(!confirm(t('msg_confirm_del'))) return;
    const id = b.dataset.delRep, nm = repName(id);
    db.reps = db.reps.filter(r=>r.id!==id);
    cleanupRelations(); saveDB(); render();
    addNotif('حذف سائق', nm, 'err');
    toast(t('msg_deleted'),'ok');
    if(isCloudReady()){
      if(isSupervisorAutoSync()) pushToCloud(true); else fullSync(true);
    }
  });
}
function repModal(id){
  if(!canEditSection('reps')){ toast(t('msg_no_perm'),'warn'); return; }
  const rec = id ? getRep(id) : null;
  const body = `<form id="repForm" class="form-grid" novalidate>
    <div class="field"><label>${t('fld_name')} <span class="req">*</span></label>
      <input name="name" required value="${esc(rec?.name||'')}"></div>
    <div class="field"><label>${t('fld_phone')} <span class="req">*</span></label>
      <input name="phone" required dir="ltr" value="${esc(rec?.phone||'')}" placeholder="05XXXXXXXX"></div>
    <div class="field"><label>${t('fld_code')} <span class="req">*</span></label>
      <input name="code" required dir="ltr" value="${esc(rec?.code||'DR-'+String(1000+db.reps.length+1))}"></div>
    <div class="field"><label>${t('fld_app')} <span class="req">*</span></label>
      <select name="app" required>
        <option value="">${t('fld_none')}</option>
        ${APP_OPTIONS.map(o=>`<option value="${o}" ${rec&&rec.app===o?'selected':''}>${o}</option>`).join('')}
      </select></div>
    <div class="field" style="grid-column:1/-1">
      <label>${t('fld_car_assigned')} <span class="small muted">${t('fld_optional')}</span></label>
      <input type="text" id="carSearchInput" placeholder="🔍 ${t('search_car')}" style="margin-bottom:8px">
      <select name="carId" id="carSelect">
        <option value="">${t('fld_none')}</option>
        ${db.cars.map(c=>`<option value="${c.id}" ${rec&&rec.carId===c.id?'selected':''} data-search="${esc((c.brand+' '+c.model+' '+c.plate).toLowerCase())}">${esc(c.brand)} ${esc(c.model)} — ${esc(c.plate)}${c.assignedRepId && (!rec || c.assignedRepId!==rec.id) ? ' (مُسندة لسائق آخر)' : ''}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>${t('fld_supervisor')} <span class="req">*</span></label>
      <select name="supervisorId" required><option value="">${t('fld_none')}</option>
        ${db.supervisors.map(s=>`<option value="${s.id}" ${rec&&rec.supervisorId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    <div class="field"><label>${t('fld_region')} <span class="req">*</span></label>
      <input name="region" required value="${esc(rec?.region||'')}"></div>
    <div class="field" style="grid-column:1/-1"><label>${t('fld_created')}</label>
      <input type="text" readonly dir="ltr" value="${rec?esc(rec.createdAt||''):new Date().toISOString()}"></div>
    <div id="repErr" class="err" style="grid-column:1/-1;display:none"></div>
  </form>`;
  openModal({
    title: rec ? `${t('btn_edit')} — ${t('nav_reps')}` : `${t('btn_add')} — ${t('nav_reps')}`,
    body,
    onMount(root){
      const search = root.querySelector('#carSearchInput');
      const sel = root.querySelector('#carSelect');
      if(search && sel){
        const options = [...sel.options];
        search.addEventListener('input', ()=>{
          const q = search.value.trim().toLowerCase();
          options.forEach(op=>{
            if(op.value === '') return;
            const match = !q || (op.dataset.search||'').includes(q);
            op.style.display = match ? '' : 'none';
          });
          const cur = options.find(o=>o.value===sel.value);
          if(cur && cur.style.display==='none' && cur.value) cur.style.display = '';
        });
      }
    },
    onSubmit(root){
      const form = $('#repForm', root), err = $('#repErr', root);
      const d = Object.fromEntries(new FormData(form));
      if(!d.name || !d.phone || !d.code || !d.app || !d.supervisorId || !d.region){
        err.textContent = t('msg_required'); err.style.display='block'; return false;
      }
      const car = d.carId ? getCar(d.carId) : null;
      const payload = {
        name:d.name, phone:d.phone, code:d.code, app:d.app,
        plate: car ? car.plate : (rec?.plate||''),
        startKm: rec ? rec.startKm : 0,
        carId: d.carId || '',
        supervisorId:d.supervisorId, region:d.region,
        updatedAt: new Date().toISOString()
      };
      if(rec && rec.carId && rec.carId !== payload.carId){
        const oldCar = getCar(rec.carId);
        if(oldCar && oldCar.assignedRepId === rec.id) oldCar.assignedRepId = '';
      }
      if(rec){
        Object.assign(rec, payload);
        if(payload.carId){
          const newCar = getCar(payload.carId);
          if(newCar){
            if(newCar.assignedRepId && newCar.assignedRepId !== rec.id){
              const oldRep = getRep(newCar.assignedRepId);
              if(oldRep) oldRep.carId = '';
            }
            newCar.assignedRepId = rec.id;
          }
        }
        addNotif('تعديل سائق', d.name, 'warn'); toast(t('msg_updated'),'ok');
      } else {
        const newRep = {
          id:uid(), ...payload, status:'active',
          createdAt: new Date().toISOString()
        };
        db.reps.push(newRep);
        if(payload.carId){
          const newCar = getCar(payload.carId);
          if(newCar){
            if(newCar.assignedRepId && newCar.assignedRepId !== newRep.id){
              const oldRep = getRep(newCar.assignedRepId);
              if(oldRep){ oldRep.carId=''; }
            }
            newCar.assignedRepId = newRep.id;
          }
        }
        addNotif('سائق جديد', d.name, 'ok'); toast(t('msg_saved'),'ok');
      }
      saveDB(); render();
      if(isCloudReady()){
        if(isSupervisorAutoSync()) pushToCloud(true); else fullSync(true);
      }
      return true;
    }
  });
}

function viewSupervisors(){
  const showCreds = db.settings.showCredentials && isOwner();
  const mode = state.viewModes.supervisors || 'table';
  const sups = isOwner() ? db.supervisors : db.supervisors.filter(s=>s.id===state.user.id);
  const credCell = (s)=>{
    if(!isOwner()) return '<span class="small muted">—</span>';
    if(!showCreds) return `<span class="chip gray">${t('hidden_creds')}</span>`;
    return `<div style="display:flex;flex-direction:column;gap:2px;font-size:11.5px" dir="ltr">
      <span>${esc(s.email||'—')}</span><span class="muted">${esc(s.phone||'')}</span></div>`;
  };
  const toggleHTML = isOwner() ? `<button class="btn btn-sm" id="toggleCreds">${showCreds?'🙈 '+t('credentials_hide'):'👁️ '+t('credentials_show')}</button>` : '';
  const actionsCell = (s)=>{
    if(!isOwner()) return '<span class="small muted">—</span>';
    return `<div class="tbl-actions">
      <button class="btn btn-ghost btn-sm" data-assign="${s.id}" title="إسناد السائقين">🔗</button>
      <button class="btn btn-ghost btn-sm" data-edit-sup="${s.id}">✏️</button>
      <button class="btn btn-ghost btn-sm" data-del-sup="${s.id}">🗑️</button>
    </div>`;
  };
  const weekStartStr = addDaysStr(todayStr(), -6);
  const prevWeekStartStr = addDaysStr(todayStr(), -13);
  const prevWeekEndStr = addDaysStr(todayStr(), -7);
  const weekSup = (supId)=>{
    const reps = db.reps.filter(r=>r.supervisorId===supId);
    const rs = db.reports.filter(x=> reps.some(r=>r.id===x.repId) && x.date>=weekStartStr);
    return { orders: sum(rs,'orders'), hours: round1(sum(rs,'hours')) };
  };
  const prevWeekSup = (supId)=>{
    const reps = db.reps.filter(r=>r.supervisorId===supId);
    const rs = db.reports.filter(x=> reps.some(r=>r.id===x.repId) && x.date>=prevWeekStartStr && x.date<=prevWeekEndStr);
    return { orders: sum(rs,'orders'), hours: round1(sum(rs,'hours')) };
  };
  const permChips = (s)=>{
    const p = s.permissions || [];
    const list = [
      ...NAV.filter(n=> p.includes(n.id)).map(n=> `<span class="chip violet" style="margin:2px">${esc(navLabel(n.id))}</span>`),
      ...EXTRA_PERMS.filter(e=> p.includes(e.id)).map(e=> `<span class="chip amber" style="margin:2px">${esc(t(e.key))}</span>`)
    ];
    return list.length ? list.join('') : '<span class="chip red">—</span>';
  };
  const tableHTML = `
    <div class="tbl-wrap" style="border:0"><table><thead><tr>
      <th>${t('fld_name')}</th><th>${t('fld_code')}</th>
      ${isOwner()?`<th>${t('fld_email')}</th>`:''}
      <th>${t('nav_reps')}</th><th>${t('fld_orders')} (7d)</th><th>${t('fld_hours')} (7d)</th>
      <th>${t('fld_permissions')}</th><th></th>
    </tr></thead><tbody>
      ${sups.length ? sups.map(s=>{
        const reps = db.reps.filter(r=>r.supervisorId===s.id);
        const cw = weekSup(s.id);
        const pw = prevWeekSup(s.id);

function afterSupervisors(){
  bindViewToggles();
  $('#toggleCreds') && ($('#toggleCreds').onclick = ()=>{
    db.settings.showCredentials = !db.settings.showCredentials;
    saveDB(); render();
    toast(db.settings.showCredentials?'بيانات الدخول ظاهرة':'تم إخفاء بيانات الدخول','ok');
  });
  $('#addSup') && ($('#addSup').onclick = ()=> supModal());
  $('#permBtn2') && ($('#permBtn2').onclick = ()=> permModal());
  if(!isOwner()) return;
  $$('[data-edit-sup]').forEach(b=> b.onclick = ()=> supModal(b.dataset.editSup));
  $$('[data-del-sup]').forEach(b=> b.onclick = ()=>{
    if(!confirm(t('msg_confirm_del'))) return;
    const s = getSup(b.dataset.delSup);
    db.supervisors = db.supervisors.filter(x=>x.id!==b.dataset.delSup);
    cleanupRelations(); saveDB(); render();
    addNotif('حذف مشرف', s?.name||'', 'err');
    toast(t('msg_deleted'),'ok');
    if(isCloudReady()) pushToCloud(true);
  });
  $$('[data-assign]').forEach(b=> b.onclick = ()=> assignModal(b.dataset.assign));
  $$('[data-quick-sup]').forEach(sel=> sel.onchange = ()=>{
    const r = getRep(sel.dataset.quickSup);
    if(r){
      r.supervisorId = sel.value; saveDB();
      addNotif('تغيير مشرف', `${r.name} → ${r.supervisorId?supName(r.supervisorId):'بدون'}`, 'info');
      toast(t('msg_updated'),'ok'); render();
      if(isCloudReady()) pushToCloud(true);
    }
  });
}
function supModal(id){
  if(!isOwner()){ toast(t('msg_no_perm'),'warn'); return; }
  const rec = id ? getSup(id) : null;
  const p = rec?.permissions || ['dashboard'];
  const body = `<form id="supForm" class="form-grid" novalidate>
    <div class="field"><label>${t('fld_name')} <span class="req">*</span></label>
      <input name="name" required value="${esc(rec?.name||'')}"></div>
    <div class="field"><label>${t('fld_phone')} <span class="req">*</span></label>
      <input name="phone" required dir="ltr" value="${esc(rec?.phone||'')}"></div>
    <div class="field"><label>${t('fld_code')} <span class="req">*</span></label>
      <input name="code" required dir="ltr" value="${esc(rec?.code||'SUP-'+String(db.supervisors.length+1).padStart(3,'0'))}"></div>
    <div class="field"><label>${t('fld_email')} <span class="req">*</span></label>
      <input type="email" name="email" required dir="ltr" value="${esc(rec?.email||'')}" placeholder="supervisor@rep.com">
      <span class="hint">يُستخدم لتسجيل الدخول</span></div>
    <div class="field"><label>${t('fld_password')} ${rec?'':'<span class="req">*</span>'}</label>
      <input type="text" name="password" ${rec?'':'required'} value="" placeholder="${rec?'اتركها فارغة للإبقاء':'••••••'}"></div>
    <div class="field" style="grid-column:1/-1"><label>${t('fld_sections')}</label>
      <div class="checkbox-list">
        ${NAV.filter(n=>n.id!=='supervisors').map(n=>`<label class="perm-check">
          <input type="checkbox" name="perm_${n.id}" ${(!rec || p.includes(n.id))?'checked':''}>
          ${n.icon} ${t(n.key)}
        </label>`).join('')}
      </div></div>
    <div class="field" style="grid-column:1/-1"><label>${t('perm_extra')}</label>
      <div class="checkbox-list" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
        ${EXTRA_PERMS.map(e=>`<label class="perm-check">
          <input type="checkbox" name="extra_${e.id}" ${(!rec || p.includes(e.id))?'checked':''}>
          ${e.icon} ${t(e.key)}
        </label>`).join('')}
      </div></div>
    <div id="supErr" class="err" style="grid-column:1/-1;display:none"></div>
  </form>`;
  openModal({
    title: rec ? `${t('btn_edit')} — ${t('nav_supervisors')}` : `${t('btn_add')} — ${t('nav_supervisors')}`,
    body,
    onSubmit(root){
      const form = $('#supForm', root), err = $('#supErr', root);
      const d = Object.fromEntries(new FormData(form));
      if(!d.name || !d.phone || !d.code || !d.email){
        err.textContent = t('msg_required'); err.style.display='block'; return false;
      }
      const perms = [
        ...NAV.filter(n=> d['perm_'+n.id]).map(n=>n.id),
        ...EXTRA_PERMS.filter(e=> d['extra_'+e.id]).map(e=>e.id)
      ];
      if(rec){
        const patch = {name:d.name, phone:d.phone, code:d.code, email:d.email, permissions:perms, updatedAt:new Date().toISOString()};
        if(d.password) patch.password = hashPwd(d.password);
        Object.assign(rec, patch);
        addNotif('تعديل مشرف', d.name, 'warn'); toast(t('msg_updated'),'ok');
      } else {
        if(!d.password){ err.textContent = t('msg_required'); err.style.display='block'; return false; }
        db.supervisors.push({id:uid(), name:d.name, phone:d.phone, code:d.code, email:d.email,
          password:hashPwd(d.password), permissions:perms, goals: defaultGoals(), createdAt:new Date().toISOString()});
        addNotif('مشرف جديد', d.name, 'ok'); toast(t('msg_saved'),'ok');
      }
      saveDB(); render();
      if(isCloudReady()) pushToCloud(true);
      return true;
    }
  });
}
function assignModal(supId){
  if(!isOwner()){ toast(t('msg_no_perm'),'warn'); return; }
  const sup = getSup(supId);
  if(!sup) return;
  const body = `
    <div class="small muted" style="margin-bottom:12px">اختر السائقين التابعين للمشرف: <b>${esc(sup.name)}</b></div>
    <div class="checkbox-list" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));max-height:340px">
      ${db.reps.map(r=>`<label class="perm-check">
        <input type="checkbox" data-asg="${r.id}" ${r.supervisorId===supId?'checked':''}>
        ${esc(r.name)} <span class="muted small">(${esc(r.region)})</span>
      </label>`).join('') || `<div class="empty">${t('no_data')}</div>`}
    </div>`;
  openModal({
    title:`🔗 ${t('nav_reps')} ← ${esc(sup.name)}`,
    body, submitText:t('btn_save'),
    onSubmit(root){
      let changed = 0;
      $$('[data-asg]', root).forEach(cb=>{
        const r = getRep(cb.dataset.asg);
        if(!r) return;
        if(cb.checked && r.supervisorId !== supId){ r.supervisorId = supId; changed++; }
        else if(!cb.checked && r.supervisorId===supId){ r.supervisorId = ''; changed++; }
      });
      saveDB(); render();
      if(changed) addNotif('إسناد سائقين', `${changed} سائق → ${sup.name}`, 'info');
      toast(t('msg_updated'),'ok');
      if(isCloudReady() && changed) pushToCloud(true);
      return true;
    }
  });
}

function currentKm(carId){
  const us = db.usage.filter(u=>u.carId===carId);
  if(!us.length) return 0;
  const last = us.sort((a,b)=> (b.startDate||'').localeCompare(a.startDate||''))[0];
  return num(last.endKm || last.startKm);
}

function analyticsFilterRange(){
  const f = state.analyticsFilter;
  switch(f.type){
    case 'rep': return { from:'', to:'', repId:f.repId };
    case 'day': return { from:f.date, to:f.date };
    case 'week': { const s = weekStartOf(f.weekDate); return { from:s, to:addDaysStr(s,6) }; }
    case 'month': { const s = f.month+'-01'; return { from:s, to:monthEndOf(s) }; }
    case 'range_days': return { from:f.d1, to:f.d2 };
    case 'range_weeks': { const s=weekStartOf(f.w1); const e=addDaysStr(weekStartOf(f.w2),6); return { from:s, to:e }; }
    case 'range_months': { const s=f.m1+'-01'; const e=monthEndOf(f.m2+'-01'); return { from:s, to:e }; }
    default: return { from:'', to:'' };
  }
}
function applyAnalyticsFilter(reports){
  const f = state.analyticsFilter;
  const r = analyticsFilterRange();
  let out = reports;
  if(r.from && r.to) out = out.filter(x=> x.date >= r.from && x.date <= r.to);
  else if(r.from) out = out.filter(x=> x.date >= r.from);
  else if(r.to) out = out.filter(x=> x.date <= r.to);
  if(f.type==='rep' && f.repId) out = out.filter(x=> x.repId === f.repId);
  return out;
}
function analyticsPrevRange(){
  const f = state.analyticsFilter;
  if(f.type==='all') return null;
  if(f.type==='rep'){
    const today = todayStr();
    const from = addDaysStr(today, -29);
    const pTo = addDaysStr(from, -1);
    const pFrom = addDaysStr(pTo, -29);
    return { from:pFrom, to:pTo, repId:f.repId };
  }
  const r = analyticsFilterRange();
  if(!r.from || !r.to) return null;
  const fromD = new Date(r.from+'T00:00:00');
  const toD = new Date(r.to+'T00:00:00');
  const days = Math.round((toD - fromD)/86400000) + 1;
  const pTo = addDaysStr(r.from, -1);
  const pFrom = addDaysStr(pTo, -(days-1));
  return { from:pFrom, to:pTo };
}
function applyPrevFilter(reports, pr){
  if(!pr) return [];
  let out = reports.filter(x=> x.date >= pr.from && x.date <= pr.to);
  if(pr.repId) out = out.filter(x=> x.repId === pr.repId);
  return out;
}

function goalsForTarget(targetId){
  if(targetId === 'owner') return db.goals || defaultGoals();
  const s = getSup(targetId);
  return (s && s.goals) || defaultGoals();
}
function computeGoalActuals(period, supId){
  const start = period==='daily' ? todayStr() : period==='weekly' ? weekStart() : monthStart();
  const reports = supId ? reportsForSupervisor(supId) : visibleReports();
  const reps = supId ? repsForSupervisor(supId) : visibleReps();
  const rs = reports.filter(r=> r.date >= start);
  const daysCount = Math.max(1, Math.ceil((Date.now()-new Date(start).getTime())/864e5));
  return {
    orders: sum(rs,'orders'),
    hours: round1(sum(rs,'hours')),
    violations: sum(rs,'violations'),
    acceptRate: sum(rs,'violations') ? Math.round((sum(rs,'accepted')/sum(rs,'violations'))*100) : 100,
    perRepDaily: reps.length ? round1(sum(rs,'orders') / reps.length / daysCount) : 0,
    reps: reps.length,
    reportsCount: rs.length
  };
}

  const pct = target ? Math.round((actual/target)*100) : 0;
  const exceed = inverse ? (actual <= target) : (actual >= target);
  const status = exceed ? t('goals_exceeded') : (pct >= 70 ? t('goals_on_track') : t('goals_behind'));
  const remaining = Math.max(0, target - actual);
  return `<div class="goal-card">

    </div>

    <div class="goal-pct" style="color:${exceed?'#047857':pct>=70?'#1d4ed8':'#b45309'}">${pct}% · ${status}</div>

function toolAction(act){
  switch(act){
    case 'lang':
      state.lang = state.lang==='ar' ? 'en' : 'ar';
      render(); toast(state.lang==='ar'?'تم التبديل إلى العربية':'Switched to English','ok');
      break;
    case 'sync':
      if(!isCloudReady()){ settingsModal(); return; }
      fullSync().then(ok => { if(ok) render(); });
      break;
    case 'share': copyShareLink(); break;
    case 'print': window.print(); break;
    case 'export': exportJSON(); break;
    case 'import':
      if(!canEditSection('daily')){ toast(t('msg_no_perm'),'warn'); return; }
      openImportDialog(); break;
    case 'reset':
      if(!isOwner()){ toast(t('msg_no_perm'),'warn'); return; }
      if(confirm(t('msg_confirm_reset'))){
        db = seedDB(); saveDB(); state.section='dashboard'; render();
        toast(t('msg_reset'),'ok');
        if(isCloudReady()) pushToCloud(true);
      } break;
    case 'refresh':
      if(isCloudReady()){ fullSync().then(ok => { if(ok) render(); }); }
      else { db = loadDB() || db; applySettings(); render(); toast(t('msg_updated'),'ok'); }
      break;
    case 'settings': settingsModal(); break;
  }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `drivers-performance-${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast(t('btn_export')+' ✓','ok');
}
function openImportDialog(){
  if(!canEditSection('daily')){ toast(t('msg_no_perm'),'warn'); return; }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const data = JSON.parse(rd.result);
        db = normalizeDB(data);
        cleanupRelations(); saveDB(); render();
        toast(t('msg_imported'),'ok');
        if(isCloudReady()){
          if(isSupervisorAutoSync()) pushToCloud(true); else fullSync(true);
        }
      }catch(err){ toast(t('msg_import_err'),'err'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

function pwdModal(){
  if(!state.user) return;
  const isOwnerUser = isOwner();
  const body = `
    <form id="pwdForm" class="form-grid" novalidate>
      <div class="field" style="grid-column:1/-1"><label>${t('pwd_current')} <span class="req">*</span></label>
        <input type="password" name="currentPwd" required autocomplete="current-password"></div>
      <div class="field"><label>${t('pwd_new')} <span class="req">*</span></label>
        <input type="password" name="newPwd" required autocomplete="new-password"></div>
      <div class="field"><label>${t('pwd_confirm')} <span class="req">*</span></label>
        <input type="password" name="confirmPwd" required autocomplete="new-password"></div>
      ${isOwnerUser?`<div class="small muted" style="grid-column:1/-1;padding:10px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--border)">${t('pwd_owner_note')}</div>`:''}
      <div id="pErr" class="err" style="grid-column:1/-1;display:none"></div>
    </form>`;
  openModal({
    title:`🔑 ${t('pwd_section')}`, body, submitText:t('pwd_save'),
    onSubmit(root){
      const d = Object.fromEntries(new FormData($('#pwdForm', root)));
      const err = $('#pErr', root);
      if(!d.currentPwd || !d.newPwd || !d.confirmPwd){
        err.textContent = t('msg_required'); err.style.display='block'; return false;
      }
      const curHash = hashPwd(d.currentPwd);
      let stored = null;
      if(isOwnerUser) stored = db.auth?.owner?.password;
      else {
        const sup = db.supervisors.find(s=>s.id===state.user.id);
        stored = sup?.password;
      }
      if(stored !== curHash){ err.textContent = t('msg_pwd_wrong'); err.style.display='block'; return false; }
      if(d.newPwd.length < 4){ err.textContent = t('msg_pwd_short'); err.style.display='block'; return false; }
      if(d.newPwd !== d.confirmPwd){ err.textContent = t('msg_pwd_mismatch'); err.style.display='block'; return false; }
      const newHash = hashPwd(d.newPwd);
      if(isOwnerUser) db.auth.owner.password = newHash;
      else {
        const sup = db.supervisors.find(s=>s.id===state.user.id);
        if(sup) sup.password = newHash;
      }
      saveDB();
      toast(t('msg_pwd_changed'),'ok');
      if(isCloudReady()) pushToCloud(true);
      return true;
    }
  });
}

function openModal({title, body, onSubmit, onMount, submitText, wide}){
  const root = $('#modalRoot');
  root.innerHTML = `
    <div class="overlay" id="ovl">
      <div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3>${title}</h3>
          <button class="icon-btn" id="mClose">✕</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">
          <button class="btn" id="mCancel">${t('btn_cancel')}</button>
          <button class="btn btn-primary" id="mSave">${submitText || t('btn_save')}</button>
        </div>
      </div>
    </div>`;
  const close = ()=> root.innerHTML = '';
  $('#mClose').onclick = close;
  $('#mCancel').onclick = close;
  $('#ovl').onclick = e=>{ if(e.target.id==='ovl') close(); };
  $('#mSave').onclick = ()=>{
    const form = root.querySelector('form');
    if(form && !form.checkValidity()){
      form.querySelectorAll(':invalid')[0]?.focus();
      const err = root.querySelector('.err');
      if(err){ err.textContent = t('msg_required'); err.style.display='block'; }
      return;
    }
    if(onSubmit && onSubmit(root) === false) return;
    close();
  };
  document.addEventListener('keydown', function esc2(e){
    if(e.key==='Escape'){ close(); document.removeEventListener('keydown', esc2); }
  });
  if(onMount) onMount(root);
  root.querySelector('input,select,textarea')?.focus();
}

function closeSidebar(){ $('#sidebar').classList.remove('open'); }

function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function updateFsBtn(){
  const b = $('#fsBtn');
  if(!b) return;
  b.textContent = isFullscreen() ? '🗗' : '⛶';
  b.title = isFullscreen() ? 'إنهاء ملء الشاشة' : 'ملء الشاشة';
}
function toggleFullscreen(silent){
  const el = document.documentElement;
  if(!isFullscreen()){
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(!req){ if(!silent) toast('المتصفح لا يدعم ملء الشاشة','warn'); return; }
    try{
      const p = req.call(el);
      if(p && p.catch) p.catch(()=>{ if(!silent) toast('تعذّر تفعيل ملء الشاشة','warn'); });
    }catch(e){ if(!silent) toast('تعذّر تفعيل ملء الشاشة','warn'); }
  } else {
    const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(ex){ try{ ex.call(document); }catch(e){} }
  }
}

async function init(){
  cloudCfg = loadCloudCfg();
  const fromURL = await readFromURLParams();

  if(fromURL && isCloudReady()){
    showLoadingOverlay('جاري تحميل البيانات من السحابة…','يرجى الانتظار لحظات');
    try{ await pullFromCloud(true); }catch(e){ console.warn('cloud pull failed', e); }
    hideLoadingOverlay();
    if(!db){ db = emptyDB(); saveDB(); }
  } else {
    db = loadDB();
    if(!db){ db = seedDB(); saveDB(); }
  }

  state.dashboardDate = todayStr();
  state.dashboardPeriod = 'daily';
  state.repsDay = todayStr();

  $('#menuBtn').onclick = ()=> $('#sidebar').classList.toggle('open');
  $('#langBtn').onclick = ()=> toolAction('lang');
  $('#topSet').onclick  = ()=> settingsModal();
  $('#btnSet').onclick  = ()=> settingsModal();
  $('#btnPerm').onclick = ()=> permModal();
  $('#btnPwd').onclick  = ()=> pwdModal();
  $('#syncBtn').onclick = ()=>{
    if(!isCloudReady()){ settingsModal(); return; }
    fullSync().then(ok => { if(ok) render(); });
  };
  $('#shareBtn').onclick  = ()=> copyShareLink();
  $('#importBtn').onclick = ()=> toolAction('import');
  $('#exportBtn').onclick = ()=> toolAction('export');
  $('#resetBtn').onclick  = ()=> toolAction('reset');
  $('#waBtn').onclick     = ()=> openWhatsApp();
  $('#printBtn').onclick  = ()=> window.print();
  $('#collapseAllBtn').onclick = ()=> toggleAllCollapse();
  $('#fsBtn').onclick = ()=> toggleFullscreen();
  ['fullscreenchange','webkitfullscreenchange','msfullscreenchange'].forEach(ev=>
    document.addEventListener(ev, updateFsBtn));
  updateFsBtn();

  $('#notifBtn').onclick = (e)=>{ e.stopPropagation(); openNotifPanel(); };
  $('#closeNotif').onclick = (e)=>{ e.stopPropagation(); closeNotifPanel(); };
  $('#markAllRead').onclick = ()=>{
    (db.notifications||[]).forEach(n=> n.read = true);
    saveDB(); renderNotifList(); updateNotifBadge();
    toast('تم تحديد الكل كمقروء','ok');
  };
  document.addEventListener('click', e=>{
    const p = $('#notifPanel');
    if(p.classList.contains('open') && !p.contains(e.target) && !$('#notifBtn').contains(e.target)){
      closeNotifPanel();
    }
  });

  $('#loginForm').addEventListener('submit', e=>{
    e.preventDefault();
    const id = $('#lgId').value.trim();
    const pw = $('#lgPw').value;
    if(!id || !pw){ $('#lgErr').textContent = t('msg_required'); $('#lgErr').style.display='block'; return; }
    if(!doLogin(id, pw)){
      $('#lgErr').textContent = t('msg_login_err'); $('#lgErr').style.display='block';
      toast(t('msg_login_err'),'err');
    }
  });

  let resizeTimer;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=> applySettings(), 120);
  });
  setTimeout(()=> applySettings(), 50);

  const sess = loadSession();
  if(sess){
    state.user = sess; showApp();
    if(isCloudReady() && !state.cloudMode) pushToCloud(true);
  } else {
    showLogin();
  }

  setInterval(async ()=>{
    if(!isCloudReady() || !state.user || state.cloudBusy) return;
    if(isSupervisor() && !isSupervisorAutoSync()) return;
    if(state.cloudMode){
      const before = JSON.stringify(db);
      const ok = await pullFromCloud(true);
      if(ok && JSON.stringify(db) !== before) render();
    } else {
      await pushToCloud(true);
    }
  }, 45000);

  window.addEventListener('beforeunload', ()=>{
    if(!state.cloudMode) saveDB();
  });
}
window.addEventListener('load', init);
</script>
</body>
</html>
