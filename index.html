function pwdModal(){
  if(!state.user) return;
  const isOwnerUser = isOwner();
  const body = `
    <form id="pwdForm" class="form-grid" novalidate>
      <div class="field" style="grid-column:1/-1"><label>${t('pwd_current')} <span class="req">*</span></label>
        <input type="password" name="currentPwd" required autocomplete="current-password"></div>
      <div class="field"><label>${t('pwd_new')} <span class="req">*</span></label>
        <input type="password" name="newPwd" required autocomplete="new-password"></div>
      <div class="field"><label>${t('pwd_confirm')} <span class="req">*</span></label>
        <input type="password" name="confirmPwd" required autocomplete="new-password"></div>
      ${isOwnerUser?`<div class="small muted" style="grid-column:1/-1;padding:10px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--border)">${t('pwd_owner_note')}</div>`:''}
      <div id="pErr" class="err" style="grid-column:1/-1;display:none"></div>
    </form>`;
  openModal({
    title:`🔑 ${t('pwd_section')}`, body, submitText:t('pwd_save'),
    onSubmit(root){
      const d = Object.fromEntries(new FormData($('#pwdForm', root)));
      const err = $('#pErr', root);
      if(!d.currentPwd || !d.newPwd || !d.confirmPwd){
        err.textContent = t('msg_required'); err.style.display='block'; return false;
      }
      const curHash = hashPwd(d.currentPwd);
      let stored = null;
      if(isOwnerUser) stored = db.auth?.owner?.password;
      else {
        const sup = db.supervisors.find(s=>s.id===state.user.id);
        stored = sup?.password;
      }
      if(stored !== curHash){ err.textContent = t('msg_pwd_wrong'); err.style.display='block'; return false; }
      if(d.newPwd.length < 4){ err.textContent = t('msg_pwd_short'); err.style.display='block'; return false; }
      if(d.newPwd !== d.confirmPwd){ err.textContent = t('msg_pwd_mismatch'); err.style.display='block'; return false; }
      const newHash = hashPwd(d.newPwd);
      if(isOwnerUser) db.auth.owner.password = newHash;
      else {
        const sup = db.supervisors.find(s=>s.id===state.user.id);
        if(sup) sup.password = newHash;
      }
      saveDB();
      toast(t('msg_pwd_changed'),'ok');
      if(isCloudReady()) pushToCloud(true);
      return true;
    }
  });
}

      <label style="font-size:14px;color:var(--text)">${t('whatsapp_section')}</label>

        <div class="field"><label>${t('cloud_bin')}</label>

    <hr style="border:0;border-top:1px dashed var(--border);margin:20px 0">
    <div class="field" style="margin-bottom:12px">
      <label>👑 ${t('settings_owner')}</label>
      <div class="form-grid">
        <div class="field"><label>${t('fld_email')}</label>
          <input type="email" id="ownerEmail" dir="ltr" value="${esc(owner.email||'')}"></div>
        <div class="field"><label>${t('fld_phone')}</label>
          <input id="ownerPhone" dir="ltr" value="${esc(owner.phone||'')}"></div>

      <button class="btn btn-sm btn-primary" id="saveOwner" type="button" style="margin-top:12px">${t('settings_save_owner')}</button>
      <div class="small muted" style="margin-top:6px">${t('pwd_owner_note')}</div>
    </div>` : `
    <hr style="border:0;border-top:1px dashed var(--border);margin:20px 0">
    <div class="field" style="margin-bottom:14px">
      <label style="font-size:14px;color:var(--text)">${t('cloud_section')}</label>
      <div class="small muted" style="padding:12px 14px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--border);margin-top:8px">
        ℹ️ ${t('cloud_owner_only')}
      </div>
      <span class="cloud-status ${isCloudReady()?'on':'off'}" style="margin-top:10px">☁️ ${isCloudReady()?t('msg_cloud_ok'):t('msg_cloud_off')}</span>
    </div>`}

    <hr style="border:0;border-top:1px solid var(--border);margin:20px 0">
    <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-weight:800">${esc(state.user?.name||'')}</div>
        <div class="small muted">${state.user?.role==='owner'?t('role_owner'):t('role_supervisor')}</div>
      </div>
      <div class="row" style="gap:8px">
        <button class="btn" id="changePwdBtn" type="button">🔑 ${t('pwd_save')}</button>
        <button class="btn btn-danger" id="logoutBtn" type="button">🚪 ${t('btn_logout')}</button>
      </div>
    </div>`;

  openModal({
    title:`⚙️ ${t('btn_settings')}`,
    body,
    submitText: t('btn_close'),
    onSubmit(){ saveDB(); render(); toast(t('msg_saved'),'ok'); return true; },
    onMount(root){
      $$('.swatch', root).forEach(sw=> sw.onclick = ()=>{
        db.settings.color = sw.dataset.color;
        $$('.swatch', root).forEach(x=>x.classList.remove('sel'));
        sw.classList.add('sel'); applySettings();
      });
      $('#customColor', root).oninput = e=>{ db.settings.color = e.target.value; applySettings(); };
      $('#fsRange', root).oninput = e=>{
        db.settings.fontSize = +e.target.value;
        $('#fsVal', root).textContent = e.target.value;
        applySettings();
        const modal = root.querySelector('.modal');
        if(modal) modal.style.zoom = ((+e.target.value) || 14.5) / 14.5;
      };
      $('#saveGrades', root)?.addEventListener('click', ()=>{
        const g = {};
        $$('[data-grade]', root).forEach(inp=>{ g[inp.dataset.grade] = num(inp.value); });
        g.F = 0;
        db.grades = g;
        db.reports.forEach(r=>{ r.rating = computeRatingFromGrades(r.orders, db.grades); });
        saveDB(); render();
        toast(t('msg_saved_grade'),'ok');
        if(isCloudReady()) pushToCloud(true);
      });
      $('#saveDailyGrades', root)?.addEventListener('click', ()=>{
        const g = {};
        $$('[data-daily-grade]', root).forEach(inp=>{ g[inp.dataset.dailyGrade] = num(inp.value); });
        g.D = 0;
        db.dailyGrades = g;
        saveDB(); render();
        toast(t('msg_saved_grade'),'ok');
        if(isCloudReady()) pushToCloud(true);
      });
      $('#saveBrand', root)?.addEventListener('click', ()=>{
        db.branding.title = $('#brandTitleInp', root).value.trim() || 'تحليل أداء السائقين';
        db.branding.subtitle = $('#brandSubInp', root).value.trim() || 'نظام المتابعة والتقارير';
        saveDB(); applyBranding();
        toast(t('msg_saved'),'ok');
        if(isCloudReady()) pushToCloud(true);
      });
      $('#pickLogo', root)?.addEventListener('click', ()=> $('#logoFile', root).click());
      $('#logoFile', root)?.addEventListener('change', e=>{
        const f = e.target.files[0]; if(!f) return;
        if(f.size > 500*1024){ toast('حجم الصورة يجب أن يكون أقل من 500KB','warn'); return; }
        const rd = new FileReader();
        rd.onload = ()=>{
          db.branding.logo = rd.result;
          const prev = $('#logoPrev', root);
          if(prev) prev.innerHTML = `<img src="${rd.result}">`;
          saveDB(); applyBranding();
          toast('تم اختيار الشعار، اضغط حفظ الهوية','ok');
        };
        rd.readAsDataURL(f);
      });
      $('#removeLogo', root)?.addEventListener('click', ()=>{
        db.branding.logo = null;
        const prev = $('#logoPrev', root);
        if(prev) prev.innerHTML = '📊';
        saveDB(); applyBranding(); toast('تم إزالة الشعار','ok');
      });
      $('#saveWa', root)?.addEventListener('click', ()=>{
        db.settings.whatsapp.number = $('#waNumber', root).value.trim();
        db.settings.whatsapp.message = $('#waMessage', root).value.trim();
        saveDB(); toast(t('msg_saved'),'ok');
        if(isCloudReady()) pushToCloud(true);
      });
      $('#openWa', root)?.addEventListener('click', ()=> openWhatsApp());
      $('#saveJb', root)?.addEventListener('click', ()=>{
        cloudCfg.key = $('#jbKey', root).value.trim();
        cloudCfg.binId = $('#jbBin', root).value.trim();
        saveCloudCfg();
        setCloudStatus(isCloudReady() ? 'on' : 'off');
        toast(t('msg_saved'),'ok');
        const su = $('#shareUrl', root);
        if(su) su.value = buildShareLink() || '';
      });
      $('#testJb', root)?.addEventListener('click', async ()=>{
        cloudCfg.key = $('#jbKey', root).value.trim();
        cloudCfg.binId = $('#jbBin', root).value.trim();
        saveCloudCfg();
        if(!isCloudReady()){ toast(t('msg_set_cloud'),'warn'); return; }
        setCloudStatus('syncing');
        try{
          const res = await fetch(`${JSONBIN_BASE}/b/${cloudCfg.binId}/latest`, { headers:{ 'X-Master-Key': cloudCfg.key } });
          if(!res.ok) throw new Error(await res.text());
          setCloudStatus('on'); toast('الاتصال ناجح ✓','ok');
        }catch(e){ setCloudStatus('off'); toast('فشل: ' + e.message,'err'); }
      });
      $('#syncNow', root)?.addEventListener('click', async ()=>{
        cloudCfg.key = $('#jbKey', root).value.trim();
        cloudCfg.binId = $('#jbBin', root).value.trim();
        saveCloudCfg();
        await pushToCloud();
        const su = $('#shareUrl', root);
        if(su) su.value = buildShareLink() || '';
      });
      $('#pullNow', root)?.addEventListener('click', async ()=>{
        cloudCfg.key = $('#jbKey', root).value.trim();
        cloudCfg.binId = $('#jbBin', root).value.trim();
        saveCloudCfg();
        await pullFromCloud();
      });
      $('#copyLink', root)?.addEventListener('click', async ()=>{
        if(!isCloudReady()){ toast(t('msg_set_cloud'),'warn'); return; }
        await pushToCloud(true);
        const url = buildShareLink();
        const el = $('#shareUrl', root);
        el.value = url;
        try{ await navigator.clipboard.writeText(url); }
        catch(e){ el.select(); document.execCommand('copy'); }
        toast(t('msg_link_ready'),'ok');
      });
      $('#saveOwner', root)?.addEventListener('click', ()=>{
        const e = $('#ownerEmail', root).value.trim();
        const p = $('#ownerPhone', root).value.trim();
        if(!e || !p){ toast(t('msg_required'),'warn'); return; }
        db.auth.owner.email = e;
        db.auth.owner.phone = p;
        saveDB(); toast(t('msg_saved'),'ok');
        if(isCloudReady()) pushToCloud(true);
      });
      $('#changePwdBtn', root)?.addEventListener('click', ()=>{
        $('#modalRoot').innerHTML = '';
        pwdModal();
      });
      $('#logoutBtn', root)?.addEventListener('click', ()=>{
        $('#modalRoot').innerHTML = '';
        doLogout();
      });
    }
  });
}

/* ==========================================================================
   22) نظام النوافذ
   ========================================================================== */
function openModal({title, body, onSubmit, onMount, submitText, wide}){
  const root = $('#modalRoot');
  root.innerHTML = `
    <div class="overlay" id="ovl">
      <div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3>${title}</h3>
          <button class="icon-btn" id="mClose">✕</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">
          <button class="btn" id="mCancel">${t('btn_cancel')}</button>
          <button class="btn btn-primary" id="mSave">${submitText || t('btn_save')}</button>
        </div>
      </div>
    </div>`;
  const close = ()=> root.innerHTML = '';
  $('#mClose').onclick = close;
  $('#mCancel').onclick = close;
  $('#ovl').onclick = e=>{ if(e.target.id==='ovl') close(); };
  $('#mSave').onclick = ()=>{
    const form = root.querySelector('form');
    if(form && !form.checkValidity()){
      form.querySelectorAll(':invalid')[0]?.focus();
      const err = root.querySelector('.err');
      if(err){ err.textContent = t('msg_required'); err.style.display='block'; }
      return;
    }
    if(onSubmit && onSubmit(root) === false) return;
    close();
  };
  document.addEventListener('keydown', function esc2(e){
    if(e.key==='Escape'){ close(); document.removeEventListener('keydown', esc2); }
  });
  if(onMount) onMount(root);
  root.querySelector('input,select,textarea')?.focus();
}

/* ==========================================================================
   23) التهيئة
   ========================================================================== */
function closeSidebar(){ $('#sidebar').classList.remove('open'); }

async function init(){
  cloudCfg = loadCloudCfg();
  const fromURL = await readFromURLParams();

  if(fromURL && isCloudReady()){
    showLoadingOverlay('جاري تحميل البيانات من السحابة…','يرجى الانتظار لحظات');
    try{ await pullFromCloud(true); }catch(e){ console.warn('cloud pull failed', e); }
    hideLoadingOverlay();
    if(!db){ db = emptyDB(); saveDB(); }
  } else {
    db = loadDB();
    if(!db){ db = seedDB(); saveDB(); }
  }

  $('#menuBtn').onclick = ()=> $('#sidebar').classList.toggle('open');
  $('#langBtn').onclick = ()=> toolAction('lang');
  $('#topSet').onclick  = ()=> settingsModal();
  $('#btnSet').onclick  = ()=> settingsModal();
  $('#btnPerm').onclick = ()=> permModal();
  $('#btnPwd').onclick  = ()=> pwdModal();
  $('#syncBtn').onclick = ()=>{ if(!isCloudReady()){ settingsModal(); return; } pushToCloud().then(ok => { if(ok) render(); }); };
  $('#shareBtn').onclick  = ()=> copyShareLink();
  $('#importBtn').onclick = ()=> toolAction('import');
  $('#exportBtn').onclick = ()=> toolAction('export');
  $('#resetBtn').onclick  = ()=> toolAction('reset');
  $('#waBtn').onclick     = ()=> openWhatsApp();

  $('#notifBtn').onclick = (e)=>{ e.stopPropagation(); openNotifPanel(); };
  $('#closeNotif').onclick = (e)=>{ e.stopPropagation(); closeNotifPanel(); };
  $('#markAllRead').onclick = ()=>{
    (db.notifications||[]).forEach(n=> n.read = true);
    saveDB(); renderNotifList(); updateNotifBadge();
    toast('تم تحديد الكل كمقروء','ok');
  };
  document.addEventListener('click', e=>{
    const p = $('#notifPanel');
    if(p.classList.contains('open') && !p.contains(e.target) && !$('#notifBtn').contains(e.target)){
      closeNotifPanel();
    }
  });

  $('#loginForm').addEventListener('submit', e=>{
    e.preventDefault();
    const id = $('#lgId').value.trim();
    const pw = $('#lgPw').value;
    if(!id || !pw){ $('#lgErr').textContent = t('msg_required'); $('#lgErr').style.display='block'; return; }
    if(!doLogin(id, pw)){
      $('#lgErr').textContent = t('msg_login_err'); $('#lgErr').style.display='block';
      toast(t('msg_login_err'),'err');
    }
  });

  const sess = loadSession();
  if(sess){
    state.user = sess; showApp();
    if(isCloudReady() && !state.cloudMode) pushToCloud(true);
  } else {
    showLogin();
  }

  setInterval(async ()=>{
    if(!isCloudReady() || !state.user || state.cloudBusy) return;
    if(state.cloudMode){
      const before = JSON.stringify(db);
      const ok = await pullFromCloud(true);
      if(ok && JSON.stringify(db) !== before) render();
    } else {
      await pushToCloud(true);
    }
  }, 45000);

  window.addEventListener('beforeunload', ()=>{
    if(!state.cloudMode) saveDB();
  });
}
window.addEventListener('load', init);
</script>
