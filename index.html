function renderMonthlyAttendance(){ const f = state.attendanceMonthlyFilter || { type:'month', month: todayStr().slice(0,7), day: todayStr(), from: monthStart(), to: todayStr() }; const reps = visibleReps(); let dateFrom = null, dateTo = null; if (f.type === 'month'){ dateFrom = f.month + '-01'; dateTo = monthEndOf(dateFrom); } else if (f.type === 'day'){ dateFrom = dateTo = f.day; } else { dateFrom = f.from; dateTo = f.to; } const mAtt = db.attendance.filter(a => a.date && a.date >= dateFrom && a.date <= dateTo); const stats = {}; reps.forEach(r => stats[r.id] = { name: r.name, present: 0, late: 0, absent: 0, leave: 0, rest: 0, none: 0 }); mAtt.forEach(a => { if (stats[a.repId]){ if (a.status && stats[a.repId][a.status] !== undefined) stats[a.repId][a.status]++; else if (!a.status) stats[a.repId].none++; } }); const tTotals = { present:0, late:0, absent:0, leave:0, rest:0, none:0 }; Object.keys(stats).forEach(k => { Object.keys(tTotals).forEach(s => tTotals[s] += stats[k][s]); }); const kpiHTML = `<div class="attendance-kpi-grid">${kpiCard('<i class="fa-solid fa-users"></i>', t('perf_total_reps'), reps.length, '#6366f1')}${kpiCard('<i class="fa-solid fa-circle-check"></i>', t('att_total_present'), tTotals.present, '#10b981')}${kpiCard('<i class="fa-solid fa-clock"></i>', t('att_total_late'), tTotals.late, '#f59e0b')}${kpiCard('<i class="fa-solid fa-circle-xmark"></i>', t('att_total_absent'), tTotals.absent, '#ef4444')}${kpiCard('<i class="fa-solid fa-plane"></i>', t('att_total_leave'), tTotals.leave, '#3b82f6')}${kpiCard('<i class="fa-solid fa-bed"></i>', t('att_total_rest'), tTotals.rest, '#8b5cf6')}</div>`; const filterUI = `<div class="day-picker" style="margin-bottom:14px;flex-wrap:wrap;gap:8px"><span class="dp-label">📅 ${t('filter_period')}</span><select id="attFilterType" style="max-width:180px;padding:9px 12px"><option value="month" ${f.type==='month'?'selected':''}>🗓️ ${t('filter_month')}</option><option value="day" ${f.type==='day'?'selected':''}>📅 ${t('fi function buildCarFullPage(car){ const office = car.rentalOfficeId ? getOffice(car.rentalOfficeId) : null; const maint = (db.maintenance||[]).filter(m => m.carId === car.id && !m.deleted); const usage = (db.usage||[]).filter(u => u.carId === car.id && !u.deleted); const oil = (db.oil||[]).filter(o => o.carId === car.id && !o.deleted); const rep = car.assignedRepId ? getRep(car.assignedRepId) : null; const km = latestKmForCar(car.id); const mCost = maint.reduce((a,m) => a + (Number(m.cost)||0), 0); const oCost = oil.reduce((a,o) => a + (Number(o.cost)||0), 0); const lOil = oil.slice().sort((a,b) => (Number(b.km)||0) - (Number(a.km)||0))[0]; const oRem = lOil && lOil.nextKm ? Math.max(0, Number(lOil.nextKm) - km) : null; const mRows = maint.length ? maint.map(m => { const list = m.type === 'fault' ? FAULT_CATEGORIES : MAINT_CATEGORIES; const cat = list.find(x => x.id === m.category); const lbl = m.category === 'other' ? (m.customCategory || 'أخرى') : (cat ? lang(cat) : '—'); return `<tr><td><span class="chip ${m.type==='fault'?'red':'amber'}">${m.type==='fault'?t('mt_fault'):t('mt_maint')}</span></td><td>${esc(lbl)}</td><td>${esc(m.date)}</td><td><b>${Number(m.cost||0).toLocaleString()}</b> ر.س</td><td class="small">${esc(m.desc||'—')}</td><td>${m.status==='done'?'<span class="chip green">'+t('msg_status_done')+'</span>':'<span class="chip amber">'+t('msg_status_progress')+'</span>'}</td></tr>`; }).join('') : '<tr><td colspan="6" class="empty">'+t('no_data')+'</td></tr>'; const uRows = usage.length ? usage.map(u => { const d = (u.startKm && u.endKm) ? (Number(u.endKm) - Number(u.startKm)) : null; return `<tr><td><b>${esc(u.username||'—')}</b></td><td>${esc(repName(u.repId))}</td><td>${esc(u.startDate)}</td><td>${u.endDate?esc(u.endDate):'<span class="chip green">'+t('msg_active_now')+'</span>'}</td><td>${esc(u.startKm)}</td><td>${esc(u.endKm||'—')}</td><td>${d!==null?'<span class="chip blue">'+d+' كم</span>':'—'}</td></tr>`; }).join('') : '<tr><td colspan="7" class="empty">'+t('no_data')+'</td></tr>'; const oRows = oil.length ? oil.map(o => { const r = o.nextKm ? Number(o.nextKm) - km : null; const st = r === null ? '<span class="chip gray">—</span>' : r<=0 ? '<span class="chip red">'+t('oil_status_urgent')+'</span>' : r<=500 ? '<span class="chip amber">'+t('oil_status_soon')+'</span>' : '<span class="chip green">'+t('oil_status_ok')+'</span>'; return `<tr><td>${esc(o.date)}</td><td>${esc(o.km)}</td><td>${esc(o.nextKm||'—')}</td><td>${esc(o.nextDate||'—')}</td><td>${Number(o.cost||0).toLocaleString()} ر.س</td><td>${st}</td></tr>`; }).join('') : '<tr><td colspan="6" class="empty">'+t('no_data')+'</td></tr>'; const officeHTML = office ? `<div class="card" style="margin-bottom:16px"><div class="card-head">🏢 ${t('t_offices')}</div><div class="card-body"><div class="form-grid"><div class="field"><label>${t('office_name')}</label><input readonly value="${esc(office.name||'—')}"></div><div class="field"><label>${t('office_phone')}</label><input readonly dir="ltr" value="${esc(office.phone||'—')}"></div><div class="field"><label>${t('office_contact')}</label><input readonly value="${esc(office.contact||'—')}"></div><div class="field"><label>${t('office_address')}</label><input readonly value="${esc(office.address||'—')}"></div></div></div></div>` : ''; return `<div class="card" style="margin-bottom:16px" id="carDetailHeader"><div class="card-head" style="flex-wrap:wrap;gap:10px"><button class="btn btn-sm" id="backToCarsBtn" style="gap:6px"><i class="fa-solid fa-arrow-right"></i> ${t('t_cars')}</button><div style="flex:1;min-width:220px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="ic-avatar" style="width:40px;height:40px;font-size:18px">🚗</div><div><div style="font-weight:800;font-size:15px">${esc(car.brand)} ${esc(car.model)}</div><div class="small muted">${esc(car.plate)} · ${esc(car.year)}</div></div>${statusChip(car.status)}</div>${attachBtn('cars', car.id)}<button class="btn btn-sm" id="printCarPageBtn"><i class="fa-solid fa-print"></i> ${t('btn_print')}</button><button class="btn btn-sm btn-primary" id="exportCarPageBtn"><i class="fa-solid fa-file-pdf"></i> PDF</button></div></div><div class="grid g4" style="margin-bottom:16px">${kpiCard('🔧', t('fld_cost')+' '+'صيانة', mCost.toLocaleString()+' ر.س', '#f59e0b')}${kpiCard('🛢️', t('fld_cost')+' زيت', oCost.toLocaleString()+' ر.س', '#ec4899')}${kpiCard('🧭', t('fld_km'), km.toLocaleString()+' كم', '#06b6d4')}${kpiCard('👤', t('fld_rep'), rep ? esc(rep.name) : '—', '#6366f1')}</div>${oRem !== null ? `<div class="card" style="margin-bottom:16px"><div class="card-body" style="padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span style="font-size:26px">${oRem<=0?'🔴':oRem<=500?'🟡':'🟢'}</span><div style="flex:1;min-width:180px"><div style="font-weight:800;font-size:13px">${oRem<=0?t('oil_status_urgent'):oRem<=500?t('oil_status_soon'):t('oil_status_ok')}</div><div class="small muted">متبقي ${oRem} كم — آخر تغيير على ${lOil.km} كم</div></div></div></div>` : ''}<div class="card" style="margin-bottom:16px"><div class="card-head">📋 ${t('t_cars')}</div><div class="card-body"><div class="form-grid"><div class="field"><label>${t('fld_brand')}</label><input readonly value="${esc(car.brand)}"></div><div class="field"><label>${t('fld_model')}</label><input readonly value="${esc(car.model)}"></div><div class="field"><label>${t('fld_plate')}</label><input readonly dir="ltr" value="${esc(car.plate)}"></div><div class="field"><label>${t('fld_year')}</label><input readonly value="${esc(car.year)}"></div><div class="field"><label>${t('fld_status')}</label><div style="padding:10px 0">${statusChip(car.status)}</div></div><div class="field"><label>${t('fld_rental_office')}</label><input readonly value="${esc(car.rentalOfficeId ? officeName(car.rentalOfficeId) : '—')}"></div><div class="field"><label>${t('fld_rep')}</label><input readonly value="${esc(rep ? rep.name : '—')}"></div><div class="field"><label>${t('fld_created')}</label><input readonly value="${esc(car.createdAt ? car.createdAt.slice(0,10) : '—')}"></div></div></div></div>${officeHTML}<div class="card" style="margin-bottom:16px"><div class="card-head">🔧 ${t('t_maint')} <span class="chip blue">${maint.length}</span></div><div class="tbl-wrap" style="border:0"><table><thead><tr><th>${t('fld_type')}</th><th>${t('fld_category')}</th><th>${t('fld_date')}</th><th>${t('fld_cost')}</th><th>${t('fld_desc')}</th><th>${t('fld_status')}</th></tr></thead><tbody>${mRows}</tbody></table></div></div><div class="card" style="margin-bottom:16px"><div class="card-head">🧭 ${t('t_usage')} <span class="chip blue">${usage.length}</span></div><div class="tbl-wrap" style="border:0"><table><thead><tr><th>${t('fld_username')}</th><th>${t('fld_rep')}</th><th>${t('fld_start_date')}</th><th>${t('fld_end_date')}</th><th>${t('fld_start_km')}</th><th>${t('fld_end_km')}</th><th>${t('fld_km')}</th></tr></thead><tbody>${uRows}</tbody></table></div></div><div class="card" style="margin-bottom:16px"><div class="card-head">🛢️ ${t('t_oil')} <span class="chip blue">${oil.length}</span></div><div class="tbl-wrap" style="border:0"><table><thead><tr><th>${t('fld_date')}</th><th>${t('fld_km')}</th><th>${t('fld_next_km')}</th><th>${t('fld_next_date')}</th><th>${t('fld_cost')}</th><th>${t('fld_status')}</th></tr></thead><tbody>${oRows}</tbody></table></div></div>`; }
function latestKmForCar(carId){ const car = getCar(carId); if(!car) return 0; let maxKm = 0; if(car.assignedRepId){ db.reports.forEach(r => { if(r.repId !== car.assignedRepId) return; const eK = (r.endKm !== '' && r.endKm !== undefined) ? num(r.endKm) : 0; const sK = (r.startKm !== '' && r.startKm !== undefined) ? num(r.startKm) : 0; const km = Math.max(eK, sK); if(km > maxKm) maxKm = km; }); } db.usage.filter(u => u.carId === carId).forEach(u => { const eK = (u.endKm !== '' && u.endKm !== undefined) ? num(u.endKm) : 0; const sK = (u.startKm !== '' && u.startKm !== undefined) ? num(u.startKm) : 0; const km = Math.max(eK, sK); if(km > maxKm) maxKm = km; }); return maxKm; }
function currentKm(carId){ return latestKmForCar(carId); }
function afterCars(){ if(state.selectedCarId){ const car = getCar(state.selectedCarId); if(!car){ state.selectedCarId = null; return; } const back = $('#backToCarsBtn'); if(back) back.onclick = ()=>{ state.selectedCarId = null; render(); }; const pr = $('#printCarPageBtn'); if(pr) pr.onclick = ()=>{ $$('#view .card').forEach(c=>c.classList.remove('collapsed')); window.print(); }; const ex = $('#exportCarPageBtn'); if(ex) ex.onclick = async ()=>{ const wrap = document.createElement('div'); wrap.style.cssText = 'background:#fff;padding:10px'; $$('#view > .card:not(#carDetailHeader), #view > .grid').forEach(el=> wrap.appendChild(el.cloneNode(true))); try{ await exportPDF(wrap, 'car-'+car.plate.replace(/\s/g,'-')+'-'+todayStr(), { orientation:'portrait', reportTitle: 'تقرير السيارة: '+car.brand+' '+car.model+' — '+car.plate }); toast('✅ تم التصدير','ok'); }catch(e){ toast('❌ '+e.message,'err'); } }; return; } $$('[data-car-open]').forEach(el=>{ el.onclick = (e)=>{ if(e.target.closest('button, input, select, a, .attach-btn')) return; state.selectedCarId = el.dataset.carOpen; render(); }; }); $$('[data-tab]').forEach(b=> b.onclick = ()=>{ state.carsTab = b.dataset.tab; render(); }); $$('[data-view]').forEach(b=> b.onclick = ()=>{ const [k,v] = b.dataset.view.split(':'); state.viewModes[k] = v; render(); }); if(canEditSection('cars')){ $('#addCar')?.addEventListener('click', ()=> carModal()); $$('[data-edit-car]').forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); carModal(b.dataset.editCar); }); $$('[data-del-car]').forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); deleteConfirmModal({collectionKey:'cars', id:b.dataset.delCar}); }); $('#addOffice')?.addEventListener('click', ()=> officeModal()); $$('[data-edit-office]').forEach(b=> b.onclick = ()=> officeModal(b.dataset.editOffice)); $$('[data-del-office]').forEach(b=> b.onclick = ()=> deleteConfirmModal({collectionKey:'rentalOffices', id:b.dataset.delOffice})); $('#addMaint')?.addEventListener('click', ()=> maintModal()); $$('[data-edit-maint]').forEach(b=> b.onclick = ()=> maintModal(b.dataset.editMaint)); $$('[data-del-maint]').forEach(b=> b.onclick = ()=> deleteConfirmModal({collectionKey:'maintenance', id:b.dataset.delMaint})); $('#addUsage')?.addEventListener('click', ()=> usageModal()); $$('[data-edit-usage]').forEach(b=> b.onclick = ()=> usageModal(b.dataset.editUsage)); $$('[data-del-usage]').forEach(b=> b.onclick = ()=> deleteConfirmModal({collectionKey:'usage', id:b.dataset.delUsage})); $('#addOil')?.addEventListener('click', ()=> oilModal()); $$('[data-edit-oil]').forEach(b=> b.onclick = ()=> oilModal(b.dataset.editOil)); $$('[data-del-oil]').forEach(b=> b.onclick = ()=> deleteConfirmModal({collectionKey:'oil', id:b.dataset.delOil})); } }

function analyticsFilterRange(){ const f = state.analyticsFilter; switch(f.type){ case 'rep': { if(f.repPeriod === 'day') return { from:f.date, to:f.date, repId:f.repId }; if(f.repPeriod === 'week') return { from:f.w1, to:f.w2, repId:f.repId }; if(f.repPeriod === 'month'){ const s = f.month+'-01'; return { from:s, to:monthEndOf(s), repId:f.repId }; } if(f.repPeriod === 'range_days') return { from:f.d1, to:f.d2, repId:f.repId }; return { from:'', to:'', repId:f.repId }; } case 'day': return { from:f.date, to:f.date }; case 'week': return { from:f.w1, to:f.w2 }; case 'month': { const s = f.month+'-01'; return { from:s, to:monthEndOf(s) }; } case 'range_days': return { from:f.d1, to:f.d2 }; case 'range_weeks': { const s=weekStartOf(f.w1); const e=addDaysStr(weekStartOf(f.w2),6); return { from:s, to:e }; } case 'range_months': { const s=f.m1+'-01'; const e=monthEndOf(f.m2+'-01'); return { from:s, to:e }; } default: return { from:'', to:'' }; } }

function driverSummaryModal(repId, opts){
  opts = opts || {};
  const rep = getRep(repId);
  if (!rep) return;
  const refDate = state.repsDay || todayStr();
  const periods = [ ['daily', `📅 ${t('goals_period_today')} (${refDate})`], ['weekly', t('goals_period_week')], ['monthly', t('goals_period_month')], ['all', t('filter_all')] ];
  let currentPeriod = opts.period || 'daily';
  const renderContent = (period) => {
    const allReports = db.reports.filter(r => r.repId === repId && !r.deleted);
    const allAtt = (db.attendance || []).filter(a => a.repId === repId);
    let dateFrom = null, dateTo = null;
    if (period === 'daily'){ dateFrom = dateTo = refDate; }
    else if (period === 'weekly'){ dateFrom = weekStartOf(refDate); dateTo = addDaysStr(dateFrom, 6); }
    else if (period === 'monthly'){ dateFrom = refDate.slice(0,7) + '-01'; dateTo = monthEndOf(dateFrom); }
    const reports = dateFrom ? allReports.filter(r => r.date >= dateFrom && r.date <= dateTo) : allReports;
    const att = dateFrom ? allAtt.filter(a => a.date >= dateFrom && a.date <= dateTo) : allAtt;
    const orders = sum(reports, 'orders');
    const hours = round1(sum(reports, 'hours'));
    const violations = sum(reports, 'violations');
    const km = sum(reports, 'totalKm');
    const cPresent = att.filter(a => a.status === 'present').length;
    const cLate = att.filter(a => a.status === 'late').length;
    const cAbsent = att.filter(a => a.status === 'absent').length;
    const cLeave = att.filter(a => a.status === 'leave').length;
    const cRest = att.filter(a => a.status === 'rest').length;
    const workDays = cPresent + cLate;
    const commitment = (workDays + cAbsent) > 0 ? Math.round((workDays / (workDays + cAbsent)) * 100) : 0;
    const rating = reports.length ? computeRatingFromGrades(orders / Math.max(reports.length, 1), db.grades) : '—';
    const car = rep.carId ? getCar(rep.carId) : null;
    const sup = rep.supervisorId ? getSup(rep.supervisorId) : null;
    return `<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px"><div style="width:64px;height:64px;border-radius:50%;background:var(--grad-brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:26px;flex:0 0 64px">${esc((rep.name||'?')[0]||'?')}</div><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:18px">${esc(rep.name)}</div><div class="small muted">${esc(rep.code||'')} · ${esc(rep.phone||'')} · ${esc(rep.region||'')}</div><div class="row" style="gap:6px;margin-top:6px">${rep.app ? `<span class="chip blue">${esc(appLabel(rep.app))}</span>` : ''}${sup ? `<span class="chip violet">👔 ${esc(sup.name)}</span>` : ''}${car ? `<span class="chip amber">🚗 ${esc(car.brand)} ${esc(car.model)}</span>` : ''}</div></div><div style="text-align:center"><div style="font-size:11px;color:var(--muted);font-weight:700">${t('fld_rating')}</div><div class="chip grade ${rating!=='—'?rating:'F'}" style="width:44px;height:44px;font-size:20px;margin-top:4px">${rating}</div></div></div><div class="small muted" style="margin-bottom:10px; font-weight:700; color:var(--primary); font-size:13px;">📌 البيانات معروضة بناءً على اليوم المحدد: <b>${refDate}</b></div><div class="tabs" style="margin-bottom:14px">${periods.map(([id, lb]) => `<button class="tab ${currentPeriod===id?'active':''}" data-sum-period="${id}">${lb}</button>`).join('')}</div><div class="grid g3" style="gap:12px;margin-bottom:16px">${kpiCard('📦', t('summary_orders'), orders, '#6366f1')}${kpiCard('⏱️', t('summary_hours'), hours + 'h', '#10b981')}${kpiCard('⚠️', t('kpi_violations'), violations, '#f59e0b')}${kpiCard('🛣️', t('fld_total_km'), km, '#8b5cf6')}${kpiCard('📊', t('daily_grades_table'), rating, '#06b6d4')}${kpiCard('✅', t('summary_commitment'), commitment + '%', '#10b981', null, null, commitment)}</div><div class="card" style="border:1px solid var(--border)"><div class="card-head" style="font-size:13px">📋 ${t('summary_attendance')} — ${periods.find(p=>p[0]===period)?.[1] || ''}</div><div class="card-body" style="padding:14px"><div class="grid g3" style="gap:10px"><div class="insight-tile tone-green"><div class="it-label">✅ ${t('att_present')}</div><div class="it-value">${cPresent}</div></div><div class="insight-tile tone-amber"><div class="it-label">🕐 ${t('att_late')}</div><div class="it-value">${cLate}</div></div><div class="insight-tile" style="background:var(--red-soft);border-color:#fecaca"><div class="it-label" style="color:#b91c1c">❌ ${t('att_absent')}</div><div class="it-value" style="color:#991b1b">${cAbsent}</div></div><div class="insight-tile tone-blue"><div class="it-label">✈️ ${t('att_leave')}</div><div class="it-value">${cLeave}</div></div><div class="insight-tile" style="background:var(--bg-3);border-color:var(--border)"><div class="it-label">🛏️ ${t('att_rest')}</div><div class="it-value">${cRest}</div></div><div class="insight-tile tone-blue"><div class="it-label">📎 ${t('attachments')}</div><div class="it-value" style="font-size:16px">${attachCount('reps', repId)}</div><div style="text-align:center;margin-top:6px">${attachBtn('reps', repId)}</div></div></div></div></div>`;
  };
  const body = `<div id="driverSummaryContent">${renderContent(currentPeriod)}</div>`;
  openModal({ title: '👤 ' + esc(rep.name), body, wide: true, submitText: t('btn_close'), onSubmit: () => true, onMount(root){ const bodyEl = root.querySelector('.modal-body'); if (!bodyEl) return; bodyEl.addEventListener('click', (e) => { const b = e.target.closest('[data-sum-period]'); if (!b) return; currentPeriod = b.dataset.sumPeriod; bodyEl.querySelectorAll('[data-sum-period]').forEach(x => x.classList.toggle('active', x.dataset.sumPeriod === currentPeriod)); const contentEl = bodyEl.querySelector('#driverSummaryContent'); if (contentEl) contentEl.innerHTML = renderContent(currentPeriod); }); } });
}

function openModal({title, body, onSubmit, onMount, submitText, wide, tableId, record, customFooter}){

  root.innerHTML = `<div class="overlay" id="ovl"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="modal-head"><h3>${title}</h3><button class="icon-btn" id="mClose"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body">${body}</div><div class="modal-foot">${customFooter || `<button class="btn" id="mCancel">${t('btn_cancel')}</button><button class="btn btn-primary" id="mSave">${submitText || t('btn_save')}</button>`}</div></div></div>`;
  const close = ()=>{ root.innerHTML = ''; if(state.pendingReopen){ const fn = state.pendingReopen; state.pendingReopen = null; setTimeout(fn, 200); } };
  $('#mClose').onclick = close;
  $('#ovl').onclick = e=>{ if(e.target.id==='ovl') close(); };
  if(!customFooter){
    $('#mCancel').onclick = close;
    $('#mSave').onclick = async ()=>{
      const form = root.querySelector('form');
      if(form && !form.checkValidity()){
        form.querySelectorAll(':invalid')[0]?.focus();
        const err = root.querySelector('.err');
        if(err){ err.textContent = t('msg_required'); err.style.display='block'; }
        return;
      }
      if(onSubmit && (await onSubmit(root)) === false) return;
      close();
    };
  }
  document.addEventListener('keydown', function esc2(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown', esc2); } });
  if(tableId){
    const form = root.querySelector('form');
    if(form){
      const html = customFormFieldsHTML(tableId, record);
      if(html){
        const errEl = form.querySelector('.err');
        const grid = form.querySelector('.form-grid');
        if(errEl) errEl.insertAdjacentHTML('beforebegin', html);
        else if(grid) grid.insertAdjacentHTML('beforeend', html);
        else form.insertAdjacentHTML('beforeend', `<div class="form-grid">${html}</div>`);
      }
    }
  }
  if(onMount) onMount(root);
  root.querySelector('input,select,textarea')?.focus();
}

function deleteConfirmModal({collectionKey, id, displayName}){
  const meta = DELETE_LABELS[collectionKey] || { icon:'📄', label:()=>collectionKey, display:()=>id };
  const item = (db[collectionKey] || []).find(x => x.id === id);
  const name = displayName || (item ? meta.display(item) : id);
  const body = `<div style="text-align:center;margin-bottom:20px"><div style="font-size:56px;margin-bottom:10px">🗑️</div><div style="font-weight:800;font-size:16px;color:var(--text);margin-bottom:4px">${esc(name||'')}</div><div class="small muted">${esc(meta.label())}</div></div><div style="display:flex;flex-direction:column;gap:10px"><button type="button" class="btn" id="delSoftBtn" style="justify-content:flex-start;padding:14px 18px;text-align:start;gap:12px;border-color:#a7f3d0;background:var(--green-soft)"><span style="font-size:22px">📦</span><span style="flex:1"><b style="display:block;margin-bottom:2px;color:var(--green-ink)">الاحتفاظ بالنسخة</b><span class="small" style="color:var(--muted)">يُخفى السجل من القوائم، لكن يبقى قابلاً للاستعادة من سلة المحذوفات</span></span></button><button type="button" class="btn" id="delPermBtn" style="justify-content:flex-start;padding:14px 18px;text-align:start;gap:12px;border-color:#fecaca;background:var(--red-soft)"><span style="font-size:22px">🗑️</span><span style="flex:1"><b style="display:block;margin-bottom:2px;color:var(--red-ink)">مسح نهائي</b><span class="small" style="color:var(--muted)">حذف كامل من المحلي والسحابة — لا يمكن الاستعادة</span></span></button></div><div class="small muted" style="text-align:center;margin-top:14px;padding:10px;border-radius:10px;background:var(--bg-3)">⚠️ كلا الخيارين يُطبَّق عند المزامنة التالية تلقائياً</div>`;
  const customFooter = `<button class="btn" id="delCancelBtn">${t('btn_cancel')}</button>`;
  openModal({ title: '⚠️ تأكيد الحذف', body, wide: false, customFooter, onSubmit(){ return true; }, onMount(root){
    const close = () => { $('#modalRoot').innerHTML = ''; };
    root.querySelector('#delCancelBtn').onclick = close;
    root.querySelector('#delSoftBtn').onclick = () => {
      const arr = db[collectionKey] || [];
      const it = arr.find(x => x.id === id);
      if(!it){ close(); return; }
      it.deleted = true;
      it.deletedAt = new Date().toISOString();
      it.updatedAt = new Date().toISOString();
      saveDB(); render(); close();
      toast('📦 تم الاحتفاظ بالنسخة — يمكن استعادتها من سلة المحذوفات', 'ok');
      autoSyncAfterSave();
    };
    root.querySelector('#delPermBtn').onclick = () => {
      if(!confirm('⚠️ سيتم المسح النهائي من المحلي والسحابة. هل أنت متأكد؟')) return;
      db.purgeList = db.purgeList || [];
      if(!db.purgeList.includes(id)) db.purgeList.push(id);
      db[collectionKey] = (db[collectionKey] || []).filter(x => x.id !== id);
      cleanupRelations();
      saveDB(); render(); close();
      toast('🗑️ تم الحذف النهائي', 'ok');
      autoSyncAfterSave();
    };
  }});
}

function openTrashModal(){
  if(!isOwner()){ toast(t('msg_no_perm'),'warn'); return; }
  const renderGroups = () => {
    const groups = Object.keys(DELETE_LABELS).map(key => {
      const meta = DELETE_LABELS[key];
      const items = (db[key] || []).filter(x => x && x.deleted);
      if(!items.length) return '';
      return `<div style="margin-bottom:18px"><div style="font-weight:800;font-size:13.5px;margin-bottom:10px;color:var(--text);display:flex;align-items:center;gap:8px"><span>${meta.icon}</span><span>${esc(meta.label())}</span><span class="chip gray" style="font-size:10.5px;padding:1px 8px">${items.length}</span></div><div style="display:flex;flex-direction:column;gap:6px">${items.map(item => `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-2);border:1px solid var(--border);border-radius:10px;flex-wrap:wrap"><div style="flex:1;min-width:150px"><div style="font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(meta.display(item) || '—')}</div><div class="small muted" style="font-size:11px">🗑️ ${formatDateTime(item.deletedAt)}</div></div><div class="row" style="gap:4px"><button type="button" class="btn btn-sm" data-trash-restore="${key}:${item.id}" style="background:var(--green-soft);border-color:#a7f3d0;color:var(--green-ink);padding:4px 10px;font-size:11.5px">♻️ استعادة</button><button type="button" class="btn btn-sm" data-trash-purge="${key}:${item.id}" style="background:var(--red-soft);border-color:#fecaca;color:var(--red-ink);padding:4px 10px;font-size:11.5px">🗑️ مسح نهائي</button></div></div>`).join('')}</div></div>`;
    }).filter(Boolean).join('');
    return groups || `<div class="empty" style="padding:52px"><div style="font-size:48px;margin-bottom:10px">📭</div><div>لا توجد سجلات محذوفة</div></div>`;
  };
  const body = `<div class="small muted" style="margin-bottom:14px;padding:10px 14px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--border);line-height:1.65">💡 السجلات المحذوفة (soft delete) تظهر هنا. زر <b>الاستعادة</b> يعيدها للقوائم، وزر <b>المسح النهائي</b> يحذفها من المحلي والسحابة نهائياً.</div><div id="trashContent">${renderGroups()}</div>`;
  openModal({ title: '🗄️ سلة المحذوفات', body, wide: true, submitText: t('btn_close'), onSubmit(){ return true; }, onMount(root){
    const bind = () => {
      root.querySelectorAll('[data-trash-restore]').forEach(btn => {
        btn.onclick = () => {
          const [key, id] = btn.dataset.trashRestore.split(':');
          const item = (db[key] || []).find(x => x.id === id);
          if(!item) return;
          item.deleted = false;
          delete item.deletedAt;
          item.updatedAt = new Date().toISOString();
          saveDB();
          const content = root.querySelector('#trashContent');
          if(content) content.innerHTML = renderGroups();
          bind();
          toast('♻️ تمت الاستعادة', 'ok');
          autoSyncAfterSave();
        };
      });
      root.querySelectorAll('[data-trash-purge]').forEach(btn => {
        btn.onclick = () => {
          if(!confirm('⚠️ حذف نهائي من المحلي والسحابة؟ لا يمكن الاستعادة.')) return;
          const [key, id] = btn.dataset.trashPurge.split(':');
          db.purgeList = db.purgeList || [];
          if(!db.purgeList.includes(id)) db.purgeList.push(id);
          db[key] = (db[key] || []).filter(x => x.id !== id);
          cleanupRelations();
          saveDB();
          const content = root.querySelector('#trashContent');
          if(content) content.innerHTML = renderGroups();
          bind();
          toast('🗑️ تم المسح النهائي', 'ok');
          autoSyncAfterSave();
        };
      });
    };
    bind();
  }});
}

function toggleFullscreen(silent){ const el = document.documentElement; if(!isFullscreen()){ const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen; if(!req){ if(!silent) toast(t('msg_fs_unsupported'),'warn'); return; } try{ const p = req.call(el); if(p && p.catch) p.catch(()=>{ if(!silent) toast(t('msg_fs_failed'),'warn'); }); } catch(e){ if(!silent) toast(t('msg_fs_failed'),'warn'); } } else { const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen; if(ex){ try{ ex.call(document); }catch(e){} } } }
function applyPrintOrientation(){ let el = $('#printOrient'); if(!el){ el = document.createElement('style'); el.id = 'printOrient'; document.head.appendChild(el); } const o = db.settings.printOrientation || 'portrait'; const rule = o === 'landscape' ? 'A4 landscape' : o === 'auto' ? 'auto' : 'A4 portrait'; el.textContent = '@media print{@page{size:' + rule + ';margin:10mm}}'; }
function rebindPrintOrientation(){ applyPrintOrientation(); const topbar = document.querySelector('.topbar-actions'); if(!topbar) return; let btn = document.getElementById('printOrientBtn'); if(!btn){ btn = document.createElement('button'); btn.className = 'icon-btn'; btn.id = 'printOrientBtn'; btn.type = 'button'; btn.title = 'اتجاه الطباعة'; const printBtn = document.getElementById('printBtn'); if(printBtn && printBtn.parentNode) printBtn.parentNode.insertBefore(btn, printBtn); else topbar.insertBefore(btn, topbar.firstChild); btn.onclick = function(){ const modes = ['portrait', 'landscape', 'auto']; const cur = (db.settings.printOrientation) || 'portrait'; const next = modes[(modes.indexOf(cur) + 1) % modes.length]; db.settings.printOrientation = next; saveDB(); applyPrintOrientation(); btn.textContent = next === 'landscape' ? '📃' : next === 'auto' ? '🔄' : '📄'; toast('اتجاه الطباعة: ' + (next === 'landscape' ? 'أفقي' : next === 'auto' ? 'تلقائي' : 'رأسي'), 'ok'); }; } const o = db.settings.printOrientation || 'portrait'; btn.textContent = o === 'landscape' ? '📃' : o === 'auto' ? '🔄' : '📄'; }
function rebindSyncMenu(){ const syncBtn = $('#syncBtn'); if(!syncBtn) return; syncBtn.innerHTML = '<i class="fa-solid fa-rotate"></i>'; syncBtn.title = 'المزامنة السحابية'; syncBtn.style.cssText = 'background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px rgba(99,102,241,.55)'; syncBtn.onclick = (e)=> e.preventDefault(); let dd = $('#syncMenuDd'); if(dd) dd.remove(); dd = document.createElement('div'); dd.id = 'syncMenuDd'; dd.style.cssText = 'position:fixed;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 48px -20px rgba(15,23,42,.4);padding:8px;z-index:99999;min-width:270px;display:none'; const ready = isCloudReady(); const item = (act, icon, title, sub, color) => `<button type="button" data-sync-act="${act}" style="width:100%;text-align:start;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:12px;background:transparent;color:var(--text-2);border:0;cursor:pointer;transition:background .15s"><span style="width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:${color}18;color:${color};font-size:14px;flex:0 0 36px"><i class="fa-solid ${icon}"></i></span><span style="flex:1;min-width:0;text-align:start"><div style="font-size:13px;font-weight:700;color:var(--text)">${title}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${sub}</div></span></button>`; dd.innerHTML = `<div style="padding:10px 14px 12px;border-bottom:1px solid var(--border);margin-bottom:6px"><div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase">☁️ المزامنة السحابية</div><div style="font-size:12px;color:${ready?'var(--green-ink)':'var(--amber-ink)'};margin-top:4px;font-weight:800">${ready ? '✅ متصل' : '⚠️ غير متصل'}</div></div>${item('full', 'fa-rotate', 'مزامنة كاملة', 'رفع + سحب + دمج', '#6366f1')}${item('push', 'fa-cloud-arrow-up', 'رفع للسحابة', 'إرسال البيانات', '#10b981')}${item('pull', 'fa-cloud-arrow-down', 'جلب من السحابة', 'استقبال البيانات', '#06b6d4')}<div style="border-top:1px solid var(--border);margin:6px 0"></div>${item('settings', 'fa-gear', 'إعدادات الاتصال', 'تكوين jsonbin.io', '#64748b')}`; document.body.appendChild(dd); let hideTimer; const positionDd = ()=>{ const r = syncBtn.getBoundingClientRect(); dd.style.top = (r.bottom + 8) + 'px'; dd.style.right = (window.innerWidth - r.right) + 'px'; dd.style.left = 'auto'; }; const showDd = ()=>{ clearTimeout(hideTimer); positionDd(); dd.style.display = 'block'; }; const hideDd = ()=>{ hideTimer = setTimeout(()=> dd.style.display = 'none', 220); }; syncBtn.addEventListener('mouseenter', showDd); syncBtn.addEventListener('mouseleave', hideDd); dd.addEventListener('mouseenter', ()=> clearTimeout(hideTimer)); dd.addEventListener('mouseleave', hideDd); syncBtn.addEventListener('click', (e)=>{ e.stopPropagation(); if(dd.style.display === 'block') dd.style.display='none'; else showDd(); }); document.addEventListener('click', (e)=>{ if(!dd.contains(e.target) && e.target !== syncBtn && !syncBtn.contains(e.target)) dd.style.display = 'none'; }); dd.querySelectorAll('[data-sync-act]').forEach(b=>{ b.onmouseenter = ()=> b.style.background = 'var(--primary-soft)'; b.onmouseleave = ()=> b.style.background = 'transparent'; b.onclick = async ()=>{ const act = b.dataset.syncAct; dd.style.display = 'none'; if(act === 'settings'){ settingsModal(); return; } if(!isCloudReady()){ toast(t('msg_set_cloud'),'warn'); settingsModal(); return; } syncBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; try{ let ok = false; if(act === 'full') ok = await fullSync(); else if(act === 'push') ok = await pushToCloud(); else if(act === 'pull') ok = await pullFromCloud(); if(ok) render(); } finally { syncBtn.innerHTML = '<i class="fa-solid fa-rotate"></i>'; } }; }); }

function loadFirebaseSDK(){ return new Promise((resolve, reject) => { if(typeof firebase !== 'undefined' && firebase.auth){ resolve(); return; } const scripts = ['https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js', 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js']; let loaded = 0; scripts.forEach(src => { const s = document.createElement('script'); s.src = src; s.onload = () => { loaded++; if(loaded === scripts.length) resolve(); }; s.onerror = () => reject(new Error('Failed to load ' + src)); document.head.appendChild(s); }); }); }
async function initFirebase(){ try{ await loadFirebaseSDK(); firebase.initializeApp(FIREBASE_CONFIG); window._firebaseAuth = firebase.auth(); window._firebaseReady = true; if(window._firebaseAuth.setPersistence){ window._firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {}); } } catch(e){ console.warn('[Firebase init]', e); window._firebaseReady = false; } }
function resolveRoleFromEmail(email){ if(!email) return null; email = String(email).toLowerCase().trim(); const owner = db.auth && db.auth.owner; if(owner && (owner.email || '').toLowerCase() === email){ return { id:'owner', role:'owner', name: t('role_owner'), email }; } const sup = (db.supervisors || []).find(s => (s.email || '').toLowerCase() === email && !s.deleted); if(sup) return { id: sup.id, role: 'supervisor', name: sup.name, email }; return null; }
async function googleSignIn(){ if(!window._firebaseReady){ toast('⏳ جاري تهيئة Firebase...','warn'); await initFirebase(); if(!window._firebaseReady){ toast('❌ لم يتم التهيئة','err'); return; } } try{ const provider = new firebase.auth.GoogleAuthProvider(); const result = await window._firebaseAuth.signInWithPopup(provider); const user = result.user; const role = resolveRoleFromEmail(user.email); if(!role){ await window._firebaseAuth.signOut(); toast('❌ هذا البريد غير مسجل في النظام','err'); return; } state.user = role; saveSession(role); const allowed = allowedSections(); if(!allowed.includes(state.section)) state.section = allowed[0] || 'dashboard'; addNotif(t('welcome') + ' 👋', role.name, 'ok'); showApp(); toast('✅ ' + t('welcome') + ' ' + role.name, 'ok'); }catch(e){ console.error('[Google signin]', e); if(e.code === 'auth/popup-closed-by-user') return; toast('❌ ' + e.message, 'err'); } }
