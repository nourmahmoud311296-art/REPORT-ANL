<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحليل أداء السائقين</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<meta name="theme-color" content="#6366f1">
<meta name="description" content="نظام تحليل أداء السائقين — لوحة تحكم متكاملة">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;700;800&family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#6366f1;--primary-2:#8b5cf6;--primary-3:#06b6d4;--primary-soft:rgba(99,102,241,.08);--primary-dark:#4f46e5;--accent:#06b6d4;--card:#ffffff;--bg:#f5f6fa;--bg-2:#fafbfd;--bg-3:#eef0f7;--text:#0b1220;--text-2:#334155;--muted:#64748b;--muted-2:#94a3b8;--border:#e7e9f0;--border-2:#f0f2f8;--radius:18px;--radius-sm:12px;--radius-lg:24px;--fs:14.5px;--green:#10b981;--green-soft:#ecfdf5;--green-ink:#047857;--red:#ef4444;--red-soft:#fef2f2;--red-ink:#b91c1c;--amber:#f59e0b;--amber-soft:#fffbeb;--amber-ink:#b45309;--violet:#8b5cf6;--cyan:#06b6d4;--grad-brand:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#06b6d4 100%);--grad-hero:linear-gradient(135deg,#0f172a 0%,#1e1b4b 45%,#4338ca 100%);--grad-side:linear-gradient(180deg,#0b1220 0%,#121a33 50%,#1a1f3d 100%);--shadow-xs:0 1px 2px rgba(15,23,42,.04);--shadow-sm:0 1px 3px rgba(15,23,42,.05),0 1px 2px rgba(15,23,42,.03);--shadow:0 6px 20px -6px rgba(15,23,42,.10),0 2px 6px -2px rgba(15,23,42,.05);--shadow-md:0 14px 34px -12px rgba(15,23,42,.16),0 4px 10px -4px rgba(15,23,42,.06);--shadow-lg:0 32px 70px -30px rgba(15,23,42,.35);--shadow-glow:0 18px 40px -18px rgba(99,102,241,.55);--focus:0 0 0 3px rgba(99,102,241,.18);--glass:saturate(180%) blur(18px)}
*{box-sizing:border-box}
html,body{height:100%;max-width:100%}
html{overflow-x:hidden}
body{margin:0;font-family:'Tajawal','Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);background-image:radial-gradient(900px 500px at 100% 0%,rgba(99,102,241,.06),transparent 60%),radial-gradient(900px 500px at 0% 100%,rgba(6,182,212,.05),transparent 60%);color:var(--text);font-size:var(--fs);line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#94a3b8;background-clip:padding-box;border:3px solid transparent}
[data-theme="dark"]{--card:#1a2332;--bg:#0d1520;--bg-2:#1a2332;--bg-3:#253345;--text:#e8edf5;--text-2:#b8c5d6;--muted:#8896a8;--muted-2:#64748b;--border:#2a3a52;--border-2:#1e293b;--primary-soft:rgba(99,102,241,.16);--shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow:0 6px 20px -6px rgba(0,0,0,.4)}
[data-theme="dark"] body{background-image:radial-gradient(900px 500px at 100% 0%,rgba(99,102,241,.1),transparent 60%),radial-gradient(900px 500px at 0% 100%,rgba(6,182,212,.08),transparent 60%)}
[data-theme="dark"] .topbar{background:rgba(26,35,50,.85)}
[data-theme="dark"] .card-head,[data-theme="dark"] .modal-head,[data-theme="dark"] .notif-head{background:linear-gradient(180deg,#1a2332,#1e2b3f)}
[data-theme="dark"] thead th{background:linear-gradient(180deg,#1e2b3f,#1a2332)!important;color:#94a3b8}
[data-theme="dark"] .toolbar{background:rgba(26,35,50,.9)}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:var(--bg-3);color:var(--text);border-color:var(--border)}
[data-theme="dark"] .login-card{background:rgba(26,35,50,.98)}
[data-theme="dark"] .modal-foot{background:#152030}
[data-theme="dark"] .item-card,[data-theme="dark"] .goal-card,[data-theme="dark"] .grade-box{background:var(--card)}
[data-theme="dark"] .sync-panel,[data-theme="dark"] .insight-tile{background:linear-gradient(180deg,#1a2332,#152030)}
[data-theme="dark"] .notif-item:hover{background:var(--bg-3)}
.app{display:flex;min-height:100vh;width:100%;max-width:100%;overflow-x:hidden;background:var(--grad-side);background-size:272px 100%;background-repeat:no-repeat;background-position:right top}
[dir="ltr"] .app{background-position:left top}
@media(max-width:980px){.app{background:none}}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.sidebar{width:272px;flex:0 0 272px;background:transparent;border-inline-end:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;overflow:hidden;transition:transform .28s cubic-bezier(.4,0,.2,1);color:#cbd5e1}
.sidebar::before{content:'';position:absolute;top:-120px;right:-100px;width:320px;height:320px;background:radial-gradient(circle,rgba(139,92,246,.35),transparent 65%);pointer-events:none}
.sidebar::after{content:'';position:absolute;bottom:-140px;left:-120px;width:340px;height:340px;background:radial-gradient(circle,rgba(6,182,212,.22),transparent 65%);pointer-events:none}
.brand{display:flex;gap:12px;align-items:center;padding:22px 18px;border-bottom:1px solid rgba(255,255,255,.06);position:relative;z-index:1;flex-shrink:0}
.logo{width:44px;height:44px;flex:0 0 44px;border-radius:13px;display:grid;place-items:center;font-size:20px;color:#fff;overflow:hidden;background:var(--grad-brand);box-shadow:0 8px 22px -8px rgba(99,102,241,.7),inset 0 0 0 1px rgba(255,255,255,.12)}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:13px}
.brand-title{font-weight:800;color:#fff;font-size:14.5px;line-height:1.3;letter-spacing:-.2px}
.brand-sub{font-size:11.5px;color:#94a3b8;margin-top:2px;font-weight:500}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;position:relative;z-index:1;min-height:0}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;background:transparent;border:0;color:#94a3b8;font-weight:600;text-align:start;width:100%;transition:all .18s ease;font-size:13.5px;position:relative}
.nav-item:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.nav-item.active{background:linear-gradient(90deg,rgba(99,102,241,.22),rgba(139,92,246,.10));color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(139,92,246,.25)}
.nav-item.active::before{content:'';position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad-brand);box-shadow:0 0 14px rgba(139,92,246,.8)}
.nav-item .ic{font-size:15px;width:22px;text-align:center;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.nav-item .badge{margin-inline-start:auto;background:rgba(255,255,255,.08);color:#cbd5e1;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700}
.nav-item.active .badge{background:var(--grad-brand);color:#fff}
.side-bottom{padding:12px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:3px;position:relative;z-index:1;flex-shrink:0;background:linear-gradient(180deg,rgba(11,18,32,.9),rgba(11,18,32,1))}
.side-btn{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:11px;border:0;background:transparent;color:#94a3b8;font-weight:600;text-align:start;width:100%;font-size:13px;transition:all .18s}
.side-btn:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.side-btn .si{font-size:15px;width:20px;text-align:center;display:inline-flex;align-items:center;justify-content:center}
.user-box{display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:8px;background:rgba(255,255,255,.05);border-radius:13px;border:1px solid rgba(255,255,255,.06)}
.ub-avatar{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;background:var(--grad-brand);box-shadow:0 6px 16px -6px rgba(99,102,241,.7)}
.ub-info{flex:1;min-width:0}
.ub-name{color:#fff;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ub-role{color:#94a3b8;font-size:11px;margin-top:1px;font-weight:500}
.ub-out{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:#94a3b8;display:grid;place-items:center;font-size:14px;transition:.15s}
.ub-out:hover{background:rgba(239,68,68,.18);color:#fca5a5}
.sidebar[data-collapsed="1"]{width:72px;flex:0 0 72px}
.sidebar[data-collapsed="1"] .brand-title,.sidebar[data-collapsed="1"] .brand-sub,.sidebar[data-collapsed="1"] .nav-item span:not(.ic),.sidebar[data-collapsed="1"] .side-btn span:not(.si),.sidebar[data-collapsed="1"] .ub-info,.sidebar[data-collapsed="1"] .nav-item .badge{display:none}
.sidebar[data-collapsed="1"] .brand,.sidebar[data-collapsed="1"] .nav-item,.sidebar[data-collapsed="1"] .side-btn{justify-content:center}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 24px;background:rgba(255,255,255,.75);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.topbar h1{margin:0;font-size:17px;font-weight:800;flex:1;min-width:120px;color:var(--text);letter-spacing:-.3px}
.topbar-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text-2);display:grid;place-items:center;font-size:15px;transition:all .18s;position:relative}
.icon-btn:hover{background:var(--bg-2);border-color:#d1d5db;color:var(--text);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.icon-btn.danger:hover{background:var(--red-soft);border-color:#fecaca;color:var(--red)}
.icon-btn.wa{background:linear-gradient(135deg,#25D366,#128C7E);border-color:transparent;color:#fff;box-shadow:0 6px 16px -6px rgba(37,211,102,.5)}
.icon-btn.wa:hover{box-shadow:0 8px 22px -6px rgba(37,211,102,.7);transform:translateY(-1px)}
.notif-badge{position:absolute;top:-5px;inset-inline-end:-5px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff;box-shadow:0 4px 10px -2px rgba(239,68,68,.6)}
#menuBtn{display:none}
.view{padding:26px;display:flex;flex-direction:column;gap:22px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);transition:box-shadow .25s,border-color .25s;overflow:hidden;position:relative}
.card:hover{box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--border-2);font-weight:700;font-size:14.5px;flex-wrap:wrap;color:var(--text);letter-spacing:-.2px;background:linear-gradient(180deg,#fff,#fcfcfe)}
.card-head .spacer{flex:1}
.card-body{padding:22px}
.card.collapsed > *:not(.card-head){display:none!important}
.card.collapsed .card-head{border-bottom:0}
.card-collapse{width:30px!important;height:30px!important;font-size:12px!important;border-radius:9px!important;margin-inline-start:6px;flex:0 0 30px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:12.5px}
.empty{padding:48px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text-2);font-weight:600;font-size:13.5px;transition:all .18s;white-space:nowrap}
.btn:hover{background:var(--bg-2);border-color:#d1d5db;color:var(--text);box-shadow:var(--shadow-xs)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--grad-brand);border-color:transparent;color:#fff;box-shadow:var(--shadow-glow)}
.btn-primary:hover{filter:brightness(1.06);color:#fff;transform:translateY(-1px);box-shadow:0 14px 30px -12px rgba(99,102,241,.75)}
.btn-danger{background:var(--red-soft);border-color:#fecaca;color:var(--red-ink)}
.btn-danger:hover{background:#fee2e2;border-color:#fca5a5;color:var(--red-ink)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 10px}
.btn-ghost:hover{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:10px}
.btn:focus-visible,.icon-btn:focus-visible{outline:0;box-shadow:var(--focus)}
.view-toggle{display:inline-flex;gap:3px;background:var(--bg-3);padding:3px;border-radius:11px;border:1px solid var(--border)}
.view-toggle button{padding:5px 12px;border:0;background:transparent;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .18s}
.view-toggle button:hover{color:var(--text)}
.view-toggle button.active{background:var(--card);color:var(--primary);font-weight:700;box-shadow:var(--shadow-xs)}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);transition:box-shadow .25s,transform .25s,border-color .25s;position:relative;overflow:hidden;padding:18px 20px;display:flex;flex-direction:column;gap:12px;height:100%}
.kpi::before{content:'';position:absolute;top:0;inset-inline-start:0;width:100%;height:3px;background:linear-gradient(90deg,var(--k),transparent);opacity:.7}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:#d1d5db}
.kpi-top{display:flex;align-items:center;gap:14px}
.kpi-icon{width:46px;height:46px;flex:0 0 46px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:#fff;color:var(--k);border:1px solid var(--border);box-shadow:0 6px 14px -8px rgba(15,23,42,.15)}
.kpi-body{flex:1;min-width:0}
.kpi-label{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.2px;text-transform:uppercase}
.kpi-value{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.6px;margin-top:3px;color:var(--text);font-variant-numeric:tabular-nums}
.kpi-ring-mini{width:56px;height:56px;flex:0 0 56px;position:relative}
.kpi-ring-mini svg{transform:rotate(-90deg);width:100%;height:100%}
.kpi-ring-mini .bg{fill:none;stroke:var(--bg-3);stroke-width:5}
.kpi-ring-mini .fg{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)}
.kpi-ring-mini .val{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--k);font-variant-numeric:tabular-nums}
.kpi-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kpi-delta{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px}
.kpi-delta.up{background:var(--green-soft);color:var(--green-ink)}
.kpi-delta.down{background:var(--red-soft);color:var(--red-ink)}
.kpi-spark{flex:1;min-width:70px}
.kpi-spark svg{display:block;width:100%;height:34px}
.delta-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--bg-3);color:var(--muted)}
.delta-chip.up{background:var(--green-soft);color:var(--green-ink)}
.delta-chip.down{background:var(--red-soft);color:var(--red-ink)}
.tbl-wrap{overflow:auto;border-radius:14px;border:1px solid var(--border);background:var(--card);-webkit-overflow-scrolling:touch;max-height:72vh;position:relative}
.tbl-wrap table thead th{position:sticky!important;top:0!important;z-index:5!important;background:linear-gradient(180deg,#fafbfd,#f3f5fa)!important;box-shadow:0 1px 0 var(--border)!important}
.tbl-wrap.scrolled table thead th{box-shadow:0 3px 12px -4px rgba(15,23,42,.22)!important}
[data-theme="dark"] .tbl-wrap table thead th{background:linear-gradient(180deg,#1e2b3f,#1a2332)!important;color:#94a3b8!important}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
thead th{background:linear-gradient(180deg,#fafbfd,#f3f5fa);text-align:start;padding:13px 16px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tbody td{padding:14px 16px;border-bottom:1px solid var(--border-2);vertical-align:middle;color:var(--text-2)}
tbody tr{transition:background .15s}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:linear-gradient(90deg,var(--primary-soft),transparent 60%)}
tfoot td{padding:14px 16px;border-top:2px solid var(--border);color:var(--text)}
.tbl-actions{display:flex;gap:4px;justify-content:flex-end}
.cards-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px;transition:all .25s;box-shadow:var(--shadow-xs);position:relative;overflow:hidden}
.item-card::before{content:'';position:absolute;top:0;inset-inline-start:0;width:100%;height:3px;background:var(--grad-brand);opacity:0;transition:opacity .25s}
.item-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:#d1d5db}
.item-card:hover::before{opacity:1}
.item-card .ic-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.item-card .ic-avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:17px;font-weight:800;background:var(--grad-brand);flex:0 0 44px;box-shadow:0 8px 18px -8px rgba(99,102,241,.7)}
.item-card .ic-name{font-weight:700;font-size:14.5px;color:var(--text)}
.item-card .ic-sub{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
.item-card .ic-rows{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.item-card .ic-rows > div{display:flex;justify-content:space-between;gap:8px}
.item-card .ic-rows .k{color:var(--muted);font-weight:500}
.item-card .ic-rows .v{font-weight:700;color:var(--text)}
.item-card .ic-actions{display:flex;gap:4px;margin-top:14px;justify-content:flex-end;border-top:1px solid var(--border-2);padding-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:9px;font-size:11.5px;font-weight:700;line-height:1.6}
.chip.green{background:var(--green-soft);color:var(--green-ink)}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.amber{background:var(--amber-soft);color:var(--amber-ink)}
.chip.blue{background:#eff6ff;color:#1d4ed8}
.chip.gray{background:var(--bg-3);color:var(--muted)}
.chip.violet{background:#f5f3ff;color:#6d28d9}
.chip.grade{width:34px;height:34px;padding:0;justify-content:center;border-radius:10px;font-size:15px;font-weight:800;color:#fff;box-shadow:0 4px 10px -4px rgba(15,23,42,.35)}
.chip.grade.A{background:linear-gradient(135deg,#10b981,#059669)}
.chip.grade.B{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.chip.grade.C{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.chip.grade.D{background:linear-gradient(135deg,#f59e0b,#d97706)}
.chip.grade.E{background:linear-gradient(135deg,#f97316,#ea580c)}
.chip.grade.F{background:linear-gradient(135deg,#ef4444,#dc2626)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.field .req{color:var(--red)}
input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:11px;background:var(--card);outline:none;transition:border-color .18s,box-shadow .18s,background .18s;font-size:13.5px}
input::placeholder,textarea::placeholder{color:var(--muted-2)}
input:hover,select:hover,textarea:hover{border-color:#d1d5db}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:var(--focus);background:#fff}
input[readonly]{background:#f8fafc!important;font-weight:800;cursor:not-allowed}
textarea{resize:vertical;min-height:70px}
.form-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.hint{font-size:11.5px;color:var(--muted)}
.err{color:var(--red);font-size:12.5px;font-weight:600;margin-top:6px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.cax{font-size:11px;fill:var(--muted-2);font-weight:600}
.cval{font-size:11.5px;fill:var(--text-2);font-weight:700}
.dnum{font-size:28px;font-weight:800;fill:var(--text)}
.dlbl{font-size:11px;fill:var(--muted);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:16px}
.legend span{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block}
.chart-type-selector{display:inline-flex;gap:3px;background:var(--bg-3);padding:3px;border-radius:10px;border:1px solid var(--border)}
.chart-type-selector button{padding:5px 10px;border:0;background:transparent;border-radius:7px;font-size:13px;color:var(--muted);transition:all .18s}
.chart-type-selector button:hover{color:var(--text)}
.chart-type-selector button.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow-xs)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:rgba(255,255,255,.85);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);position:sticky;top:78px;z-index:20}
.tool-btn{display:inline-flex;align-items:center;height:44px;width:44px;padding:0;overflow:hidden;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text-2);font-weight:600;font-size:13.5px;transition:all .3s cubic-bezier(.4,0,.2,1);white-space:nowrap}
.tool-btn .ti{width:42px;flex:0 0 42px;text-align:center;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.tool-btn .tt{opacity:0;transition:opacity .2s .06s;padding-inline-end:16px}
.tool-btn:hover,.tool-btn:focus-visible{width:170px;background:var(--grad-brand);border-color:transparent;color:#fff;box-shadow:var(--shadow-glow)}
.tool-btn:hover .tt,.tool-btn:focus-visible .tt{opacity:1}
.tool-btn.danger:hover{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 12px 28px -12px rgba(239,68,68,.7)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--bg-3);padding:5px;border-radius:14px;border:1px solid var(--border);width:fit-content}
.tab{padding:9px 16px;border-radius:9px;border:0;background:transparent;font-weight:600;font-size:13px;color:var(--muted);transition:.18s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--card);color:var(--primary);font-weight:700;box-shadow:var(--shadow-xs)}
.overlay{position:fixed;inset:0;background:rgba(11,18,32,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;z-index:100;padding:18px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:22px;width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .28s cubic-bezier(.34,1.3,.64,1);overflow:hidden;border:1px solid var(--border)}
.modal.wide{width:min(1200px,100%)}
@keyframes pop{from{transform:scale(.96) translateY(14px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;padding:20px 24px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#fff,#fafbfd)}
.modal-head h3{margin:0;font-size:16px;font-weight:800;flex:1;color:var(--text);letter-spacing:-.2px}
.modal-body{padding:24px;overflow-y:auto}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--bg-2)}
.notif-panel{position:fixed;top:80px;inset-inline-end:18px;width:min(410px,calc(100vw - 36px));max-height:min(580px,76vh);background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg);z-index:150;display:none;flex-direction:column;overflow:hidden}
.notif-panel.open{display:flex;animation:pop .22s}
.notif-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#fff,#fafbfd)}
.notif-head h4{margin:0;flex:1;font-size:14.5px;font-weight:800;color:var(--text)}
.notif-list{flex:1;overflow-y:auto}
.notif-item{padding:15px 20px;border-bottom:1px solid var(--border-2);display:flex;gap:12px;align-items:flex-start;transition:background .18s}
.notif-item:last-child{border-bottom:0}
.notif-item:hover{background:var(--bg-2)}
.notif-item.unread{background:linear-gradient(90deg,var(--primary-soft),transparent)}
.notif-item .ni{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--bg-3)}
.notif-item .nt{font-weight:700;font-size:13.5px;margin-bottom:3px;color:var(--text)}
.notif-item .nb{font-size:12.5px;color:var(--muted);line-height:1.55}
.notif-item .nd{font-size:11px;color:var(--muted-2);margin-top:6px;font-weight:600}
#toast{position:fixed;bottom:26px;inset-inline-start:26px;display:flex;flex-direction:column;gap:10px;z-index:600}
.toast{background:var(--text);color:#f8fafc;padding:13px 18px;border-radius:14px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow-lg);animation:slide .28s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;gap:10px;max-width:380px;border:1px solid rgba(255,255,255,.08)}
.toast.ok{background:linear-gradient(135deg,#047857,#10b981)}
.toast.err{background:linear-gradient(135deg,#b91c1c,#ef4444)}
.toast.warn{background:linear-gradient(135deg,#b45309,#f59e0b)}
@keyframes slide{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.perm-list{display:flex;flex-direction:column;gap:10px}
.perm-card{border:1px solid var(--border);border-radius:16px;padding:16px 18px;background:var(--card);margin-bottom:14px;box-shadow:var(--shadow-xs)}
.perm-card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border-2)}
.perm-card-title{font-weight:800;font-size:14px;color:var(--text)}
.perm-table{width:100%;border-collapse:collapse}
.perm-table th{text-align:start;padding:9px 12px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--bg-2)}
.perm-table th:nth-child(2),.perm-table th:nth-child(3){text-align:center;width:90px}
.perm-table td{padding:9px 12px;border-bottom:1px solid var(--border-2);font-size:13px;color:var(--text-2)}
.perm-table tr:last-child td{border-bottom:0}
.perm-table tr.branch td:first-child{padding-inline-start:38px;font-size:12.5px;color:var(--muted);font-weight:500;position:relative}
.perm-table tr.branch td:first-child::before{content:'↳';position:absolute;inset-inline-start:18px;color:var(--muted-2);font-weight:700}
.perm-table .chk-cell{text-align:center}
.perm-table .chk-cell input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;margin:0;padding:0;vertical-align:middle}
.perm-table .section-icon{display:inline-block;margin-inline-end:6px;font-size:15px}
.perm-check{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);padding:7px 12px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;transition:.18s;color:var(--text-2)}
.perm-check:hover{border-color:var(--primary);background:var(--primary-soft)}
.perm-check input{width:auto;padding:0;margin:0;accent-color:var(--primary)}
.perm-check:has(input:checked){background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark);font-weight:700}
.perm-card.collapsed .perm-table-wrap{display:none}
.perm-card-head .perm-toggle{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;font-size:15px;transition:.18s;flex:0 0 34px}
.perm-card-head .perm-toggle:hover{background:var(--primary-soft);border-color:var(--primary)}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:11px;border:2px solid var(--card);cursor:pointer;transition:.18s;box-shadow:0 0 0 1px var(--border)}
.swatch:hover{transform:scale(1.12)}
.swatch.sel{box-shadow:0 0 0 3px var(--text);transform:scale(1.06)}
.share-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.share-box input{font-size:12px;direction:ltr;text-align:left;flex:1;min-width:180px}
.checkbox-list{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:14px;padding:12px;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));background:var(--bg-2)}
.login-screen{position:fixed;inset:0;background:radial-gradient(1000px 700px at 15% 20%,rgba(139,92,246,.45),transparent 55%),radial-gradient(1000px 700px at 85% 80%,rgba(6,182,212,.32),transparent 55%),linear-gradient(135deg,#070b18,#121a3d 55%,#1e1b4b);display:grid;place-items:center;z-index:500;padding:20px;overflow:hidden}
.login-screen::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 30%,rgba(139,92,246,.22),transparent 40%),radial-gradient(circle at 70% 70%,rgba(6,182,212,.20),transparent 40%);animation:float 22s ease-in-out infinite;pointer-events:none}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(2%,2%)}}
.login-card{background:rgba(255,255,255,.98);border-radius:26px;padding:42px 36px;width:min(460px,100%);box-shadow:0 60px 120px -30px rgba(0,0,0,.7);animation:pop .38s;position:relative;z-index:1;backdrop-filter:blur(10px)}
.login-logo{width:80px;height:80px;border-radius:22px;margin:0 auto 20px;overflow:hidden;display:grid;place-items:center;font-size:36px;color:#fff;background:var(--grad-brand);box-shadow:0 20px 44px -14px rgba(99,102,241,.75)}
.login-logo img{width:100%;height:100%;object-fit:cover;border-radius:22px}
.login-card h2{margin:0 0 6px;text-align:center;font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.5px}
.login-card>.sub{text-align:center;margin:0 0 28px;color:var(--muted);font-size:13.5px;font-weight:500}
.login-card form{display:flex;flex-direction:column;gap:16px}
.login-card .btn{justify-content:center;padding:13px;font-size:14.5px;border-radius:13px}
.login-hint{margin-top:24px;padding:14px 16px;background:var(--bg-3);border-radius:14px;font-size:12px;color:var(--text-2);text-align:center;line-height:1.6;border:1px solid var(--border)}
.login-hint b{color:var(--text);font-size:12.5px;display:block;margin-bottom:4px;font-weight:700}
.perf-hero{background:var(--grad-hero);border-radius:24px;padding:32px;color:#fff;position:relative;overflow:hidden;box-shadow:0 28px 60px -24px rgba(30,27,75,.7),inset 0 0 0 1px rgba(255,255,255,.06);display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center}
.perf-hero::before{content:'';position:absolute;top:-100px;right:-80px;width:340px;height:340px;background:radial-gradient(circle,rgba(139,92,246,.65),transparent 65%);pointer-events:none}
.perf-hero::after{content:'';position:absolute;bottom:-120px;left:-100px;width:380px;height:380px;background:radial-gradient(circle,rgba(6,182,212,.45),transparent 65%);pointer-events:none}
.perf-hero-info{position:relative;z-index:1}
.perf-hero-info .ph-sub{font-size:12.5px;color:#a5b4fc;font-weight:700;margin-bottom:8px;letter-spacing:.3px}
.perf-hero-info .ph-title{font-size:27px;font-weight:800;letter-spacing:-.7px;margin-bottom:12px}
.perf-hero-info .ph-desc{font-size:13.5px;color:#c7d2fe;line-height:1.65;font-weight:500;max-width:560px}
.perf-hero-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px;position:relative;z-index:1}
.ph-stat{display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);min-width:120px}
.ph-stat .phs-v{font-size:23px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.ph-stat .phs-l{font-size:11px;color:#a5b4fc;font-weight:700}
.perf-ring{position:relative;z-index:1;width:180px;height:180px;flex:0 0 180px}
.perf-ring svg{transform:rotate(-90deg);width:100%;height:100%}
.perf-ring .pr-bg{fill:none;stroke:rgba(255,255,255,.10);stroke-width:13}
.perf-ring .pr-fg{fill:none;stroke:url(#ringGrad);stroke-width:13;stroke-linecap:round;transition:stroke-dasharray 1.2s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 0 12px rgba(139,92,246,.6))}
.perf-ring .pr-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.perf-ring .pr-num{font-size:40px;font-weight:800;letter-spacing:-1.4px;line-height:1;font-variant-numeric:tabular-nums}
.perf-ring .pr-lbl{font-size:11px;color:#a5b4fc;font-weight:700;margin-top:6px;letter-spacing:.3px}
.perf-subs{display:flex;flex-direction:column;gap:12px;margin-top:22px;position:relative;z-index:1;max-width:560px;width:100%}
.perf-sub{display:flex;flex-direction:column;gap:6px}
.perf-sub-head{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#c7d2fe;font-weight:700;letter-spacing:.2px}
.perf-sub-head b{color:#fff;font-size:12.5px;font-variant-numeric:tabular-nums}
.perf-sub-bar{height:7px;background:rgba(255,255,255,.10);border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.perf-sub-bar > i{display:block;height:100%;border-radius:7px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.perf-sub.po > .perf-sub-bar > i{background:linear-gradient(90deg,#6366f1,#8b5cf6);box-shadow:0 0 10px rgba(139,92,246,.55)}
.perf-sub.ph > .perf-sub-bar > i{background:linear-gradient(90deg,#10b981,#06b6d4);box-shadow:0 0 10px rgba(16,185,129,.55)}
.grades-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:12px}
.grades-grid.daily{grid-template-columns:repeat(4,1fr)}
.grade-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:14px;background:var(--bg-2);border:1px solid var(--border);transition:.2s;min-height:120px}
.grade-box:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.grade-box .gb-letter{font-size:21px;font-weight:800;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px rgba(15,23,42,.4)}
.grade-box .gb-letter.A{background:linear-gradient(135deg,#10b981,#059669)}
.grade-box .gb-letter.B{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.grade-box .gb-letter.C{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.grade-box .gb-letter.D{background:linear-gradient(135deg,#f59e0b,#d97706)}
.grade-box .gb-letter.E{background:linear-gradient(135deg,#f97316,#ea580c)}
.grade-box .gb-letter.F{background:linear-gradient(135deg,#ef4444,#dc2626)}
.grade-box input{text-align:center;font-weight:800;font-size:14px;padding:6px 4px}
.grade-box .gb-lbl{font-size:10.5px;color:var(--muted);font-weight:600;text-align:center}
.grade-names{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-height:80px;overflow-y:auto;width:100%}
.grade-names span{font-size:10.5px;font-weight:700;background:var(--bg-3);color:var(--text-2);padding:2px 8px;border-radius:7px;border:1px solid var(--border-2)}
.grade-names .none{color:var(--muted-2);font-weight:500;background:transparent;border:0}
.insight-tile{padding:18px;border-radius:16px;border:1px solid var(--border);background:linear-gradient(180deg,#fff,#fafbfd);transition:.25s;position:relative;overflow:hidden}
.insight-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.insight-tile .it-label{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.2px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.insight-tile .it-value{font-size:20px;font-weight:800;margin-top:8px;color:var(--text);letter-spacing:-.4px}
.insight-tile .it-sub{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:500}
.insight-tile.tone-green{background:linear-gradient(180deg,#ecfdf5,#f6fffb);border-color:#a7f3d0}
.insight-tile.tone-green .it-label{color:#047857}
.insight-tile.tone-green .it-value{color:#065f46}
.insight-tile.tone-amber{background:linear-gradient(180deg,#fffbeb,#fffdf5);border-color:#fde68a}
.insight-tile.tone-amber .it-label{color:#b45309}
.insight-tile.tone-amber .it-value{color:#92400e}
.insight-tile.tone-blue{background:linear-gradient(180deg,#eff6ff,#f7faff);border-color:#bfdbfe}
.insight-tile.tone-blue .it-label{color:#1d4ed8}
.insight-tile.tone-blue .it-value{color:#1e3a8a}
.bulk-table{width:100%;border-collapse:collapse;font-size:13px;min-width:1400px}
.bulk-table th{background:linear-gradient(180deg,#fafbfd,#f3f5fa);text-align:center;padding:10px 8px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.bulk-table td{padding:8px;border-bottom:1px solid var(--border-2);vertical-align:middle;text-align:center}
.bulk-table td:first-child{text-align:start;padding-inline-start:14px}
.bulk-table input{padding:8px 10px;border-radius:9px;font-size:13px;text-align:center;min-width:60px}
.bulk-table input[type=text]{text-align:start;min-width:120px}
.bulk-table tr:hover{background:linear-gradient(90deg,var(--primary-soft),transparent 60%)}
.bulk-table .rep-name{font-weight:700;color:var(--text);font-size:13px}
.bulk-table .rep-sub{font-size:11px;color:var(--muted);margin-top:2px}
.day-picker{display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(180deg,#fff,#fafbfd);border:1px solid var(--border);border-radius:16px;flex-wrap:wrap;box-shadow:var(--shadow-xs)}
.day-picker .dp-label{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px;color:var(--text)}
.day-picker input[type=date],.day-picker input[type=month]{max-width:220px;padding:9px 12px}
.day-picker .dp-day-name{font-weight:700;color:var(--primary);background:var(--primary-soft);padding:6px 14px;border-radius:10px;font-size:12.5px}
.goal-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;position:relative;overflow:hidden;transition:.25s}
.goal-card:hover{box-shadow:var(--shadow);border-color:#d1d5db}
.goal-card::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--grad-brand)}
.goal-title{font-weight:700;font-size:13.5px;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.goal-values{display:flex;justify-content:space-between;margin-bottom:12px;font-size:12.5px}
.goal-values .gv-l{color:var(--muted);font-weight:500}
.goal-values .gv-v{font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.goal-bar{height:9px;border-radius:9px;background:var(--bg-3);overflow:hidden;position:relative}
.goal-bar > i{display:block;height:100%;border-radius:9px;transition:width .9s cubic-bezier(.4,0,.2,1);background:var(--grad-brand);box-shadow:0 0 12px rgba(99,102,241,.5)}
.goal-bar.exceed > i{background:linear-gradient(90deg,#10b981,#06b6d4);box-shadow:0 0 12px rgba(16,185,129,.5)}
.goal-pct{margin-top:10px;font-size:12px;font-weight:800;text-align:center}
.logo-upload{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-preview{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--grad-brand);color:#fff;overflow:hidden;flex:0 0 64px;box-shadow:0 10px 24px -10px rgba(99,102,241,.65)}
.logo-preview img{width:100%;height:100%;object-fit:cover}
.sync-panel{background:linear-gradient(180deg,#fff,#f8fafc);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
.sync-panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sync-panel-head h4{margin:0;font-size:14px;font-weight:800;color:var(--text)}
.sync-mode-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sync-mode-radio{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;transition:.18s}
.sync-mode-radio:hover{border-color:var(--primary)}
.sync-mode-radio:has(input:checked){background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark);font-weight:700}
.sync-mode-radio input{accent-color:var(--primary)}
.cloud-status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted)}
.cloud-status.on{color:var(--green-ink);background:var(--green-soft);border-color:#a7f3d0}
.cloud-status.off{color:var(--amber-ink);background:var(--amber-soft);border-color:#fde68a}
.cloud-status.syncing{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}
.attendance-kpi-grid{display:grid!important;gap:16px!important;grid-template-columns:repeat(3,1fr)!important;margin-bottom:16px!important}
@media (max-width:1024px){.attendance-kpi-grid{grid-template-columns:repeat(2,1fr)!important}}
@media (max-width:640px){.attendance-kpi-grid{grid-template-columns:1fr!important}}
.attendance-kpi-grid .kpi{height:100%}
#loadingOverlay{position:fixed;inset:0;display:none;place-items:center;background:radial-gradient(1000px 700px at 15% 20%,rgba(139,92,246,.45),transparent 55%),radial-gradient(1000px 700px at 85% 80%,rgba(6,182,212,.32),transparent 55%),linear-gradient(135deg,#070b18,#121a3d 55%,#1e1b4b);z-index:9999;color:#fff;font-family:inherit}
#loadingOverlay.show{display:grid}
#loadingOverlay .lo-box{text-align:center;animation:pop .35s}
#loadingOverlay .lo-icon{font-size:56px;margin-bottom:16px;display:block;animation:pulse 1.4s ease-in-out infinite}
#loadingOverlay .lo-title{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
#loadingOverlay .lo-sub{font-size:13px;color:#a5b4fc;font-weight:500}
#loadingOverlay .lo-bar{width:220px;height:4px;background:rgba(255,255,255,.12);border-radius:4px;margin:22px auto 0;overflow:hidden}
#loadingOverlay .lo-bar i{display:block;height:100%;width:40%;border-radius:4px;background:var(--grad-brand);animation:slide-bar 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
@keyframes slide-bar{0%{margin-inline-start:-40%}100%{margin-inline-start:100%}}
#printHeader{display:none;text-align:center;padding:16px 20px;margin-bottom:14px;border-bottom:2px solid var(--primary);background:linear-gradient(180deg,#f8fafc,#fff)}
#printHeader .ph-name{font-size:20px;font-weight:800;color:#0b1220;letter-spacing:-.3px}
#printHeader .ph-meta{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:#334155;font-weight:600}
#printHeader .ph-meta span{display:inline-flex;align-items:center;gap:6px}
#printHeader .ph-logo{max-height:60px;max-width:180px;object-fit:contain;display:block;margin:0 auto 8px}
img,svg,table{max-width:100%}
.select-add-wrap{display:flex;gap:6px;align-items:stretch;width:100%}
.select-add-wrap select{flex:1;min-width:0}
.btn-add-inline{flex:0 0 44px;display:grid;place-items:center;padding:0;line-height:1;border:1px solid var(--border);background:var(--card);border-radius:11px;font-size:20px;font-weight:800;color:var(--primary);transition:all .18s;cursor:pointer}
.btn-add-inline:hover{background:var(--primary-soft);border-color:var(--primary);transform:scale(1.06);box-shadow:0 6px 14px -6px var(--primary)}
.btn-add-inline:active{transform:scale(.95)}
.attach-btn{position:relative}
.attach-btn:hover{background:var(--primary-soft);color:var(--primary)}
.att-dropzone{border:2px dashed var(--border);border-radius:14px;padding:24px;text-align:center;background:var(--bg-2);transition:.2s;cursor:pointer}
.att-dropzone:hover,.att-dropzone.dragover{border-color:var(--primary);background:var(--primary-soft)}
.att-dropzone .dz-icon{font-size:32px;margin-bottom:8px;display:block}
#tmBody tr{cursor:grab;transition:background .15s}
#tmBody tr:active{cursor:grabbing}
#tmBody tr.drag-over{border-top:2px solid var(--primary)}

async function hashPwd(pwd){ return 'sha256$' + await sha256Hex(pwd); }
async function verifyPassword(input, storedHash){ if(!input || !storedHash) return false; const s = String(storedHash); if(s.startsWith('sha256$')) return (await hashPwd(input)) === s; if(s.startsWith('h') && !s.includes('$')){ let h = 0; const pwd = String(input||''); for(let i=0;i<pwd.length;i++){ h = ((h<<5)-h) + pwd.charCodeAt(i); h |= 0; } const legacy = 'h' + Math.abs(h).toString(36) + '_' + pwd.length; if(legacy === s) return true; } return false; }

function mergeCloudData(local, remote){
  if(!remote) return local;
  if(!local) return remote;
  const merged = JSON.parse(JSON.stringify(local));
  const purgeList = [...new Set([...(local.purgeList || []), ...(remote.purgeList || [])])];
  const purgeSet = new Set(purgeList);
  const arrayKeys = ['supervisors','reps','cars','maintenance','usage','oil','reports','notifications','rentalOffices','internet','settlements','attendance'];
  arrayKeys.forEach(k=>{
    const localArr = (local[k] || []).filter(x => x && x.id && !purgeSet.has(x.id));
    const remoteArr = (remote[k] || []).filter(x => x && x.id && !purgeSet.has(x.id));
    const map = new Map();
    localArr.forEach(item => map.set(item.id, item));
    remoteArr.forEach(item => {
      const existing = map.get(item.id);
      if(!existing){ map.set(item.id, item); return; }
      const lTime = Math.max(new Date(existing.updatedAt || 0).getTime(), new Date(existing.deletedAt || 0).getTime(), new Date(existing.createdAt || 0).getTime());
      const rTime = Math.max(new Date(item.updatedAt || 0).getTime(), new Date(item.deletedAt || 0).getTime(), new Date(item.createdAt || 0).getTime());
      if(rTime > lTime){ map.set(item.id, item); }
      else if(rTime === lTime && existing.deleted && !item.deleted){ map.set(item.id, item); }
    });
    merged[k] = [...map.values()];
  });
  merged.purgeList = purgeList;
  merged.settings = local.settings;
  merged.branding = local.branding || remote.branding;
  merged.auth = local.auth;
  merged.grades = local.grades;
  merged.dailyGrades = local.dailyGrades;
  merged.goals = local.goals;
  merged.meta = local.meta;
  return merged;
}

async function pushToCloud(silent){
  if(!isCloudReady()){ if(!silent) toast(t('msg_no_cloud'),'warn'); return false; }
  if(!silent && !confirm(t('msg_confirm_push'))) return false;
  if(state.cloudBusy) return false;
  state.cloudBusy = true; setCloudStatus('syncing');
  try{
    let remoteData = null;
    try{
      const getRes = await fetch(`${JSONBIN_BASE}/b/${state.cloudCfg.binId}/latest`, { headers:{ 'X-Master-Key': state.cloudCfg.key } });
      if(getRes.ok){
        const json = await getRes.json();
        const rec = json.record || json;
        remoteData = rec.data || rec;
      }
    }catch(e){ console.warn('[pushToCloud fetch]', e); }
    if(remoteData){
      const before = JSON.stringify(db);
      db = mergeCloudData(db, normalizeDB(remoteData));
      cleanupRelations();
      saveDB();
      if(JSON.stringify(db) !== before && state.user){ try{ render(); }catch(e){} }
    }
    const res = await fetch(`${JSONBIN_BASE}/b/${state.cloudCfg.binId}`, {
      method:'PUT',
      headers:{ 'Content-Type':'application/json','X-Master-Key': state.cloudCfg.key },
      body: JSON.stringify({ data: db, updatedAt: new Date().toISOString(), updatedBy: state.user ? state.user.name : 'system' })
    });
    if(!res.ok) throw new Error(await res.text());
    setCloudStatus('on');
    if(!silent){ toast(t('msg_synced'),'ok'); addNotif('☁️ مزامنة', t('msg_synced'), 'ok'); }
    return true;
  }catch(e){
    setCloudStatus('off');
    if(!silent) toast(t('msg_cloud_fail') + ': ' + e.message, 'err');
    return false;
  } finally { state.cloudBusy = false; }
}

function chartBar(data, color, height=280){ if(!data.length) return `<div class="empty">${t('no_data')}</div>`; const W=640, H=height, P={t:32,r:18,b:58,l:48}; const max = Math.max(...data.map(d=>num(d.value)),1); const iw = W-P.l-P.r, ih = H-P.t-P.b, bw = iw/data.length; const gid = 'bg'+Math.random().toString(36).slice(2,7); let s = `<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="1"/><stop offset="100%" stop-color="${color}" stop-opacity=".55"/></linearGradient></defs>`; for(let i=0;i<=4;i++){ const y = P.t + ih*i/4; s += `<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="rgba(15,23,42,.06)" stroke-dasharray="3 5"/>`; s += `<text x="${P.l-8}" y="${y+4}" text-anchor="end" class="cax">${Math.round(max*(1-i/4))}</text>`; } data.forEach((d,i)=>{ const h = ih*(num(d.value)/max); const x = P.l + i*bw + bw*0.2, w = bw*0.6, y = P.t + ih - h; s += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,2)}" rx="8" fill="url(#${gid})"><title>${esc(d.label)}: ${d.value}</title></rect>`; s += `<text x="${x+w/2}" y="${H-P.b+20}" text-anchor="middle" class="cax">${esc(shortLabel(d.label))}</text>`; s += `<text x="${x+w/2}" y="${y-8}" text-anchor="middle" class="cval">${d.value}</text>`; }); return s + `</svg>`; }
function chartLine(data, color){ if(!data.length) return `<div class="empty">${t('no_data')}</div>`; const W=640,H=280,P={t:32,r:22,b:56,l:48}; const max = Math.max(...data.map(d=>num(d.value)),1); const iw = W-P.l-P.r, ih = H-P.t-P.b; const step = data.length>1 ? iw/(data.length-1) : 0; const pts = data.map((d,i)=>[P.l+i*step, P.t+ih-ih*(num(d.value)/max)]); const gid = 'lg'+Math.random().toString(36).slice(2,7); let s = `<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`; for(let i=0;i<=4;i++){ const y = P.t + ih*i/4; s += `<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="rgba(15,23,42,.06)" stroke-dasharray="3 5"/>`; s += `<text x="${P.l-8}" y="${y+4}" text-anchor="end" class="cax">${Math.round(max*(1-i/4))}</text>`; } const path = pts.map((p,i)=> (i?'L':'M') + p[0] + ' ' + p[1]).join(' '); s += `<path d="${path} L ${pts[pts.length-1][0]} ${P.t+ih} L ${pts[0][0]} ${P.t+ih} Z" fill="url(#${gid})"/>`; s += `<path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`; pts.forEach((p,i)=>{ s += `<circle cx="${p[0]}" cy="${p[1]}" r="5.5" fill="#fff" stroke="${color}" stroke-width="3"><title>${esc(data[i].label)}: ${data[i].value}</title></circle>`; s += `<text x="${p[0]}" y="${p[1]-13}" text-anchor="middle" class="cval">${data[i].value}</text>`; s += `<text x="${p[0]}" y="${H-P.b+20}" text-anchor="middle" class="cax">${esc(shortLabel(data[i].label,9))}</text>`; }); return s + `</svg>`; }
function chartDonut(data, colors, hollow=true){ const total = data.reduce((a,b)=>a+num(b.value),0); if(!total) return `<div class="empty">${t('no_data')}</div>`; const R = hollow ? 70 : 72, C = 2*Math.PI*R; let off=0, s = `<svg viewBox="0 0 200 200" class="chart" style="max-width:240px;margin:auto">`; data.forEach((d,i)=>{ const len = C*(num(d.value)/total); s += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="${hollow?30:60}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(d.label)}: ${d.value}</title></circle>`; off += len; }); if(hollow){ s += `<text x="100" y="97" text-anchor="middle" class="dnum">${total}</text>`; s += `<text x="100" y="120" text-anchor="middle" class="dlbl">${t('total')}</text>`; } s += `</svg>`; s += `<div class="legend">` + data.map((d,i)=>`<span><i style="background:${colors[i%colors.length]}"></i>${esc(d.label)} — ${d.value}</span>`).join('') + `</div>`; return s; }

function chartTypeSelector(chartKey){ const cur = db.settings.chartTypes[chartKey] || 'bar'; const types = [['bar','📊',t('chart_bar')],['line','📈',t('chart_line')],['donut','🍩',t('chart_donut')],['pie','🥧',t('chart_pie')]]; return `<div class="chart-type-selector">${types.map(([id,ic,lb])=>`<button data-ct="${chartKey}:${id}" class="${cur===id?'active':''}" title="${lb}">${ic}</button>`).join('')}</div>`; }
function sparkline(values, color){ if(!values.length) return ''; const W=160, H=38, P=4; const max = Math.max(...values, 1), min = Math.min(...values, 0); const range = (max - min) || 1; const step = (W - P*2) / Math.max(values.length-1, 1); const pts = values.map((v,i)=>{ const x = P + i*step; const y = H - P - ((v-min)/range) * (H - P*2); return [x,y]; }); const path = pts.map((p,i)=> (i?'L':'M') + p[0] + ' ' + p[1]).join(' '); const areaPath = path + ` L ${pts[pts.length-1][0]} ${H-P} L ${pts[0][0]} ${H-P} Z`; const id = 'sp' + Math.random().toString(36).slice(2,7); return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${areaPath}" fill="url(#${id})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function kpiCard(icon,label,value,color,delta,sparkData,progress){ const deltaHTML = delta!=null && !isNaN(delta) ? `<span class="kpi-delta ${delta>=0?'up':'down'}">${delta>=0?'▲':'▼'} ${Math.abs(delta)}%</span>` : ''; const sparkHTML = sparkData && sparkData.length ? `<div class="kpi-spark">${sparkline(sparkData, color)}</div>` : ''; let ringHTML = ''; if(progress!=null && !isNaN(progress)){ const p = Math.max(0, Math.min(100, progress)); const C = 2 * Math.PI * 22; const off = C * (1 - p/100); ringHTML = `<div class="kpi-ring-mini" title="${Math.round(p)}%"><svg viewBox="0 0 56 56"><circle class="bg" cx="28" cy="28" r="22"/><circle class="fg" cx="28" cy="28" r="22" stroke-dasharray="${C}" stroke-dashoffset="${off}" style="stroke:${color}"/></svg><div class="val">${Math.round(p)}%</div></div>`; } else { ringHTML = `<div style="width:56px;height:56px;flex:0 0 56px"></div>`; } return `<div class="kpi" style="--k:${color}"><div class="kpi-top"><div class="kpi-icon">${icon}</div><div class="kpi-body"><div class="kpi-label">${esc(label)}</div><div class="kpi-value">${value}</div></div>${ringHTML}</div>${(deltaHTML || sparkHTML) ? `<div class="kpi-foot">${deltaHTML}${sparkHTML}</div>` : ''}</div>`; }

function deltaChip(curr, prev, invert=false){ if(prev === null || prev === undefined || prev === '' || (num(prev)===0 && num(curr)===0)) return ''; if(num(prev) === 0){ return `<span class="delta-chip up">▲ 100%</span>`; } const d = Math.round(((num(curr)-num(prev))/num(prev))*100); if(!isFinite(d)) return ''; const positive = invert ? d <= 0 : d >= 0; const cls = positive ? 'up' : 'down'; const arrow = d >= 0 ? '▲' : '▼'; return `<span class="delta-chip ${cls}">${arrow} ${Math.abs(d)}%</span>`; }

function emptySelectHTML(msg, kind, addLabel){ return `<div class="select-add-wrap"><select disabled style="opacity:.7"><option>${esc(msg)}</option></select><button type="button" class="btn-add-inline" title="${esc(addLabel||'')}" onclick="(function(){ const f = {'sup':'supModal','car':'carModal','rep':'repModal','office':'officeModal'}[kind]; if(f && typeof window[f]==='function') window[f](); })()">+</button></div>`; }
function computeGradeMap(reports, reps){ const map = {A:[],B:[],C:[],D:[],E:[],F:[]}; reps.forEach(r=>{ const rs = reports.filter(x=>x.repId===r.id); if(!rs.length) return; const avgOrders = sum(rs,'orders') / rs.length; const g = computeRatingFromGrades(avgOrders, db.grades); if(map[g]) map[g].push({name:r.name, avg:round1(avgOrders), count:rs.length}); }); Object.keys(map).forEach(k=> map[k].sort((a,b)=>b.avg-a.avg)); return map; }
function driverGradesPanelHTML(reports, reps, showHint){ const gradeMap = computeGradeMap(reports, reps); const gradeDist = {}; Object.keys(gradeMap).forEach(k=> gradeDist[k] = gradeMap[k].length); return `${showHint ? `<div class="small muted" style="margin-bottom:10px">💡 ${t('driver_rating_hint')}</div>` : ''}<div class="grades-grid">${['A','B','C','D','E','F'].map(g=>{ const list = gradeMap[g]; return `<div class="grade-box" style="cursor:default"><div class="gb-letter ${g}">${g}</div><div style="font-size:22px;font-weight:800">${gradeDist[g]}</div><div class="gb-lbl">${t('nav_reps')}</div><div class="grade-names">${list.length ? list.map(x=>`<span title="${esc(x.name)} — ${x.avg} ${t('avg_per_driver')}">${esc(x.name)}</span>`).join('') : `<span class="none">—</span>`}</div></div>`; }).join('')}</div>`; }
function agg(list){ return { count:list.length, orders: sum(list,'orders'), hours: round1(sum(list,'hours')), violations: sum(list,'violations'), accepted: sum(list,'accepted'), rejected: sum(list,'rejected'), totalKm: sum(list,'totalKm') }; }

function applySettings(){ const s = db.settings; document.documentElement.style.setProperty('--primary', s.color); document.documentElement.style.setProperty('--primary-soft', hexToRgba(s.color,.08)); document.documentElement.style.setProperty('--primary-dark', shade(s.color,-18)); document.documentElement.style.setProperty('--primary-2', shade(s.color, 25)); document.documentElement.style.setProperty('--grad-brand', `linear-gradient(135deg,${s.color} 0%,${shade(s.color,22)} 55%,#06b6d4 100%)`); const fs = num(s.fontSize) || 15; document.documentElement.style.setProperty('--fs', fs + 'px'); document.body.style.fontSize = fs + 'px'; const scale = Math.max(0.75, Math.min(1.45, fs / 15)); document.body.style.zoom = scale !== 1 ? String(scale) : ''; const family = s.fontFamily || 'Tajawal'; document.body.style.fontFamily = `'${family}','Inter','Segoe UI',system-ui,sans-serif`; }
function applyBranding(){ const b = db.branding || {}; $('#brandTitle').textContent = b.title || 'تحليل أداء السائقين'; $('#brandSub').textContent = b.subtitle || 'نظام المتابعة والتقارير'; const sbLogo = $('#sidebarLogo'); if(sbLogo){ if(b.logo) sbLogo.innerHTML = `<img src="${b.logo}" alt="logo">`; else sbLogo.innerHTML = '📊'; } const lgLogo = $('#loginLogo'); if(lgLogo){ if(b.logo) lgLogo.innerHTML = `<img src="${b.logo}" alt="logo">`; else lgLogo.innerHTML = '📊'; } document.title = b.title || 'لوحة تحليل أداء السائقين'; $('#lgTitle').textContent = t('login_title'); $('#lgSub').textContent = b.title || t('login_sub'); updatePrintHeader(); }
function updatePrintHeader(){ const c = db.settings.company || {}; const nameEl = $('#printCompanyName'); if(!nameEl) return; nameEl.textContent = c.name || db.branding?.title || ''; const crEl = $('#printCR'); const phEl = $('#printPhone'); if(crEl) crEl.textContent = c.cr ? `${t('company_cr')}: ${c.cr}` : ''; if(phEl) phEl.textContent = c.phone ? `${t('company_phone')}: ${c.phone}` : ''; const dateEl = $('#printDate'); if(dateEl) dateEl.textContent = new Date().toLocaleDateString(state.lang==='ar'?'ar-SA':'en-US'); const logoEl = $('#printHeaderLogo'); if(logoEl){ if(db.branding?.logo){ logoEl.src = db.branding.logo; logoEl.style.display='block'; } else logoEl.style.display = 'none'; } }
function hexToRgba(hex,a){ const h = hex.replace('#',''); const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function shade(hex,p){ const h = hex.replace('#',''); const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h,16); let r=(n>>16)&255, g=(n>>8)&255, b=n&255; r = Math.max(0,Math.min(255, Math.round(r + 255*p/100))); g = Math.max(0,Math.min(255, Math.round(g + 255*p/100))); b = Math.max(0,Math.min(255, Math.round(b + 255*p/100))); return '#' + [r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function applyFont(){ if(!db || !db.settings) return; const f = db.settings.fontFamily || 'Tajawal'; document.body.style.fontFamily = `'${f}','Inter','Segoe UI',system-ui,sans-serif`; }
function updateThemeBtn(){ const b = $('#themeToggle'); if(!b) return; const dark = document.documentElement.getAttribute('data-theme') === 'dark'; b.innerHTML = dark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>'; b.style.background = dark ? 'linear-gradient(135deg,#f59e0b,#f97316)' : 'linear-gradient(135deg,#1e293b,#334155)'; b.style.color = '#fff'; }
function updateAutoSyncBtn(){ const btn = $('#autoSyncToggle'); if(!btn) return; if(!isOwner()){ btn.style.display = 'none'; return; } btn.style.display = 'grid'; const isAuto = db.settings.supervisorSyncMode === 'auto'; btn.innerHTML = isAuto ? '<i class="fa-solid fa-bolt" style="color:#f59e0b"></i>' : '<i class="fa-solid fa-hand"></i>'; btn.title = isAuto ? 'المزامنة التلقائية: مفعلة (اضغط للتعطيل)' : 'المزامنة التلقائية: معطلة (اضغط للتفعيل)'; btn.style.background = isAuto ? 'var(--amber-soft)' : ''; btn.style.color = isAuto ? 'var(--amber-ink)' : ''; btn.style.borderColor = isAuto ? '#fde68a' : ''; }

function renderNav(){ const allowed = allowedSections(); const items = NAV.filter(n=> allowed.includes(n.id)); const repsCount = visibleReps().length; $('#nav').innerHTML = items.map(n=>{ const count = n.id==='reps' ? repsCount : n.id==='supervisors' ? (isOwner()?db.supervisors.filter(s=>!s.deleted).length:1) : n.id==='cars' ? db.cars.filter(c=>!c.deleted).length : n.id==='internet' ? (db.internet||[]).filter(x=>!x.deleted).length : n.id==='settlement' ? (db.settlements||[]).filter(x=>!x.deleted).length : ''; return `<button class="nav-item ${state.section===n.id?'active':''}" data-go="${n.id}"><span class="ic"><i class="fa-solid ${n.icon}"></i></span><span>${t(n.key)}</span>${count!==''?`<span class="badge">${count}</span>`:''}</button>`; }).join(''); $$('.nav-item').forEach(b=> b.onclick = ()=>{ state.section = b.dataset.go; state.selectedCarId = null; closeSidebar(); render(); }); const u = state.user; if(u){ const initial = (u.name||'?').trim().charAt(0); $('#userBox').innerHTML = `<div class="ub-avatar">${esc(initial)}</div><div class="ub-info"><div class="ub-name">${esc(u.name)}</div><div class="ub-role">${u.role==='owner'?t('role_owner'):t('role_supervisor')}</div></div><button class="ub-out" id="ubLogout" title="${t('btn_logout')}"><i class="fa-solid fa-right-from-bracket"></i></button>`; $('#ubLogout').onclick = ()=> doLogout(); } $('#btnPerm').style.display = isOwner() ? '' : 'none'; }
function render(){ applyBranding(); document.documentElement.dir = state.lang==='ar' ? 'rtl' : 'ltr'; document.documentElement.lang = state.lang; renderNav(); const allowed = allowedSections(); if(!allowed.includes(state.section)) state.section = allowed[0] || 'dashboard'; const nav = NAV.find(n=>n.id===state.section); $('#pageTitle').textContent = nav ? t(nav.key) : ''; const view = $('#view'); const views = { dashboard: viewDashboard, daily: viewDaily, reps: viewReps, supervisors: viewSupervisors, cars: viewCars, analytics: viewAnalytics, goals: viewGoals, internet: viewInternet, settlement: viewSettlement, attendance: viewAttendance }; const afters = { dashboard: afterDashboard, daily: afterDaily, reps: afterReps, supervisors: afterSupervisors, cars: afterCars, analytics: afterAnalytics, goals: afterGoals, internet: afterInternet, settlement: afterSettlement, attendance: afterAttendance }; try{ view.innerHTML = views[state.section] ? views[state.section]() : '<div class="empty">—</div>'; } catch(e){ console.error('[render]', e); view.innerHTML = '<div class="empty">تعذّر تحميل الصفحة</div>'; } try{ afters[state.section] && afters[state.section](); }catch(e){ console.error('[after]', e); } applySettings(); attachCollapseButtons(); bindStickyScroll(); updateNotifBadge(); setCloudStatus(isCloudReady() ? 'on' : 'off'); addExportButtons(); rebindPrintOrientation(); rebindSyncMenu(); applyFont(); updateFsBtn(); updateAutoSyncBtn(); }
function attachCollapseButtons(){ $$('#view .card').forEach(card=>{ const head = card.querySelector('.card-head'); if(!head || head.querySelector('.card-collapse')) return; const btn = document.createElement('button'); btn.className = 'icon-btn card-collapse'; btn.type = 'button'; btn.title = card.classList.contains('collapsed') ? t('btn_expand') : t('btn_collapse'); btn.innerHTML = card.classList.contains('collapsed') ? '▸' : '▾'; btn.onclick = (e)=>{ e.stopPropagation(); card.classList.toggle('collapsed'); const collapsed = card.classList.contains('collapsed'); btn.innerHTML = collapsed ? '▸' : '▾'; btn.title = collapsed ? t('btn_expand') : t('btn_collapse'); }; head.appendChild(btn); }); }
function toggleAllCollapse(){ const cards = $$('#view .card'); const anyOpen = cards.some(c=> !c.classList.contains('collapsed')); cards.forEach(c=>{ c.classList.toggle('collapsed', anyOpen); const btn = c.querySelector('.card-collapse'); if(btn){ btn.innerHTML = anyOpen ? '▸' : '▾'; btn.title = anyOpen ? t('btn_expand') : t('btn_collapse'); } }); toast(anyOpen ? t('btn_collapse') : t('btn_expand'), 'ok'); }
function bindStickyScroll(){ document.querySelectorAll('.tbl-wrap').forEach(w => { if(w.dataset.stickyBound === '1') return; w.dataset.stickyBound = '1'; const h = () => { if(w.scrollTop > 2) w.classList.add('scrolled'); else w.classList.remove('scrolled'); }; w.addEventListener('scroll', h, { passive:true }); h(); }); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); }

function periodRange(refDate, period){ let start, end; if(period === 'daily'){ start = end = refDate; } else if(period === 'weekly'){ start = weekStartOf(refDate); end = addDaysStr(start, 6); } else { start = refDate.slice(0,7) + '-01'; end = monthEndOf(start); } return { start, end }; }
function prevPeriodRange(refDate, period){ if(period === 'daily'){ const p = addDaysStr(refDate, -1); return { start: p, end: p }; } if(period === 'weekly'){ const start = addDaysStr(weekStartOf(refDate), -7); return { start, end: addDaysStr(start, 6) }; } const pMonthDate = addDaysStr(refDate.slice(0,7) + '-01', -1); const start = pMonthDate.slice(0,7) + '-01'; return { start, end: monthEndOf(start) }; }
function periodLabelText(refDate, period){ if(period === 'daily') return dayName(refDate) + ' — ' + refDate; if(period === 'weekly'){ const s = weekStartOf(refDate); return `${s} → ${addDaysStr(s,6)}`; } return refDate.slice(0,7); }
function perfLabel(score){ if(score >= 80) return { txt: t('perf_excellent') }; if(score >= 60) return { txt: t('perf_good') }; if(score >= 40) return { txt: t('perf_fair') }; return { txt: t('perf_poor') }; }
function calcPerfScoreFromGoals(refDate, period){ const g = (db.goals && db.goals[period]) || {}; const { start, end } = periodRange(refDate, period); const rs = visibleReports().filter(r => r.date >= start && r.date <= end); const totalOrders = sum(rs,'orders'); const target = num(g.orders); if(target > 0) return Math.round((totalOrders / target) * 100); const reps = visibleReps().length || 1; const avgOrders = totalOrders / reps; return Math.round((avgOrders / 25) * 100); }
function dailyGradeForDate(dateStr, reportsList, repsList){ const rs = reportsList.filter(r=>r.date===dateStr); const orders = sum(rs,'orders'); const avg = rs.length ? round1(orders / rs.length) : 0; const grade = rs.length ? computeDailyGrade(avg) : null; const totalDrivers = repsList.length; return { date:dateStr, orders, avg, count:rs.length, totalDrivers, grade }; }
function dailyGradesComparisonHTML(mode, opts, reportsList, repsList){ mode = mode || 'single'; opts = opts || {}; const days = opts.days || 7; const rows = []; for(let i=0;i<days;i++){ const d = new Date(); d.setDate(d.getDate()-i); rows.push(dailyGradeForDate(d.toISOString().slice(0,10), reportsList, repsList)); } if(!rows.length) return `<div class="empty">${t('no_data')}</div>`; return `<div class="tbl-wrap" style="border:0"><table><thead><tr><th>${t('fld_date')}</th><th>${t('fld_day')}</th><th>${t('fld_delivered_orders')}</th><th>${t('avg_per_driver')}</th><th>${t('actual_drivers')}</th><th>${t('fld_rating')}</th></tr></thead><tbody>${rows.map(r=>{ const pct = r.totalDrivers ? Math.round((r.count/r.totalDrivers)*100) : 0; return `<tr><td><b>${esc(r.date)}</b></td><td class="muted small">${dayName(r.date)}</td><td><b>${r.orders}</b></td><td>${r.avg}</td><td><span class="chip ${r.count ? 'blue' : 'gray'}" title="${t('total_drivers')}: ${r.totalDrivers}">${r.count} / ${r.totalDrivers} (${pct}%)</span></td><td>${r.grade ? `<span class="chip grade ${r.grade}">${r.grade}</span>` : '<span class="chip gray">—</span>'}</td></tr>`; }).join('')}</tbody></table></div>`; }

function viewDashboard(){ const refDate = state.dashboardDate || todayStr(); const period = state.dashboardPeriod || 'daily'; const allReports = visibleReports(); const allReps = visibleReps(); const curRange = periodRange(refDate, period); const prevRange = prevPeriodRange(refDate, period); const tReports = allReports.filter(r=> r.date >= curRange.start && r.date <= curRange.end); const pReports = allReports.filter(r=> r.date >= prevRange.start && r.date <= prevRange.end); const ordersToday = sum(tReports,'orders'); const ordersPrev = sum(pReports,'orders'); const deltaOrders = ordersPrev ? Math.round(((ordersToday-ordersPrev)/ordersPrev)*100) : (ordersToday ? 100 : null); const hoursToday = round1(sum(tReports,'hours')); const hoursPrev = round1(sum(pReports,'hours')); const deltaHours = hoursPrev ? Math.round(((hoursToday-hoursPrev)/hoursPrev)*100) : (hoursToday ? 100 : null); const violToday = sum(tReports,'violations'); const violPrev = sum(pReports,'violations'); const deltaViol = violPrev ? Math.round(((violToday-violPrev)/violPrev)*100) : (violToday ? 100 : null); const last7Orders = [], last7Hours = [], last7Viol = [], last7Labels = []; for(let i=6;i>=0;i--){ const ds = addDaysStr(refDate, -i); const rs = allReports.filter(r=>r.date===ds); last7Orders.push(sum(rs,'orders')); last7Hours.push(round1(sum(rs,'hours'))); last7Viol.push(sum(rs,'violations')); last7Labels.push({label:dayName(ds), value:sum(rs,'orders')}); } const perfScore = calcPerfScoreFromGoals(refDate, period); const perfLbl = perfLabel(perfScore); const ringCircumference = 2 * Math.PI * 62; const ringPct = Math.min(100, perfScore); const ringOffset = ringCircumference * (1 - ringPct/100); const avgOrders = allReps.length ? round1(ordersToday/allReps.length) : 0; const avgHours = allReps.length ? round1(hoursToday/allReps.length) : 0; const totalViol = violToday; const totalAcc = sum(tReports,'accepted'); const accRate = totalViol ? Math.round((totalAcc/totalViol)*100) : 100; const dailyG = (db.goals && db.goals[period]) || {}; const periodLabel = period==='daily'?t('goals_period_today') : period==='weekly'?t('goals_period_week') : t('goals_period_month'); const ordersScore = dailyG.orders ? Math.min((ordersToday/dailyG.orders),1)*100 : Math.min((avgOrders/25),1)*100; const hoursScore = dailyG.hours ? Math.min((hoursToday/dailyG.hours),1)*100 : Math.min((avgHours/8),1)*100; const byRepToday = allReps.map(r=>({ label:r.name, value: sum(tReports.filter(x=>x.repId===r.id),'orders') })).sort((a,b)=>b.value-a.value); const bestRep = byRepToday[0]; const violDist = [{label:t('kpi_accepted'), value: sum(tReports,'accepted')}, {label:t('kpi_rejected'), value: sum(tReports,'rejected')}]; const ct = db.settings.chartTypes; const palette = ['#6366f1','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ef4444']; const isToday = refDate === todayStr() && period === 'daily'; const riskReps = allReps.map(r=>{ const rs = tReports.filter(x=>x.repId===r.id); return { name:r.name, orders:sum(rs,'orders'), viol:sum(rs,'violations') }; }).filter(r=> r.orders < avgOrders * 0.6 || r.viol > 3).slice(0,3); return `<div class="day-picker"><span class="dp-label">📅 ${t('dashboard_day')}</span><select id="dashPeriod" style="max-width:170px;padding:9px 12px"><option value="daily" ${period==='daily'?'selected':''}>📅 ${t('goals_period_today')}</option><option value="weekly" ${period==='weekly'?'selected':''}>📆 ${t('goals_period_week')}</option><option value="monthly" ${period==='monthly'?'selected':''}>🗓️ ${t('goals_period_month')}</option></select><input type="${period==='monthly'?'month':'date'}" id="dashDate" value="${period==='monthly'?refDate.slice(0,7):refDate}"><button class="btn btn-sm ${isToday?'btn-primary':''}" id="dashToday">${t('today')}</button><span class="dp-day-name">${periodLabelText(refDate, period)}</span>${!isToday ? deltaChip(ordersToday, ordersPrev) : ''}</div><div class="perf-hero"><div class="perf-ring"><svg viewBox="0 0 160 160"><defs><linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><circle class="pr-bg" cx="80" cy="80" r="62"/><circle class="pr-fg" cx="80" cy="80" r="62" stroke-dasharray="${ringCircumference}" stroke-dashoffset="${ringOffset}"/></svg><div class="pr-center"><div><div class="pr-num">${perfScore}%</div><div class="pr-lbl">${esc(perfLbl.txt)}</div></div></div></div><div class="perf-hero-info"><div class="ph-sub">📊 ${t('perf_score_sub')}${isSupervisor()?' · '+t('my_reps'):''} · ${periodLabelText(refDate, period)}</div><div class="ph-title">${t('perf_score')} — ${periodLabel}</div><div class="ph-desc">${t('perf_desc')}</div><div class="perf-subs"><div class="perf-sub po"><div class="perf-sub-head"><span>📦 ${t('kpi_orders')} — ${t('perf_avg_orders')}</span><b>${Math.round(ordersScore)}% · ${avgOrders}</b></div><div class="perf-sub-bar"><i style="width:${Math.max(0,Math.min(100,ordersScore))}%"></i></div></div><div class="perf-sub ph"><div class="perf-sub-head"><span>⏱️ ${t('kpi_hours')} — ${t('perf_avg_hours')}</span><b>${Math.round(hoursScore)}% · ${avgHours}h</b></div><div class="perf-sub-bar"><i style="width:${Math.max(0,Math.min(100,hoursScore))}%"></i></div></div></div><div class="perf-hero-stats"><div class="ph-stat"><div class="phs-v">${ordersToday}</div><div class="phs-l">${t('orders_achieved')}</div></div><div class="ph-stat"><div class="phs-v">${avgOrders}</div><div class="phs-l">${t('perf_avg_orders')}</div></div><div class="ph-stat"><div class="phs-v">${avgHours}h</div><div class="ph-l">${t('perf_avg_hours')}</div></div><div class="ph-stat"><div class="phs-v">${allReps.length}</div><div class="phs-l">${t('perf_total_reps')}</div></div></div></div></div><div class="grid g4">${kpiCard('📦', t('fld_delivered_orders'), ordersToday, '#6366f1', deltaOrders, last7Orders, null)}${kpiCard('⏱️', t('kpi_hours'), hoursToday, '#10b981', deltaHours, last7Hours, null)}${kpiCard('⚠️', t('kpi_violations'), violToday, '#f59e0b', deltaViol, last7Viol, null)}${kpiCard('✅', t('perf_accept_rate'), accRate + '%', '#06b6d4', null, null, accRate)}</div><div class="card"><div class="card-head">💡 ${t('perf_insights')} <span class="spacer"></span></div><div class="card-body grid g3" style="gap:14px"><div class="insight-tile tone-blue"><div class="it-label">🏆 ${t('insight_best_rep')}</div><div class="it-value">${bestRep ? esc(bestRep.label) : '—'}</div><div class="it-sub">${bestRep ? bestRep.value + ' ' + t('fld_delivered_orders') : ''}</div></div><div class="insight-tile tone-green"><div class="it-label">📈 ${t('insight_growth')}</div><div class="it-value" style="color:${deltaOrders>=0?'#047857':'#b91c1c'}">${deltaOrders!=null ? (deltaOrders>=0?'+':'') + deltaOrders + '%' : '—'}</div><div class="it-sub">${ordersToday} / ${ordersPrev}</div></div><div class="insight-tile tone-amber"><div class="it-label">⚠️ ${t('insight_risk')}</div><div class="it-value" style="font-size:15px;line-height:1.3">${riskReps.length ? riskReps.map(r=>esc(r.name)).join(' · ') : '— لا يوجد —'}</div><div class="it-sub">${riskReps.length} ${t('nav_reps')}</div></div></div></div><div class="card"><div class="card-head">⭐ ${t('driver_rating_title')}<span class="chip violet">${periodLabelText(refDate, period)}</span><span class="spacer"></span><span class="small muted">${tReports.length} ${t('t_daily')}</span></div><div class="card-body">${driverGradesPanelHTML(tReports, allReps, true)}</div></div><div class="card"><div class="card-head">⚠️ ${t('t_viol')}<span class="spacer"></span><span class="chip amber">${periodLabel}</span>${chartTypeSelector('viol')}</div><div class="card-body">${renderChart(ct.viol || 'donut', violDist, '#ef4444', ['#10b981','#ef4444'])}</div></div><div class="card"><div class="card-head">📈 ${t('perf_weekly')} <span class="spacer"></span><span class="chip violet">${t('fld_delivered_orders')}</span>${chartTypeSelector('trend')}</div><div class="card-body">${renderChart(ct.trend || 'line', last7Labels, db.settings.color, palette)}</div></div><div class="card"><div class="card-head">📅 ${t('daily_grades_table')} <span class="spacer"></span><span class="chip gray">A–D</span></div>${dailyGradesComparisonHTML('single', {days:7}, tReports, allReps)}</div>`; }

function renderDailyAttendance(){ const date = state.attendanceDate || todayStr(); const reps = visibleReps(); const map = {}; db.attendance.filter(a=>a.date===date).forEach(a=> map[a.repId]=a); const c = { present:0, late:0, absent:0, leave:0, rest:0, none:0 }; reps.forEach(r=>{ const rec = map[r.id]; if(!rec || !rec.status) c.none++; else if(c[rec.status] !== undefined) c[rec.status]++; }); const rows = reps.map(r=>{ const rec = map[r.id] || { status:'', note:'' }; const s = rec.status || ''; const btns = ATT_STATUSES.map(st=>{ const active = s === st.id; const style = active ? `background:${st.color};color:#fff;border-color:transparent;font-weight:700` : 'background:transparent;color:var(--text-2)'; return `<button type="button" data-att-status="${st.id}" data-att-id="${r.id}" class="btn btn-sm" style="${style}"><i class="fa-solid fa-${st.icon}"></i> ${t(st.label)}</button>`; }).join(''); return `<tr><td><div style="display:flex;align-items:center;gap:10px"><div style="width:34px;height:34px;border-radius:50%;background:var(--grad-brand);color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 34px">${esc((r.name||'?')[0]||'?')}</div><div><b>${esc(r.name||'')}</b><div class="small muted">${esc(r.code||'')} · ${esc(r.region||'')}</div></div></div></td><td class="muted small">${esc(supName(r.supervisorId))}</td><td><div class="row" style="gap:6px;justify-content:center;flex-wrap:wrap">${btns}</div></td><td><input type="text" data-att-note="${r.id}" value="${esc(rec.note||'')}" placeholder="${t('att_note')}"></td></tr>`; }).join(''); return `<div class="day-picker"><span class="dp-label"><i class="fa-solid fa-calendar-day"></i> ${t('fld_date')}</span><input type="date" id="attDate" value="${date}"><button class="btn btn-sm btn-primary" id="attToday">${t('today')}</button><span class="dp-day-name">${dayName(date)} — ${date}</span></div><div class="attendance-kpi-grid">${kpiCard('<i class="fa-solid fa-users"></i>', t('perf_total_reps'), reps.length, '#6366f
