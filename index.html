  const allRows = (db.settlements || []).slice().sort((a,b)=>
    (b.regTime || '').localeCompare(a.regTime || '')
  );

  const uniqAppIds = Array.from(new Set(allRows.map(x=> x.appId).filter(Boolean))).sort();
  const uniqResp   = Array.from(new Set(allRows.map(x=> x.responsible).filter(Boolean))).sort();
  const uniqApps   = Array.from(new Set(allRows.map(x=> x.app).filter(Boolean))).sort();

  let rows = allRows;
  if(sf.type === 'appId' && sf.value){
    rows = rows.filter(x=> (x.appId || '') === sf.value);
  } else if(sf.type === 'responsible' && sf.value){
    rows = rows.filter(x=> (x.responsible || '') === sf.value);
  } else if(sf.type === 'app' && sf.value){
    rows = rows.filter(x=> (x.app || '') === sf.value);

  return '<div class="card">' +

      (canEdit ? '<button class="btn btn-primary btn-sm" id="addSettlement">➕ ' + t('set_add') + '</button>' : '') +
    '</div>' +

function afterSettlement(){
  const canEdit = isOwner() || canEditSection('settlement');
  document.getElementById('printSettlement')?.addEventListener('click', function(){ window.print(); });

  const typeSel = document.getElementById('setFilterType');
  if(typeSel){
    typeSel.addEventListener('change', function(e){
      state.settlementFilter = { type:e.target.value, value:'', from:'', to:'' };
      render();
    });
  }
  const valEl = document.getElementById('setFilterValue');
  if(valEl){
    valEl.addEventListener('change', function(e){
      state.settlementFilter.value = e.target.value;
      render();
    });
    if(valEl.type === 'month'){
      valEl.addEventListener('input', function(e){
        state.settlementFilter.value = e.target.value;
        render();
      });
    }
  }
  const fromEl = document.getElementById('setFilterFrom');
  if(fromEl){
    fromEl.addEventListener('change', function(e){
      state.settlementFilter.from = e.target.value;
      render();
    });
  }
  const toEl = document.getElementById('setFilterTo');
  if(toEl){
    toEl.addEventListener('change', function(e){
      state.settlementFilter.to = e.target.value;
      render();
    });
  }
  const clearBtn = document.getElementById('setFilterClear');
  if(clearBtn){
    clearBtn.onclick = function(){
      state.settlementFilter = { type:'all', value:'', from:'', to:'' };
      render();
    };
  }

  if(canEdit){
    document.getElementById('addSettlement')?.addEventListener('click', function(){ settlementModal(); });
    document.querySelectorAll('[data-edit-set]').forEach(function(b){
      b.onclick = function(){ settlementModal(b.dataset.editSet); };
    });
    document.querySelectorAll('[data-del-set]').forEach(function(b){
      b.onclick = function(){
        if(!confirm(t('msg_confirm_del'))) return;
        db.settlements = (db.settlements || []).filter(function(x){ return x.id !== b.dataset.delSet; });
        saveDB(); render(); toast(t('msg_deleted'),'ok');
        autoSyncAfterSave();
      };
    });
  }
}
function settlementModal(id){
  if(!isOwner() && !canEditSection('settlement')){ toast(t('msg_no_perm'),'warn'); return; }
  const rec = id ? (db.settlements || []).find(x => x.id === id) : null;
  const appsList  = getAppsList();
  const banksList = getBanksList();

  const body = '<form id="setForm" class="form-grid" novalidate>' +
    '<div class="field"><label>App ID</label>' +
      '<input name="appId" dir="ltr" value="' + esc(rec && rec.appId || '') + '" placeholder="App ID"></div>' +
    '<div class="field"><label>' + t('fld_responsible') + ' <span class="req">*</span></label>' +
      '<input name="responsible" required value="' + esc(rec && rec.responsible || '') + '"></div>' +
    '<div class="field"><label>' + t('fld_app') + ' <span class="req">*</span></label>' +
      '<select name="app" required>' +
        '<option value="">' + t('fld_none') + '</option>' +
        appsList.map(v=>'<option value="' + esc(v) + '" ' + (rec && rec.app === v ? 'selected' : '') + '>' + esc(v) + '</option>').join('') +
      '</select></div>' +
    '<div class="field"><label>' + t('fld_from') + ' <span class="req">*</span></label>' +
      '<input type="date" name="from" required value="' + (rec ? rec.from : todayStr()) + '" id="setFrom"></div>' +
    '<div class="field"><label>' + t('fld_to') + ' <span class="req">*</span></label>' +
      '<input type="date" name="to" required value="' + (rec ? rec.to : todayStr()) + '" id="setTo"></div>' +
    '<div class="field"><label>' + t('fld_rental_days') + ' <span class="small muted">(' + t('fld_auto_total') + ')</span></label>' +
      '<input type="number" name="days" readonly id="setDays" value="' + (rec ? rec.days : 0) + '"></div>' +
    '<div class="field"><label>' + t('fld_settlement_amount') + ' <span class="req">*</span></label>' +
      '<input type="number" name="amount" min="0" step="0.01" required value="' + (rec ? rec.amount : '') + '"></div>' +
    '<div class="field"><label>' + t('fld_total_rent') + '</label>' +
      '<input type="number" name="totalRent" min="0" step="0.01" value="' +
        (rec && rec.totalRent != null && rec.totalRent !== '' ? rec.totalRent : '') + '" placeholder="0"></div>' +
    '<div class="field" style="grid-column:1/-1">' +
      '<label>' + t('fld_bank_account') + ' <span class="req">*</span></label>' +
      '<input name="bank" required list="banksDatalist" value="' + esc(rec && rec.bank || '') + '" placeholder="' + t('msg_bank_text_hint') + '">' +
      '<datalist id="banksDatalist">' +
        banksList.map(v=>'<option value="' + esc(v) + '"></option>').join('') +
      '</datalist>' +
      '<span class="hint">' + t('msg_bank_text_hint') + '</span>' +
    '</div>' +
    '<div class="field"><label>' + t('fld_reg_time') + '</label>' +
      '<input type="text" readonly value="' + (rec ? formatDateTime(rec.regTime) : formatDateTime(new Date().toISOString())) + '"></div>' +
    '<div id="setErr" class="err" style="grid-column:1/-1;display:none"></div>' +
  '</form>';

  openModal({
    title: rec ? t('btn_edit') : t('set_add'),
    body: body, tableId: 'settlements', record: rec,
    onMount: function(root){
      var f  = root.querySelector('#setFrom');
      var t2 = root.querySelector('#setTo');
      var d  = root.querySelector('#setDays');
      var upd = function(){
        if(f.value && t2.value){
          var days = Math.max(0, Math.floor((new Date(t2.value) - new Date(f.value)) / 86400000) + 1);
          d.value = days;
        }
      };
      f.addEventListener('change', upd);
      t2.addEventListener('change', upd);
      upd();
    },
    onSubmit: function(root){
      var d   = Object.fromEntries(new FormData($('#setForm', root)));
      var err = $('#setErr', root);
      if(['responsible','app','from','to','amount','bank'].some(function(k){ return !d[k]; })){
        err.textContent = t('msg_required');
        err.style.display = 'block';
        return false;
      }
      var days = Math.max(0, Math.floor((new Date(d.to) - new Date(d.from)) / 86400000) + 1);
      var payload = {
        appId: d.appId || '',
        responsible: d.responsible,
        app: d.app,
        from: d.from,
        to: d.to,
        days: days,
        amount: num(d.amount),
        totalRent: num(d.totalRent),
        bank: d.bank,
        custom: readCustomValues(root),
        updatedAt: new Date().toISOString()
      };
      if(rec){
        Object.assign(rec, payload);
        toast(t('msg_settlement_saved'),'ok');
      } else {
        db.settlements = db.settlements || [];
        db.settlements.push(Object.assign({ id: uid() }, payload, { regTime: new Date().toISOString() }));
        toast(t('msg_settlement_added'),'ok');
      }
      saveDB(); render();
      autoSyncAfterSave();
      return true;
    }
  });
}
/* ==========================================================================
   18) مقارنة درجات الأيام (daily grades)
   ========================================================================== */
function renderCompareRows(rows, l1, l2){
  const cell = (v, isGrade)=>{
    if(isGrade){
      if(!v || v === '—') return '<span class="chip gray">—</span>';
      return `<span class="chip grade ${v}">${v}</span>`;
    }
    return `<b>${esc(String(v ?? '—'))}</b>`;
  };
  return `<div class="tbl-wrap" style="border:0"><table><thead><tr>
    <th style="text-align:start">${t('filter_type')}</th>
    <th style="text-align:center">${esc(l1)}</th>
    <th style="text-align:center">${esc(l2)}</th>
  </tr></thead><tbody>
    ${rows.map(r=>`<tr>
      <td class="muted small"><b>${r.label}</b></td>
      <td style="text-align:center">${cell(r.v1, r.isGrade)}</td>
      <td style="text-align:center">${cell(r.v2, r.isGrade)}</td>
    </tr>`).join('')}
  </tbody></table></div>`;
}
function dailyGradesComparisonHTML(mode, opts){
  mode = mode || 'single';
  opts = opts || {};
  if(mode === 'range_days'){
    const r1 = state.dailyGradesR1 || addDaysStr(todayStr(), -6);
    const r2 = state.dailyGradesR2 || todayStr();
    const a = aggregateRange(r1, r2);
    const label = `${a.from} → ${a.to}`;
    return `<div class="tbl-wrap" style="border:0"><table><thead><tr>
      <th>${t('filter_period')}</th>
      <th>${t('fld_delivered_orders')}</th>
      <th>${t('avg_per_driver')}</th>
      <th>${t('perf_total_reps')}</th>
      <th>${t('fld_rating')}</th>
    </tr></thead><tbody><tr>
      <td><b>${esc(label)}</b><div class="small muted">${a.days} ${t('msg_day_short')} · ${a.reportsCount} ${t('t_daily')}</div></td>
      <td><b>${a.totalOrders}</b></td>
      <td><b>${a.avgPerDriver}</b></td>
      <td>${a.totalDrivers}</td>
      <td>${a.grade ? `<span class="chip grade ${a.grade}">${a.grade}</span>` : '<span class="chip gray">—</span>'}</td>
    </tr></tbody></table></div>`;
  }
  if(mode === 'compare_days'){
    const d1 = state.dailyGradesD1 || todayStr();
    const d2 = state.dailyGradesD2 || addDaysStr(todayStr(), -1);
    const r1 = dailyGradeForDate(d1);
    const r2 = dailyGradeForDate(d2);
    const rows = [
      { label: t('fld_date'),          v1: r1.date, v2: r2.date },
      { label: t('fld_day'),           v1: dayName(r1.date), v2: dayName(r2.date) },
      { label: t('fld_delivered_orders'), v1: r1.orders, v2: r2.orders },
      { label: t('avg_per_driver'),    v1: r1.avg, v2: r2.avg },
      { label: t('actual_drivers'),    v1: `${r1.count} / ${r1.totalDrivers}`, v2: `${r2.count} / ${r2.totalDrivers}` },
      { label: t('fld_rating'),        v1: r1.grade || '—', v2: r2.grade || '—', isGrade: true }
    ];
    return renderCompareRows(rows, d1, d2);
  }
  if(mode === 'compare_weeks'){
    const today = todayStr();
    const w1 = state.dailyGradesW1 || weekStartOf(today);
    const w2 = state.dailyGradesW2 || addDaysStr(weekStartOf(today), -7);
    const a1 = aggregateWeek(w1);
    const a2 = aggregateWeek(w2);
    const rows = [
      { label: t('filter_period'), v1: `${w1} → ${addDaysStr(w1,6)}`, v2: `${w2} → ${addDaysStr(w2,6)}` },
      { label: t('total') + ' · ' + t('fld_delivered_orders'), v1: a1.totalOrders, v2: a2.totalOrders },
      { label: t('avg_per_driver') + ' / ' + t('fld_day'), v1: a1.avgPerDriver, v2: a2.avgPerDriver },
      { label: t('perf_total_reps'), v1: a1.totalDrivers, v2: a2.totalDrivers },
      { label: t('fld_rating'), v1: a1.grade || '—', v2: a2.grade || '—', isGrade: true }
    ];
    return renderCompareRows(rows, w1, w2);
  }
  const days = opts.days || 7;
  const rows = [];
  for(let i=0;i<days;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    rows.push(dailyGradeForDate(d.toISOString().slice(0,10)));
  }
  if(!rows.length) return `<div class="empty">${t('no_data')}</div>`;
  return `<div class="tbl-wrap" style="border:0"><table><thead><tr>
    <th>${t('fld_date')}</th><th>${t('fld_day')}</th>
    <th>${t('fld_delivered_orders')}</th><th>${t('avg_per_driver')}</th>
    <th>${t('actual_drivers')}</th>
    <th>${t('fld_rating')}</th>
  </tr></thead><tbody>
    ${rows.map(r=>{
      const pct = r.totalDrivers ? Math.round((r.count/r.totalDrivers)*100) : 0;
      return `<tr>
        <td><b>${esc(r.date)}</b></td>
        <td class="muted small">${dayName(r.date)}</td>
        <td><b>${r.orders}</b></td>
        <td>${r.avg}</td>
        <td>
          <span class="chip ${r.count ? 'blue' : 'gray'}" title="${t('total_drivers')}: ${r.totalDrivers}">
            ${r.count} / ${r.totalDrivers} (${pct}%)
          </span>
        </td>
        <td>${r.grade ? `<span class="chip grade ${r.grade}">${r.grade}</span>` : '<span class="chip gray">—</span>'}</td>
      </tr>`;
    }).join('')}
  </tbody></table></div>`;
}

/* ==========================================================================
   19) أدوات عامة
   ========================================================================== */
function toolAction(act){
  switch(act){
    case 'lang':
      state.lang = state.lang==='ar' ? 'en' : 'ar';
      render(); toast(state.lang==='ar'?'تم التبديل إلى العربية':'Switched to English','ok');
      break;
    case 'sync':
      if(!isCloudReady()){ settingsModal(); return; }
      fullSync().then(ok => { if(ok) render(); });
      break;
    case 'share': copyShareLink(); break;
    case 'print': window.print(); break;
    case 'export': exportJSON(); break;
    case 'import':
      if(!canEditSection('daily')){ toast(t('msg_no_perm'),'warn'); return; }
      openImportDialog(); break;
    case 'reset':
      if(!isOwner()){ toast(t('msg_no_perm'),'warn'); return; }
      if(confirm(t('msg_confirm_reset'))){
        db = seedDB(); saveDB(); state.section='dashboard'; render();
        toast(t('msg_reset'),'ok');
        autoSyncAfterSave();
      } break;
    case 'refresh':
      if(isCloudReady()){ fullSync().then(ok => { if(ok) render(); }); }
      else { db = loadDB() || db; applySettings(); render(); toast(t('msg_updated'),'ok'); }
      break;
    case 'settings': settingsModal(); break;
  }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `drivers-performance-${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast(t('btn_export')+' ✓','ok');
}
function openImportDialog(){
  if(!canEditSection('daily')){ toast(t('msg_no_perm'),'warn'); return; }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const data = JSON.parse(rd.result);
        db = normalizeDB(data);
        cleanupRelations(); saveDB(); render();
        toast(t('msg_imported'),'ok');
        autoSyncAfterSave();
      }catch(err){ toast(t('msg_import_err'),'err'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

            tr.style.opacity = '0.5';
          };
          tr.ondragend = ()=>{ tr.style.opacity = ''; state._dragSrc = null; };
          tr.ondragover = e=>{ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };

            e.preventDefault();
            const dragSrc = state._dragSrc;
            if(!dragSrc || dragSrc === tr) return;
            if(!isCustomTr(tr)) return;
            const rect = tr.getBoundingClientRect();
            const after = (e.clientY - rect.top) > rect.height / 2;
            bodyEl.insertBefore(dragSrc, after ? tr.nextSibling : tr);
            bodyEl.querySelectorAll('tr').forEach(x=> x.classList.remove('drop-target'));
            tr.classList.add('drop-target');
            setTimeout(()=> tr.classList.remove('drop-target'), 600);
          };
        });

        const tr = document.createElement('tr');
        tr.dataset.colCustom = '1';
        tr.dataset.colId = id;
        tr.dataset.colKey = id;
        tr.draggable = true;
        tr.innerHTML = `<td style="padding-inline-start:10px">

              <button type="button" class="btn btn-ghost btn-sm" data-col-edit style="color:var(--primary)" title="${t('btn_edit')}">✏️</button>
              <button type="button" class="btn btn-ghost btn-sm" data-col-del style="color:var(--red)" title="${t('btn_delete_col')}">🗑️</button>
            </div>
          </td>`;
        bodyEl.appendChild(tr);
        bindDel(); bindEdit(); bindMove(); bindDrag();
        updateCount();
        const inp = tr.querySelector('input');
        if(inp){ inp.classList.add('editing'); inp.focus(); }
      };
      root.querySelector('#tmAdd')?.addEventListener('click', ()=> addRow());
      bindDel(); bindEdit(); bindMove(); bindDrag();
      updateCount();
    },
    onSubmit(root){
      const fullOrder = [];
      root.querySelectorAll('#tmBody tr').forEach(tr=>{
        if(tr.dataset.colCustom === '1'){
          const label = (tr.querySelector('[data-col-label]')?.value || '').trim();
          if(!label) return;
          fullOrder.push({ type:'custom', id: tr.dataset.colId, label });
        } else if(tr.dataset.colLocked === '1'){
          fullOrder.push({ type:'builtin', key: tr.dataset.colKey });
        }
      });
      db.settings.customColumns = db.settings.customColumns || {};
      db.settings.customColumns[current] = fullOrder
        .filter(x=> x.type==='custom')
        .map(x=>({ id:x.id, label:x.label }));
      setColumnOrder(current, fullOrder.map(x=> x.type==='custom' ? x.id : x.key));
      saveDB(); render();
      toast(t('col_saved'), 'ok');
      autoSyncAfterSave();
      return true;
    }
  });
}

              data-sup="${s.id}" data-sec="${sec.id}" data-branch="${b.id}" data-kind="edit" ${bHasE?'checked':''}></td>
        </tr>`);
      });
    });
    return `<div class="perm-card" data-perm-card="${s.id}">
      <div class="perm-card-head">
        <div class="ic-avatar" style="width:34px;height:34px;font-size:14px">${esc((s.name||'?').charAt(0))}</div>

        </div>
        <button type="button" class="perm-toggle" data-perm-toggle="${s.id}"
                title="${t('credentials_show')}/${t('credentials_hide')}">👁️</button>
      </div>
      <div class="perm-table-wrap" data-perm-body="${s.id}">
        <table class="perm-table">
          <thead><tr>
            <th>${t('fld_sections')} / ${t('perm_branches')}</th>
            <th>👁️ ${t('perm_view_col')}</th>
            <th>✏️ ${t('perm_edit_col')}</th>
          </tr></thead>

        </table>
      </div>
    </div>`;
  };
  const body = `
    <div class="small muted" style="margin-bottom:14px;line-height:1.7">${t('perm_intro')}</div>
    <div class="row" style="margin-bottom:12px;justify-content:flex-end">
      <button type="button" class="btn btn-sm" id="permToggleAll">👁️ ${t('credentials_show')} / ${t('credentials_hide')} — ${t('fld_all')}</button>
    </div>
    <div class="perm-list">
      ${db.supervisors.length ? db.supervisors.map(renderSupCard).join('') : `<div class="empty">${t('no_data')}</div>`}
    </div>
    <div class="small muted" style="margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--border)">
      ${t('perm_owner_note')}
    </div>`;
  openModal({
    title:`🛡️ ${t('btn_permissions')}`,
    body, wide:true, submitText:t('btn_save'),
    onMount(root){

        const card = root.querySelector(`[data-perm-card="${id}"]`);
        if(!card) return;
        const collapsed = card.classList.toggle('collapsed');
        if(btn) btn.textContent = collapsed ? '🙈' : '👁️';
      };
      root.querySelectorAll('[data-perm-toggle]').forEach(btn=>{
        btn.onclick = ()=> toggleBody(btn.dataset.permToggle, btn);
      });
      const toggleAllBtn = root.querySelector('#permToggleAll');
      if(toggleAllBtn){
        toggleAllBtn.onclick = ()=>{
          const cards = root.querySelectorAll('[data-perm-card]');
          const anyOpen = [...cards].some(c=> !c.classList.contains('collapsed'));
          cards.forEach(card=>{
            const id = card.dataset.permCard;
            const btn = root.querySelector(`[data-perm-toggle="${id}"]`);
            if(anyOpen){ card.classList.add('collapsed'); if(btn) btn.textContent = '🙈'; }
            else { card.classList.remove('collapsed'); if(btn) btn.textContent = '👁️'; }
          });
        };
      }
      const get = (supId, secId, branchId, kind)=>{
        const sel = branchId
          ? `input[data-sup="${supId}"][data-sec="${secId}"][data-branch="${branchId}"][data-kind="${kind}"]`
          : `input[data-sup="${supId}"][data-sec="${secId}"][data-kind="${kind}"]:not([data-branch])`;
        return root.querySelector(sel);
      };
      const setChk = (el,v)=>{ if(el) el.checked = v; };
      const syncFromSection = (supId, secId)=>{
        const v = get(supId, secId, '', 'view');
        const e = get(supId, secId, '', 'edit');
        const sec = PERM_TREE.find(x=>x.id===secId);
        const branches = sec?.branches || [];
        if(v && !v.checked){
          setChk(e,false);
          branches.forEach(b=>{
            setChk(get(supId,secId,b.id,'view'),false);
            setChk(get(supId,secId,b.id,'edit'),false);
          });
        }
        if(v && v.checked){ branches.forEach(b=> setChk(get(supId,secId,b.id,'view'),true)); }
        if(e && e.checked){
          setChk(v,true);
          branches.forEach(b=>{
            setChk(get(supId,secId,b.id,'view'),true);
            setChk(get(supId,secId,b.id,'edit'),true);
          });
        }
      };
      const syncFromBranch = (supId, secId, branchId)=>{
        const bv = get(supId,secId,branchId,'view');
        const be = get(supId,secId,branchId,'edit');
        if(be && be.checked) setChk(bv,true);
        if(bv && !bv.checked) setChk(be,false);
        if((bv && bv.checked) || (be && be.checked)){ setChk(get(supId,secId,'','view'), true); }
        const sec = PERM_TREE.find(x=>x.id===secId);
        if(sec && sec.branches.length){
          const anyV = sec.branches.some(b=>{ const el = get(supId,secId,b.id,'view'); return el && el.checked; });
          const anyE = sec.branches.some(b=>{ const el = get(supId,secId,b.id,'edit'); return el && el.checked; });
          if(!anyV && !anyE){
            setChk(get(supId,secId,'','view'),false);
            setChk(get(supId,secId,'','edit'),false);
          }
        }
      };
      root.addEventListener('change', e=>{
        const cb = e.target;
        if(!cb.matches('input[type=checkbox][data-kind]')) return;
        const supId = cb.dataset.sup, secId = cb.dataset.sec;
        const branchId = cb.dataset.branch || '';
        if(branchId) syncFromBranch(supId, secId, branchId);
        else syncFromSection(supId, secId);
      });
    },
    onSubmit(root){
      db.supervisors.forEach(s=>{
        const perms = [];
        root.querySelectorAll(`input[data-kind="view"][data-sup="${s.id}"]`).forEach(cb=>{
          if(!cb.checked) return;
          const secId = cb.dataset.sec, branchId = cb.dataset.branch || '';
          perms.push(branchId ? `${secId}.${branchId}` : secId);
        });
        root.querySelectorAll(`input[data-kind="edit"][data-sup="${s.id}"]`).forEach(cb=>{
          if(!cb.checked) return;
          const secId = cb.dataset.sec, branchId = cb.dataset.branch || '';
          perms.push(branchId ? `${secId}.${branchId}_edit` : `${secId}_edit`);
        });
        s.permissions = perms;
      });
      saveDB(); render();
      toast(t('msg_updated'),'ok');
      autoSyncAfterSave();
      return true;
    }
  });
}

function pwdModal(){
  if(!state.user) return;
  const isOwnerUser = isOwner();
  const body = `
    <form id="pwdForm" class="form-grid" novalidate>
      <div class="field" style="grid-column:1/-1"><label>${t('pwd_current')} <span class="req">*</span></label>
        <input type="password" name="currentPwd" required autocomplete="current-password"></div>
      <div class="field"><label>${t('pwd_new')} <span class="req">*</span></label>
        <input type="password" name="newPwd" required autocomplete="new-password"></div>
      <div class="field"><label>${t('pwd_confirm')} <span class="req">*</span></label>
        <input type="password" name="confirmPwd" required autocomplete="new-password"></div>
      ${isOwnerUser?`<div class="small muted" style="grid-column:1/-1;padding:10px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--border)">${t('pwd_owner_note')}</div>`:''}
      <div id="pErr" class="err" style="grid-column:1/-1;display:none"></div>
    </form>`;
  openModal({
    title:`🔑 ${t('pwd_section')}`, body, submitText:t('pwd_save'),
    onSubmit(root){
      const d = Object.fromEntries(new FormData($('#pwdForm', root)));
      const err = $('#pErr', root);
      if(!d.currentPwd || !d.newPwd || !d.confirmPwd){
        err.textContent = t('msg_required'); err.style.display='block'; return false;
      }
      const curHash = hashPwd(d.currentPwd);
      let stored = null;
      if(isOwnerUser) stored = db.auth?.owner?.password;
      else { const sup = db.supervisors.find(s=>s.id===state.user.id); stored = sup?.password; }
      if(stored !== curHash){ err.textContent = t('msg_pwd_wrong'); err.style.display='block'; return false; }
      if(d.newPwd.length < 4){ err.textContent = t('msg_pwd_short'); err.style.display='block'; return false; }
      if(d.newPwd !== d.confirmPwd){ err.textContent = t('msg_pwd_mismatch'); err.style.display='block'; return false; }
      const newHash = hashPwd(d.newPwd);
      if(isOwnerUser) db.auth.owner.password = newHash;
      else { const sup = db.supervisors.find(s=>s.id===state.user.id); if(sup) sup.password = newHash; }
      saveDB();
      toast(t('msg_pwd_changed'),'ok');
      autoSyncAfterSave();
      return true;
    }
  });
}

/* ==========================================================================
   23) نظام النوافذ (openModal)
   ========================================================================== */
function openModal({title, body, onSubmit, onMount, submitText, wide, tableId, record}){
  const root = $('#modalRoot');
  root.innerHTML = `
    <div class="overlay" id="ovl">
      <div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3>${title}</h3>
          <button class="icon-btn" id="mClose">✕</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">
          <button class="btn" id="mCancel">${t('btn_cancel')}</button>
          <button class="btn btn-primary" id="mSave">${submitText || t('btn_save')}</button>
        </div>
      </div>
    </div>`;
  const close = ()=>{
    root.innerHTML = '';
    if(state.pendingReopen){
      const fn = state.pendingReopen;
      state.pendingReopen = null;
      setTimeout(fn, 200);
    }
  };
  $('#mClose').onclick = close;
  $('#mCancel').onclick = close;
  $('#ovl').onclick = e=>{ if(e.target.id==='ovl') close(); };
  $('#mSave').onclick = ()=>{
    const form = root.querySelector('form');
    if(form && !form.checkValidity()){
      form.querySelectorAll(':invalid')[0]?.focus();
      const err = root.querySelector('.err');
      if(err){ err.textContent = t('msg_required'); err.style.display='block'; }
      return;
    }
    if(onSubmit && onSubmit(root) === false) return;
    close();
  };
  document.addEventListener('keydown', function esc2(e){
    if(e.key==='Escape'){ close(); document.removeEventListener('keydown', esc2); }
  });
  if(tableId){
    const form = root.querySelector('form');
    if(form){
      const html = customFormFieldsHTML(tableId, record);
      if(html){
        const errEl = form.querySelector('.err');
        const grid   = form.querySelector('.form-grid');
        if(errEl)      errEl.insertAdjacentHTML('beforebegin', html);
        else if(grid)  grid.insertAdjacentHTML('beforeend', html);
        else           form.insertAdjacentHTML('beforeend', `<div class="form-grid">${html}</div>`);
      }
    }
  }
  if(onMount) onMount(root);
  root.querySelector('input,select,textarea')?.focus();
}

/* ==========================================================================
   23.b) Sidebar + Fullscreen
   ========================================================================== */
function closeSidebar(){ $('#sidebar').classList.remove('open'); }
function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function updateFsBtn(){
  const b = $('#fsBtn');
  if(!b) return;
  b.textContent = isFullscreen() ? '🗗' : '⛶';
  b.title = isFullscreen() ? t('msg_fs_exit') : t('msg_fs_enter');
}
function toggleFullscreen(silent){
  const el = document.documentElement;
  if(!isFullscreen()){
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(!req){ if(!silent) toast(t('msg_fs_unsupported'),'warn'); return; }
    try{
      const p = req.call(el);
      if(p && p.catch) p.catch(()=>{ if(!silent) toast(t('msg_fs_failed'),'warn'); });
    }catch(e){ if(!silent) toast(t('msg_fs_failed'),'warn'); }
  } else {
    const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(ex){ try{ ex.call(document); }catch(e){} }
  }
}

async function init(){
  cloudCfg = loadCloudCfg();
  const fromURL = await readFromURLParams();
  if(fromURL && isCloudReady()){
    showLoadingOverlay(t('msg_loading_cloud'), t('msg_please_wait'));
    try{ await pullFromCloud(true); }catch(e){ console.warn('cloud pull failed', e); }
    hideLoadingOverlay();
    if(!db){ db = emptyDB(); saveDB(); }
  } else {
    db = loadDB();
    if(!db){ db = seedDB(); saveDB(); }
  }
  state.dashboardDate = todayStr();
  state.dashboardPeriod = 'daily';
  state.repsDay = todayStr();
  $('#menuBtn').onclick = ()=> $('#sidebar').classList.toggle('open');
  $('#langBtn').onclick = ()=> toolAction('lang');
  $('#topSet').onclick  = ()=> settingsModal();
  $('#btnSet').onclick  = ()=> settingsModal();
  $('#btnPerm').onclick = ()=> permModal();
  $('#btnPwd').onclick  = ()=> pwdModal();
  $('#syncBtn').onclick = ()=>{
    if(!isCloudReady()){ settingsModal(); return; }
    fullSync().then(ok => { if(ok) render(); });
  };
  $('#shareBtn').onclick  = ()=> copyShareLink();
  $('#importBtn').onclick = ()=> toolAction('import');
  $('#exportBtn').onclick = ()=> toolAction('export');
  $('#resetBtn').onclick  = ()=> toolAction('reset');
  $('#waBtn').onclick     = ()=> openWhatsApp();
  $('#printBtn').onclick  = ()=> window.print();
  $('#collapseAllBtn').onclick = ()=> toggleAllCollapse();
  $('#fsBtn').onclick = ()=> toggleFullscreen();
  ['fullscreenchange','webkitfullscreenchange','msfullscreenchange'].forEach(ev=>
    document.addEventListener(ev, updateFsBtn));
  updateFsBtn();
  $('#notifBtn').onclick = (e)=>{ e.stopPropagation(); openNotifPanel(); };
  $('#closeNotif').onclick = (e)=>{ e.stopPropagation(); closeNotifPanel(); };
  $('#markAllRead').onclick = ()=>{
    (db.notifications||[]).forEach(n=> n.read = true);
    saveDB(); renderNotifList(); updateNotifBadge();
    toast(t('msg_all_read'),'ok');
  };
  document.addEventListener('click', e=>{
    const p = $('#notifPanel');
    if(p.classList.contains('open') && !p.contains(e.target) && !$('#notifBtn').contains(e.target)){
      closeNotifPanel();
    }
  });
  $('#loginForm').addEventListener('submit', e=>{
    e.preventDefault();
    const id = $('#lgId').value.trim();
    const pw = $('#lgPw').value;
    if(!id || !pw){ $('#lgErr').textContent = t('msg_required'); $('#lgErr').style.display='block'; return; }
    if(!doLogin(id, pw)){
      $('#lgErr').textContent = t('msg_login_err'); $('#lgErr').style.display='block';
      toast(t('msg_login_err'),'err');
    }
  });
  let resizeTimer;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=> applySettings(), 120);
  });
  setTimeout(()=> applySettings(), 50);
  setTimeout(()=> checkInternetExpiry(), 2000);
  const sess = loadSession();
  if(sess){
    state.user = sess; showApp();
    const mode = (db.settings && db.settings.supervisorSyncMode) || 'auto';
    if(isCloudReady() && mode === 'auto' && !state.cloudMode){
      pushToCloud(true);
    }
  } else {
    showLogin();
  }
  setInterval(async ()=>{
    if(!isCloudReady() || !state.user || state.cloudBusy) return;
    const mode = (db.settings && db.settings.supervisorSyncMode) || 'auto';
    if(mode === 'manual') return;
    if(state.cloudMode){
      const before = JSON.stringify(db);
      const ok = await pullFromCloud(true);
      if(ok && JSON.stringify(db) !== before) render();
    } else {
      await pushToCloud(true);
    }
  }, 45000);
  ['mousemove','mousedown','keydown','touchstart','scroll','click','input'].forEach(ev =>
    document.addEventListener(ev, resetInactivity, {passive:true})
  );
  window.addEventListener('beforeunload', ()=>{
    if(!state.cloudMode) saveDB();
  });
}
window.addEventListener('load', init);

/* ═══════════════════════════════════════════════════════════
   S3 — SHA-256 password hashing
   ═══════════════════════════════════════════════════════════ */
async function sha256Hex(text){
  const buf = new TextEncoder().encode(String(text || ''));
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function hashPwdV2(pwd){ return 'sha256$' + await sha256Hex(pwd); }
async function verifyPassword(input, storedHash){
  if(!input || !storedHash) return false;
  const s = String(storedHash);
  if(s.startsWith('sha256$')) return (await hashPwdV2(input)) === s;
  if(s.startsWith('h') && typeof hashPwd === 'function') return hashPwd(input) === s;
  return false;
}
async function verifyAndUpgrade(input, storedHash, updateFn){
  if(!input || !storedHash) return false;
  const s = String(storedHash);
  if(s.startsWith('sha256$')) return (await hashPwdV2(input)) === s;
  if(typeof hashPwd === 'function' && hashPwd(input) === s){
    try{
      const nh = await hashPwdV2(input);
      if(typeof updateFn === 'function') updateFn(nh);
    }catch(e){}
    return true;
  }
  return false;
}
window.hashPwdV2 = hashPwdV2;
window.verifyPassword = verifyPassword;
window.verifyAndUpgrade = verifyAndUpgrade;

/* ═══════════════════════════════════════════════════════════
   S4 — CloudCfg encryption (AES-GCM + PBKDF2)
   ═══════════════════════════════════════════════════════════ */
function b64enc(u8){ return btoa(String.fromCharCode.apply(null, u8)); }
function b64dec(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function deriveKey(password, saltU8){
  const baseKey = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(String(password)),
    { name:'PBKDF2' }, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:saltU8, iterations:100000, hash:'SHA-256' },
    baseKey, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
async function encryptCloudCfg(obj, password){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const ct = await crypto.subtle.encrypt(
    { name:'AES-GCM', iv }, key,
    new TextEncoder().encode(JSON.stringify(obj))
  );
  return { v:2, salt:b64enc(salt), iv:b64enc(iv),
    ciphertext:b64enc(new Uint8Array(ct)),
    createdAt:new Date().toISOString() };
}
async function decryptCloudCfg(blob, password){
  const key = await deriveKey(password, b64dec(blob.salt));
  const pt = await crypto.subtle.decrypt(
    { name:'AES-GCM', iv:b64dec(blob.iv) }, key, b64dec(blob.ciphertext)
  );
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlockCloudCfg(password){
  try{
    const raw = localStorage.getItem(CLOUD_CFG_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.v === 2 && parsed.ciphertext){
      try{
        const cfg = await decryptCloudCfg(parsed, password);
        if(cfg && cfg.key && cfg.binId){
          cloudCfg = { key:cfg.key, binId:cfg.binId };
          try{ sessionStorage.setItem(CLOUD_SESSION_KEY, JSON.stringify(cloudCfg)); }catch(e){}
          if(typeof setCloudStatus === 'function') setCloudStatus('on');
        }
      }catch(e){ console.warn('[v13] decrypt failed'); }
      return;
    }
    if(parsed && parsed.key && parsed.binId){
      cloudCfg = { key:parsed.key, binId:parsed.binId };
      try{ sessionStorage.setItem(CLOUD_SESSION_KEY, JSON.stringify(cloudCfg)); }catch(e){}
      try{
        const enc = await encryptCloudCfg(cloudCfg, password);
        localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(enc));
      }catch(e){}
      if(typeof setCloudStatus === 'function') setCloudStatus('on');
    }
  }catch(e){}
}

var _origSaveCloud = window.saveCloudCfg;
window.saveCloudCfg = function(){
  try{
    if(state.cloudMode){
      sessionStorage.setItem(CLOUD_SESSION_KEY, JSON.stringify(cloudCfg));
      return;
    }
    if(state._ownerPassword && cloudCfg.key && cloudCfg.binId){
      encryptCloudCfg(cloudCfg, state._ownerPassword).then(enc => {
        localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(enc));
        try{ sessionStorage.setItem(CLOUD_SESSION_KEY, JSON.stringify(cloudCfg)); }catch(e){}
      }).catch(e => {
        localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cloudCfg));
      });
      return;
    }
    if(_origSaveCloud) _origSaveCloud.call(this);
    else localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cloudCfg));
  }catch(e){ console.warn('[v13 saveCloudCfg]', e); }
};

window.loadCloudCfg = function(){
  try{
    const rawSession = sessionStorage.getItem(CLOUD_SESSION_KEY);
    if(rawSession){
      const parsed = JSON.parse(rawSession);
      if(parsed && parsed.key && parsed.binId) return parsed;
    }
    const raw = localStorage.getItem(CLOUD_CFG_KEY);
    if(!raw) return { key:'', binId:'' };
    const parsed = JSON.parse(raw);
    if(parsed && parsed.v === 2 && parsed.ciphertext) return { key:'', binId:'', _locked:true };
    if(parsed && parsed.key && parsed.binId) return parsed;
  }catch(e){}
  return { key:'', binId:'' };
};

function patchHeadersByPosition(){
  var tableId = currentTableIdV13();
  if(!tableId || !V13_KEYS[tableId]) return;
  var builtinKeys = V13_KEYS[tableId];
  var custom = (typeof customCols === 'function') ? customCols(tableId) : [];

    if(ths.length !== expected && ths.length !== expected + 1) return;
    var hasAction = (ths.length === expected + 1);
    var dataThs = ths.slice(0, expected);

    dataThs.forEach(function(th, i){
      if(i < allKeys.length) th.dataset.col = allKeys[i];
    });

    dataThs.forEach(function(th){
      var key = th.dataset.col;
      if(!key || customIds.indexOf(key) >= 0) return;

    if(hasAction) desired.push(ths.length - 1);

    if(desired.length !== ths.length) return;

    table.querySelectorAll('tr').forEach(function(row){
      var cells = Array.from(row.children);

      var reordered = desired.map(function(i){ return cells[i]; });
      cells.forEach(function(c){ c.remove(); });

    body.addEventListener('dragover', function(e){
      e.preventDefault();
      var tr = e.target.closest('tr'); if(!tr) return;
      body.querySelectorAll('tr').forEach(function(x){ x.classList.remove('drop-target'); });
      tr.classList.add('drop-target');
    }, true);
    body.addEventListener('drop', function(e){
      e.preventDefault();
      var tr = e.target.closest('tr');
      if(!tr || !window._tmSrc || window._tmSrc === tr) return;
      var rect = tr.getBoundingClientRect();
      var after = (e.clientY - rect.top) > rect.height / 2;
      tr.parentNode.insertBefore(window._tmSrc, after ? tr.nextSibling : tr);
      body.querySelectorAll('tr').forEach(function(x){ x.classList.remove('drop-target'); });
    }, true);

    modal.addEventListener('click', function(e){
      if(e.target.id !== 'mSave') return;
      var nh = {};
      body.querySelectorAll('tr[data-col-locked]').forEach(function(tr){
        var key = tr.dataset.colKey; var inp = tr.querySelector('input');
        if(!inp || !key) return;
        var label = (inp.value || '').trim();
        var def = inp.dataset.defaultLabel || '';
        if(label && def && label !== def) nh[key] = label;
      });
      if(!db.settings.customHeaders) db.settings.customHeaders = {};
      db.settings.customHeaders[tableId] = nh;
    }, true);

    body.querySelectorAll('tr[data-col-locked]').forEach(function(tr){
      if(tr.dataset.v13Enhanced === '1') return;
      tr.dataset.v13Enhanced = '1';
      var key = tr.dataset.colKey; var inp = tr.querySelector('input');
      if(!inp || !key) return;
      var defLabel = inp.value;
      var currentLabel = (db.settings && db.settings.customHeaders && db.settings.customHeaders[tableId] && db.settings.customHeaders[tableId][key]) || defLabel;
      inp.value = currentLabel; inp.readOnly = false; inp.dataset.defaultLabel = defLabel;
      inp.placeholder = 'اكتب اسماً مخصصاً…';
      var chip = tr.querySelector('.chip'); if(chip) chip.innerHTML = '✏️ قابلة للتعديل';
      var actions = tr.children[2];
      if(actions) actions.innerHTML = '<div class="tbl-actions" style="justify-content:center">' +
        '<button type="button" class="btn btn-ghost btn-sm" data-col-up>⬆️</button>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-col-down>⬇️</button>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-col-reset style="color:var(--amber)">↺</button></div>';
      tr.draggable = true;
    });
    body.querySelectorAll('tr[data-col-custom]').forEach(function(tr){
      if(!tr.dataset.colKey) tr.dataset.colKey = tr.dataset.colId;
      tr.draggable = true;
    });
  }, 80);
};

function attachStickyScroll(){
  document.querySelectorAll('.tbl-wrap').forEach(function(wrap){
    if(wrap.dataset.stickyBound === '1') return;

    var h = function(){
      if(wrap.scrollTop > 2) wrap.classList.add('scrolled');
      else wrap.classList.remove('scrolled');

function removeOrdersCardFromDashboard(){
  if(state.section !== 'dashboard') return;
  var target = (typeof t === 'function') ? t('t_orders_rep') : 'Orders per Driver';
  document.querySelectorAll('#view .grid.g2').forEach(function(grid){
    var cards = Array.from(grid.children).filter(function(el){
      return el.classList && el.classList.contains('card');
    });
    if(cards.length !== 2) return;
    var hasOrders = false;
    cards.forEach(function(c){
      var head = c.querySelector('.card-head');
      if(head && head.textContent.indexOf(target) !== -1) hasOrders = true;
    });
    if(!hasOrders) return;
    cards.forEach(function(c){
      var head = c.querySelector('.card-head');
      if(head && head.textContent.indexOf(target) !== -1) c.remove();
    });
    var remaining = grid.querySelectorAll(':scope > .card');
    if(remaining.length === 1){
      grid.classList.remove('g2');
      grid.style.gridTemplateColumns = '1fr';
    }
  });
}
window.removeOrdersCardFromDashboard = removeOrdersCardFromDashboard;

var _auditSnapshot = null;
function captureAuditSnapshot(){
  var snap = {};
  Object.keys(window._AUDIT_ENTITIES).forEach(function(k){
    var def = window._AUDIT_ENTITIES[k];
    var arr = (db && db[def.arr]) || [];
    snap[k] = {};
    arr.forEach(function(item){
      if(!item || !item.id) return;
      try{ snap[k][item.id] = JSON.stringify(item); }catch(e){}
    });
  });
  return snap;
}

function diffAndAudit(){
  if(!_auditSnapshot){ _auditSnapshot = captureAuditSnapshot(); return; }
  var now = captureAuditSnapshot();
  var entries = [];
  var user = state.user || { id:'system', name:'system' };
  var ts = new Date().toISOString();

  Object.keys(window._AUDIT_ENTITIES).forEach(function(entity){
    var def = window._AUDIT_ENTITIES[entity];
    var prev = _auditSnapshot[entity] || {};
    var cur = now[entity] || {};
    var arr = (db && db[def.arr]) || [];

    Object.keys(cur).forEach(function(id){
      if(!prev[id]){
        var item = arr.find(function(x){ return x.id === id; });
        var nm = '—';
        try{ nm = def.name(item) || '—'; }catch(e){}
        entries.push({ action:'create', entity:entity, entityId:id, entityName:nm });
      } else if(prev[id] !== cur[id]){
        var it2 = arr.find(function(x){ return x.id === id; });
        var nm2 = '—';
        try{ nm2 = def.name(it2) || '—'; }catch(e){}
        entries.push({ action:'update', entity:entity, entityId:id, entityName:nm2 });
      }
    });
    Object.keys(prev).forEach(function(id){
      if(!cur[id]) entries.push({ action:'delete', entity:entity, entityId:id, entityName:'(deleted)' });
    });
  });

  if(entries.length){
    db.auditLog = db.auditLog || [];
    entries.forEach(function(e){
      db.auditLog.unshift({
        id: uid(), action:e.action, entity:e.entity, entityId:e.entityId,
        entityName:e.entityName, userId:user.id, userName:user.name || '—',
        timestamp:ts, meta:{}
      });
    });
    if(db.auditLog.length > 500) db.auditLog.length = 500;
  }
  _auditSnapshot = now;
}
window.diffAndAudit = diffAndAudit;

function compressImageV13(file, maxW, maxH, quality){
  return new Promise(function(resolve, reject){
    var rd = new FileReader();
    rd.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxW){ h = h * (maxW / w); w = maxW; }
        if(h > maxH){ w = w * (maxH / h); h = maxH; }
        var c = document.createElement('canvas');
        c.width = Math.round(w); c.height = Math.round(h);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = rd.result;
    };
    rd.onerror = reject;
    rd.readAsDataURL(file);
  });
}

  check('verifyPassword available', function(){ return typeof window.verifyPassword === 'function'; });
  check('doLogin async', function(){ return window.doLogin.constructor.name === 'AsyncFunction'; });
  check('Print CSS injected', function(){ return !!document.getElementById('v13PrintCSS'); });
  check('crypto.subtle available', function(){ return typeof crypto === 'object' && typeof crypto.subtle === 'object'; });
  check('db.meta exists', function(){ return typeof db === 'object' && db.meta; });
  check('attachments have no image field', function(){ return (db.attachments || []).every(function(a){ return !a.image; }); });
  check('updatedAt on reps', function(){ return (db.reps || []).every(function(r){ return r.updatedAt; }); });

  await checkAsync('SHA-256 roundtrip', async function(){
    var h = await hashPwdV2('test');
    return h.startsWith('sha256$') && h.length > 70;
  });
  await checkAsync('verify correct sha256', async function(){
    var h = await hashPwdV2('s3cr3t');
    return await verifyPassword('s3cr3t', h) === true;
  });
  await checkAsync('reject wrong sha256', async function(){
    var h = await hashPwdV2('s3cr3t');
    return await verifyPassword('wrong', h) === false;
  });
  await checkAsync('verify legacy hash', async function(){
    var old = hashPwd('legacy');
    return await verifyPassword('legacy', old) === true;
  });
  await checkAsync('AES-GCM roundtrip', async function(){
    var obj = { key:'k1', binId:'b1' };
    var enc = await encryptCloudCfg(obj, 'pw123');
    if(!enc || enc.v !== 2) return false;
    var dec = await decryptCloudCfg(enc, 'pw123');
    return dec.key === 'k1' && dec.binId === 'b1';
  });
  await checkAsync('AES-GCM rejects wrong pw', async function(){
    var enc = await encryptCloudCfg({ key:'k', binId:'b' }, 'right');
    try{ await decryptCloudCfg(enc, 'wrong'); return false; }catch(e){ return true; }
  });
  await checkAsync('IndexedDB available', async function(){
    var idb = await openAttachDB();
    return !!idb;
  });
  await checkAsync('IDB write/read/delete', async function(){
    var id = 'test_' + Date.now();
    var data = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
    await putAttachImage(id, data);
    var rd = await getAttachImage(id);
    await deleteAttachImage(id);
    return rd === data;
  });
  await checkAsync('storageQuotaCheck works', async function(){
    var q = await window.storageQuotaCheck();
    return q && q.supported === true;
  });

  var passed = results.filter(function(r){ return r.indexOf('✅') === 0; }).length;
  console.log('%c═══ v13 Test ═══', 'color:#6366f1;font-weight:bold;font-size:14px');
  results.forEach(function(r){ console.log(r); });
  console.log('%c' + passed + '/' + results.length + ' passed',
              passed === results.length ? 'color:#10b981;font-weight:bold' : 'color:#f59e0b;font-weight:bold');
  return { passed: passed, total: results.length, results: results };
};

    + '</div>'
    + '</div>';

    + '<div class="tbl-wrap" style="border:0">'

    pagination = '<div style="display:flex;justify-content:center;align-items:center;gap:10px;padding:16px;flex-wrap:wrap">'

      + '<span class="chip blue">' + t('records_page') + ' ' + pageNum + ' / ' + totalPages + '</span>'

      + '</div>';
  }

  return header + table + pagination;

    + '<button class="tab ' + (tab === 'sub' ? 'active' : '') + '" data-rec-tab="sub" type="button">' + t('records_tab_sub') + '</button>'
    + '</div>';

  return tabsHTML + (tab === 'sub' ? _viewSub() : _viewGeneral());
};

/* ═══════════════════════════════════════════════════════════
   D6 — _afterRecordsV13 (event binding)
   ═══════════════════════════════════════════════════════════ */
function _afterRecordsV13(){
  document.querySelectorAll('[data-rec-tab]').forEach(function(b){
    b.onclick = function(){
      state.recordsTab = b.dataset.recTab;
      state.subSearch = '';
      state.subPage = {};
      render();
    };
  });

  var tab = state.recordsTab || 'general';

  if(tab === 'general'){
    var printGen = document.getElementById('printGeneralBtn');
    if(printGen) printGen.onclick = _printRecordsGeneral;

    document.querySelectorAll('[data-rec-expand]').forEach(function(b){
      b.onclick = function(){
        var id = b.dataset.recExpand;
        state.recordsExpanded[id] = !state.recordsExpanded[id];
        render();
      };
    });

    document.querySelectorAll('[data-rec-edit]').forEach(function(b){
      b.onclick = function(e){
        e.preventDefault();
        var sec = SUB_RECORDS.find(function(s){ return s.id === b.dataset.recEdit; });
        if(sec && typeof sec.onEdit === 'function') sec.onEdit(b.dataset.recId);
      };
    });

    document.querySelectorAll('[data-rec-del]').forEach(function(b){
      b.onclick = function(e){
        e.preventDefault();
        if(!confirm(t('msg_confirm_del'))) return;
        var sec = SUB_RECORDS.find(function(s){ return s.id === b.dataset.recDel; });
        if(!sec) return;
        try { sec.onDelete(b.dataset.recId); } catch(err){}
        saveDB(); render(); toast(t('msg_deleted'), 'ok');
        if(typeof autoSyncAfterSave === 'function') autoSyncAfterSave();
      };
    });

    var at = document.querySelector('[data-toggle-audit]');
    if(at){
      at.onclick = function(e){
        if(e.target.closest('#clearAuditBtn')) return;
        state.recordsExpanded['__audit'] = !state.recordsExpanded['__audit'];
        render();
      };
    }

    var clr = document.getElementById('clearAuditBtn');
    if(clr) clr.onclick = function(e){
      e.stopPropagation();
      if(!confirm(t('audit_confirm_clear'))) return;
      db.auditLog = [];
      saveDB(); render();
      toast(t('msg_deleted'), 'ok');
    };

    var exp = document.querySelector('[data-rec-export]');
    if(exp) exp.onclick = function(){
      try{
        if(!window.XLSX) throw new Error('XLSX');
        var log = db.auditLog || [];
        var rows = [[t('audit_action'), t('audit_entity'), t('audit_entity_name'), t('audit_user'), t('audit_time')]]
          .concat(log.map(function(e){
            return [t('audit_action_' + e.action), t('audit_entity_' + e.entity), e.entityName || '', e.userName || '', formatDateTime(e.timestamp)];
          }));
        var wb = XLSX.utils.book_new();
        var ws = XLSX.utils.aoa_to_sheet(rows);
        XLSX.utils.book_append_sheet(wb, ws, 'Audit');
        XLSX.writeFile(wb, 'audit-log-' + todayStr() + '.xlsx');
        toast(t('export_done') || 'تم التصدير', 'ok');
      } catch(err){
        if(typeof openExportModal === 'function') openExportModal();
        else toast('فشل التصدير', 'err');
      }
    };
  } else {
    var sel = document.getElementById('subRecordSelect');
    if(sel) sel.onchange = function(e){
      state.subRecordId = e.target.value;
      state.subSearch = '';
      state.subPage = {};
      render();
    };

    var srch = document.getElementById('subSearchInput');
    if(srch){
      var timer;
      srch.addEventListener('input', function(e){
        clearTimeout(timer);
        var val = e.target.value;
        timer = setTimeout(function(){
          state.subSearch = val;
          state.subPage[state.subRecordId] = 1;
          render();
          setTimeout(function(){
            var inp = document.getElementById('subSearchInput');
            if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
          }, 30);
        }, 350);
      });
    }

    var psSel = document.getElementById('subPageSizeSelect');
    if(psSel) psSel.onchange = function(e){
      state.subPageSize = parseInt(e.target.value) || 25;
      state.subPage[state.subRecordId] = 1;
      render();
    };

    var pBtn = document.getElementById('subPrintBtn');
    if(pBtn) pBtn.onclick = _printRecordsSub;

    var aBtn = document.getElementById('subAddBtn');
    if(aBtn) aBtn.onclick = function(){
      var sec = SUB_RECORDS.find(function(s){ return s.id === state.subRecordId; });
      if(sec && typeof sec.onAdd === 'function') sec.onAdd();
    };

    document.querySelectorAll('[data-sub-edit]').forEach(function(b){
      b.onclick = function(e){
        e.preventDefault();
        var sec = SUB_RECORDS.find(function(s){ return s.id === b.dataset.subEdit; });
        if(sec && typeof sec.onEdit === 'function') sec.onEdit(b.dataset.subId);
      };
    });

    document.querySelectorAll('[data-sub-del]').forEach(function(b){
      b.onclick = function(e){
        e.preventDefault();
        if(!confirm(t('msg_confirm_del'))) return;
        var sec = SUB_RECORDS.find(function(s){ return s.id === b.dataset.subDel; });
        if(!sec) return;
        try { sec.onDelete(b.dataset.subId); } catch(err){}
        saveDB(); render(); toast(t('msg_deleted'), 'ok');
        if(typeof autoSyncAfterSave === 'function') autoSyncAfterSave();
      };
    });

    document.querySelectorAll('[data-row-print]').forEach(function(b){
      b.onclick = function(e){
        e.preventDefault();
        _printRecordsRow(b.dataset.sec, b.dataset.rowId);
      };
    });

    document.querySelectorAll('[data-page-prev]').forEach(function(b){
      b.onclick = function(){
        var id = b.dataset.pagePrev;
        state.subPage[id] = Math.max(1, (state.subPage[id] || 1) - 1);
        render();
      };
    });
    document.querySelectorAll('[data-page-next]').forEach(function(b){
      b.onclick = function(){
        var id = b.dataset.pageNext;
        var sec = SUB_RECORDS.find(function(s){ return s.id === id; });
        if(!sec) return;
        var q = (state.subSearch || '').toLowerCase();
        var filtered = q ? sec.data().filter(function(item){
          return sec.columns.some(function(col){
            try { var v = col.get(item); return v && String(v).toLowerCase().indexOf(q) !== -1; } catch(e){ return false; }
          });
        }) : sec.data();
        var ps = state.subPageSize;
        var tp = ps > 0 ? Math.ceil(filtered.length / ps) : 1;
        state.subPage[id] = Math.min(tp, (state.subPage[id] || 1) + 1);
        render();
      };
    });
  }

  setTimeout(function(){
    if(typeof attachStickyScroll === 'function') attachStickyScroll();
  }, 60);
}

<script>
(function(){

  /* ═══ 1) حماية normalizeDB من إفساد sha256$ ═══ */
  function patchNormalize(){
    if(typeof window.normalizeDB !== 'function'){
      setTimeout(patchNormalize, 50);
      return;
    }
    if(window._normPatched) return;
    window._normPatched = true;
    
    var _orig = window.normalizeDB;
    window.normalizeDB = function(d){
      var ownerPwd = d && d.auth && d.auth.owner && d.auth.owner.password;
      var supPwds = (d && d.supervisors || []).map(function(s){ return s && s.password; });
      var result = _orig.call(this, d);
      if(ownerPwd && String(ownerPwd).startsWith('sha256$')){
        if(result.auth && result.auth.owner) result.auth.owner.password = ownerPwd;
      }
      if(Array.isArray(supPwds)){
        (result.supervisors || []).forEach(function(s, i){
          if(supPwds[i] && String(supPwds[i]).startsWith('sha256$')) s.password = supPwds[i];
        });
      }
      return result;
    };
    console.log('%c[v14] ✅ normalizeDB protected — passwords will not be corrupted again', 'color:#10b981');
  }
  patchNormalize();

  /* ═══ 2) إعادة تعيين كلمة مرور المالك تلقائياً ═══ */
  window.addEventListener('load', function(){

        var sha256Hex = async function(text){
          var buf = new TextEncoder().encode(text);
          var hash = await crypto.subtle.digest('SHA-256', buf);
          return Array.from(new Uint8Array(hash)).map(function(b){
            return b.toString(16).padStart(2, '0');
          }).join('');
        };
        
        db.auth.owner.email = 'admin@drivers.local';
        db.auth.owner.phone = '0000000000';
        db.auth.owner.password = 'sha256$' + await sha256Hex('ChangeMe@2026');

        if(typeof saveDB === 'function') saveDB();

        // إذا كنا في صفحة الدخول، اعرض النص في الترويسة

      }).catch(()=>{ p.innerHTML='<i class="fa-solid fa-cloud-arrow-down"></i>'; });

/* ══════════ E. شاشة الدخول — إخفاء البيانات + استعادة كلمة المرور ══════════ */
async function sha256(txt){
  const buf = new TextEncoder().encode(String(txt));
  const h = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

function passwordRecoveryModal(){
  const sec = (db && db.auth && db.auth.owner && db.auth.owner.security) || {};
  const hasSec = sec.question && sec.answerHash;
  const body = `
    <form id="fpForm" class="form-grid" novalidate>
      <div class="field" style="grid-column:1/-1">
        <div class="small" style="padding:12px 14px;border-radius:10px;background:var(--amber-soft);border:1px solid #fde68a">
          ${hasSec
            ? '🔑 أدخل بريد/جوال المالك ثم أجب على سؤال الأمان أو أدخل رمز الاستعادة.'
            : '⚠️ لم يتم إعداد سؤال أمان بعد. اتصل بمالك النظام لاستعادة كلمة المرور.'}
        </div>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>البريد الإلكتروني أو رقم الجوال <span class="req">*</span></label>
        <input id="fpId" dir="ltr" required placeholder="admin@drivers.local">
      </div>
      ${hasSec ? `
      <div class="field" style="grid-column:1/-1">
        <label>طريقة الاستعادة</label>
        <select id="fpType">
          <option value="question">❓ سؤال الأمان</option>
          <option value="code">🔢 رمز الاستعادة</option>
        </select>
      </div>
      <div class="field" id="fpQBox" style="grid-column:1/-1">
        <label>السؤال: <b>${esc(sec.question)}</b></label>
        <input id="fpAnswer" placeholder="الإجابة">
      </div>
      <div class="field" id="fpCodeBox" style="grid-column:1/-1;display:none">
        <label>رمز الاستعادة</label>
        <input id="fpCode" dir="ltr" placeholder="XXXXXXXXXXXX">
      </div>
      <div class="field"><label>كلمة المرور الجديدة</label>
        <input type="password" id="fpP1" placeholder="4 أحرف على الأقل"></div>
      <div class="field"><label>تأكيد كلمة المرور</label>
        <input type="password" id="fpP2"></div>
      ` : ''}
      <div id="fpErr" class="err" style="grid-column:1/-1;display:none"></div>
    </form>`;
  openModal({
    title:'🔑 استعادة كلمة المرور',
    body,
    submitText:'إعادة تعيين',
    onMount(root){
      const sel = root.querySelector('#fpType');
      if(sel){
        sel.onchange = ()=>{
          root.querySelector('#fpQBox').style.display = sel.value==='question' ? '' : 'none';
          root.querySelector('#fpCodeBox').style.display = sel.value==='code' ? '' : 'none';
        };
      }
    },
    async onSubmit(root){
      const err = root.querySelector('#fpErr');
      const owner = db && db.auth && db.auth.owner;
      if(!owner){ err.textContent='لا يوجد حساب مالك'; err.style.display='block'; return false; }
      const id = (root.querySelector('#fpId').value||'').trim().toLowerCase();
      const oe = (owner.email||'').toLowerCase();
      const op = (owner.phone||'').replace(/\s/g,'');
      if(id !== oe && id !== op){ err.textContent='البريد/الجوال غير مطابق'; err.style.display='block'; return false; }
      if(!hasSec){ err.textContent='لا توجد طريقة استعادة معدّة'; err.style.display='block'; return false; }
      const type = root.querySelector('#fpType').value;
      if(type==='question'){
        const ans = (root.querySelector('#fpAnswer').value||'').trim().toLowerCase();
        if(!ans || (await sha256(ans)) !== sec.answerHash){ err.textContent='إجابة خاطئة'; err.style.display='block'; return false; }
      } else {
        const code = (root.querySelector('#fpCode').value||'').trim();
        if(!code || (await sha256(code)) !== sec.resetCodeHash){ err.textContent='رمز غير صحيح'; err.style.display='block'; return false; }
      }
      const p1 = root.querySelector('#fpP1').value;
      const p2 = root.querySelector('#fpP2').value;
      if(p1.length < 4){ err.textContent='كلمة المرور قصيرة'; err.style.display='block'; return false; }
      if(p1 !== p2){ err.textContent='غير متطابقتين'; err.style.display='block'; return false; }
      owner.password = 'sha256$' + await sha256(p1);
      if(!db.meta) db.meta = {};
      db.meta.usesDefaultPassword = false;
      saveDB();
      toast('✅ تم إعادة التعيين','ok');
      return true;
    }
  });
}

async function promptSecuritySetup(){
  if(typeof isOwner !== 'function' || !isOwner()) return;
  if(!db || !db.auth || !db.auth.owner) return;
  const sec = db.auth.owner.security;
  if(sec && sec.answerHash) return;
  const body = `
    <form id="ssForm" class="form-grid" novalidate>
      <div class="field" style="grid-column:1/-1">
        <label style="font-weight:800">🛡️ إعداد استعادة كلمة المرور</label>
        <div class="small muted" style="margin-top:6px;padding:10px 14px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--border)">
          لإتاحة استعادة كلمة المرور مستقبلاً. سيتم إنشاء رمز استعادة احتياطي.
        </div>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>سؤال الأمان <span class="req">*</span></label>
        <input id="ssQ" required placeholder="ما اسم مدرستك الابتدائية؟">
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>الإجابة <span class="req">*</span></label>
        <input id="ssA" required>
      </div>
      <div id="ssErr" class="err" style="display:none;grid-column:1/-1"></div>
    </form>`;
  openModal({
    title:'🛡️ إعداد الاستعادة',
    body,
    submitText:'حفظ',
    async onSubmit(root){
      const q = (root.querySelector('#ssQ').value||'').trim();
      const a = (root.querySelector('#ssA').value||'').trim().toLowerCase();
      const errEl = root.querySelector('#ssErr');
      if(!q || !a){ errEl.textContent='مطلوب'; errEl.style.display='block'; return false; }
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = ''; for(let i=0;i<12;i++) code += chars[Math.floor(Math.random()*chars.length)];
      if(!db.auth.owner.security) db.auth.owner.security = {};
      db.auth.owner.security.question = q;
      db.auth.owner.security.answerHash = await sha256(a);
      db.auth.owner.security.resetCodeHash = await sha256(code);
      saveDB();
      setTimeout(()=>{
        openModal({
          title:'🔐 رمز الاستعادة',
          body:`<div style="padding:20px;text-align:center">
            <div style="font-size:56px;margin-bottom:8px">🔐</div>
            <div class="small muted" style="margin-bottom:14px">احفظ هذا الرمز في مكان آمن</div>
            <div style="font-family:monospace;font-size:24px;font-weight:800;letter-spacing:4px;background:var(--primary-soft);padding:16px;border-radius:12px;border:2px dashed var(--primary);margin:16px 0">${code}</div>
            <button type="button" class="btn btn-sm" id="copyCodeBtn"><i class="fa-solid fa-copy"></i> نسخ</button>
          </div>`,
          submitText:'حفظت الرمز',
          onMount(r2){
            r2.querySelector('#copyCodeBtn').onclick = ()=>{
              navigator.clipboard.writeText(code).then(()=>toast('تم النسخ','ok')).catch(()=>{});
            };
          },
          onSubmit(){ return true; }
        });
      }, 250);
      return true;
    }
  });
}

/* ══════════ F. قسم الحضور والغياب ══════════ */
function viewAttendance(){
  if(!Array.isArray(db.attendance)) db.attendance = [];
  const date = state.attendanceDate || todayStr();
  const reps = visibleReps();
  const map = {};
  db.attendance.filter(a=>a.date===date).forEach(a=> map[a.repId]=a);
  const present = Object.values(map).filter(r=>r.status==='present').length;
  const late    = Object.values(map).filter(r=>r.status==='late').length;
  const absent  = Object.values(map).filter(r=>r.status==='absent').length;

  const rows = reps.map(r=>{
    const rec = map[r.id] || {status:'absent', note:''};
    const s = rec.status;
    const colors = {
      present:'linear-gradient(135deg,#10b981,#059669)',
      late:'linear-gradient(135deg,#f59e0b,#d97706)',
      absent:'linear-gradient(135deg,#ef4444,#dc2626)'
    };
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:10px">
        <div style="width:34px;height:34px;border-radius:50%;background:var(--grad-brand);color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 34px">${esc((r.name||'?')[0])}</div>
        <div><b>${esc(r.name)}</b><div class="small muted">${esc(r.code||'')} · ${esc(r.region||'')}</div></div>
      </div></td>
      <td>${esc(supName(r.supervisorId))}</td>
      <td><div class="row" style="gap:6px;justify-content:center;flex-wrap:nowrap">
        ${['present','late','absent'].map(st=>{
          const lbl = st==='present'?'حاضر':st==='late'?'متأخر':'غائب';
          const ic  = st==='present'?'check':st==='late'?'clock':'xmark';
          const style = s===st ? `background:${colors[st]};color:#fff;border-color:transparent` : 'background:transparent;color:var(--text-2)';
          return `<button type="button" data-att-status="${st}" data-att-id="${r.id}" class="btn btn-sm" style="${style}"><i class="fa-solid fa-${ic}"></i> ${lbl}</button>`;
        }).join('')}
      </div></td>
      <td><input type="text" data-att-note="${r.id}" value="${esc(rec.note||'')}" placeholder="ملاحظة"></td>
    </tr>`;
  }).join('');

  return `
    <div class="day-picker">
      <span class="dp-label"><i class="fa-solid fa-calendar-day"></i> التاريخ</span>
      <input type="date" id="attDate" value="${date}">
      <button class="btn btn-sm btn-primary" id="attToday">اليوم</button>
      <span class="dp-day-name">${dayName(date)} — ${date}</span>
    </div>
    <div class="grid g4">
      ${kpiCard('<i class="fa-solid fa-users"></i>','إجمالي السائقين', reps.length, '#6366f1')}

/* ══════════ I. معادلات الأهداف ══════════ */
function safeEval(expr, vars){
  const tokens = String(expr).match(/[a-zA-Z_][a-zA-Z0-9_]*|\d+(?:\.\d+)?|[+\-*/()]/g) || [];
  let s = '';
  for(const tk of tokens){
    if(/^[a-zA-Z_]/.test(tk)){
      if(!(tk in vars)) throw new Error('متغير غير معروف: '+tk);
      s += '(' + Number(vars[tk]||0) + ')';
    } else if(/^\d/.test(tk)) s += tk;
    else if(/^[+\-*/()]$/.test(tk)) s += tk;
    else throw new Error('رمز غير مسموح');
  }
  if(!s) throw new Error('فارغ');
  const r = new Function('return ('+s+')')();
  if(!isFinite(r)) throw new Error('نتيجة غير صحيحة');
  return Math.round(r*100)/100;
}

function dateInPeriod(date, period){
  const today = todayStr();
  if(period === 'daily')   return date === today;
  if(period === 'weekly')  return date >= weekStart() && date <= today;
  return date >= monthStart() && date <= today;
}

function getGoalVars(period){
  const actuals = computeGoalActuals(period, null);
  const rs = visibleReports().filter(r=> dateInPeriod(r.date, period));
  return {
    orders: actuals.orders, hours: actuals.hours, violations: actuals.violations,
    accepted: sum(rs,'accepted'), rejected: sum(rs,'rejected'),
    reps: actuals.reps, days: period==='daily'?1:period==='weekly'?7:30
  };
}

function renderCustomFormulas(){
  const formulas = (db.settings && db.settings.goalFormulas) || [];
  if(!formulas.length) return '';
  return formulas.map(f=>{
    let val = '—';
    try{ val = safeEval(f.expression, getGoalVars(f.period||'monthly')); }catch(e){ val = '❌'; }
    const target = num(f.target);
    const pct = target ? Math.round((val/target)*100) : 0;
    return `<div class="goal-card">
      <div class="goal-title">🧮 ${esc(f.name)} <span class="chip gray" style="font-family:monospace;font-size:10.5px">${esc(f.expression)}</span>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost btn-sm" data-del-formula="${esc(f.id)}" title="حذف">🗑️</button>
      </div>
      <div class="goal-values">
        <div><div class="gv-l">الفعلي</div><div class="gv-v">${val}</div></div>
        <div style="text-align:center"><div class="gv-l">الهدف</div><div class="gv-v">${target||'—'}</div></div>
        <div style="text-align:end"><div class="gv-l">النسبة</div><div class="gv-v">${pct}%</div></div>
      </div>
      <div class="goal-bar ${pct>=100?'exceed':''}"><i style="width:${Math.min(100,pct)}%"></i></div>
    </div>`;
  }).join('');
}

async function _sha256(text){
  const buf = new TextEncoder().encode(String(text));
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}
