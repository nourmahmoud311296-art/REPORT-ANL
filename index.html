<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحليل أداء السائقين</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<meta name="theme-color" content="#6366f1">
<meta name="description" content="نظام تحليل أداء السائقين — لوحة تحكم متكاملة مع مزامنة سحابية">
<style>
:root{
  --primary:#6366f1;--primary-2:#8b5cf6;--primary-3:#06b6d4;
  --primary-soft:rgba(99,102,241,.08);--primary-dark:#4f46e5;--accent:#06b6d4;
  --card:#ffffff;--bg:#f5f6fa;--bg-2:#fafbfd;--bg-3:#eef0f7;
  --text:#0b1220;--text-2:#334155;--muted:#64748b;--muted-2:#94a3b8;
  --border:#e7e9f0;--border-2:#f0f2f8;
  --radius:18px;--radius-sm:12px;--radius-lg:24px;
  --fs:14.5px;--fs-scale:1;
  --green:#10b981;--green-soft:#ecfdf5;--green-ink:#047857;
  --red:#ef4444;--red-soft:#fef2f2;--red-ink:#b91c1c;
  --amber:#f59e0b;--amber-soft:#fffbeb;--amber-ink:#b45309;
  --violet:#8b5cf6;--cyan:#06b6d4;
  --grad-brand:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#06b6d4 100%);
  --grad-hero:linear-gradient(135deg,#0f172a 0%,#1e1b4b 45%,#4338ca 100%);
  --grad-side:linear-gradient(180deg,#0b1220 0%,#121a33 50%,#1a1f3d 100%);
  --shadow-xs:0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 1px 3px rgba(15,23,42,.05),0 1px 2px rgba(15,23,42,.03);
  --shadow:0 6px 20px -6px rgba(15,23,42,.10),0 2px 6px -2px rgba(15,23,42,.05);
  --shadow-md:0 14px 34px -12px rgba(15,23,42,.16),0 4px 10px -4px rgba(15,23,42,.06);
  --shadow-lg:0 32px 70px -30px rgba(15,23,42,.35);
  --shadow-glow:0 18px 40px -18px rgba(99,102,241,.55);
  --focus:0 0 0 3px rgba(99,102,241,.18);
  --glass:saturate(180%) blur(18px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:'Tajawal','Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(900px 500px at 100% 0%,rgba(99,102,241,.06),transparent 60%),
    radial-gradient(900px 500px at 0% 100%,rgba(6,182,212,.05),transparent 60%);
  color:var(--text);font-size:var(--fs);line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#94a3b8;background-clip:padding-box;border:3px solid transparent}
.app{display:flex;min-height:calc(100vh / var(--fs-scale,1));width:calc(100% / var(--fs-scale,1));zoom:var(--fs-scale,1)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.sidebar{
  width:272px;flex:0 0 272px;background:var(--grad-side);
  border-inline-end:1px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;position:sticky;top:0;
  height:calc(100vh / var(--fs-scale,1));z-index:40;overflow:hidden;
  transition:transform .28s cubic-bezier(.4,0,.2,1);color:#cbd5e1;
}
.sidebar::before{content:'';position:absolute;top:-120px;right:-100px;width:320px;height:320px;background:radial-gradient(circle,rgba(139,92,246,.35),transparent 65%);pointer-events:none}
.sidebar::after{content:'';position:absolute;bottom:-140px;left:-120px;width:340px;height:340px;background:radial-gradient(circle,rgba(6,182,212,.22),transparent 65%);pointer-events:none}
.brand{display:flex;gap:12px;align-items:center;padding:22px 18px;border-bottom:1px solid rgba(255,255,255,.06);position:relative;z-index:1}
.logo{width:44px;height:44px;flex:0 0 44px;border-radius:13px;display:grid;place-items:center;font-size:20px;color:#fff;overflow:hidden;background:var(--grad-brand);box-shadow:0 8px 22px -8px rgba(99,102,241,.7),inset 0 0 0 1px rgba(255,255,255,.12)}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:13px}
.brand-title{font-weight:800;color:#fff;font-size:14.5px;line-height:1.3;letter-spacing:-.2px}
.brand-sub{font-size:11.5px;color:#94a3b8;margin-top:2px;font-weight:500}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;position:relative;z-index:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;background:transparent;border:0;color:#94a3b8;font-weight:600;text-align:start;width:100%;transition:all .18s ease;font-size:13.5px;position:relative}
.nav-item:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.nav-item.active{background:linear-gradient(90deg,rgba(99,102,241,.22),rgba(139,92,246,.10));color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(139,92,246,.25)}
.nav-item.active::before{content:'';position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad-brand);box-shadow:0 0 14px rgba(139,92,246,.8)}
.nav-item .ic{font-size:17px;width:22px;text-align:center;line-height:1}
.nav-item .badge{margin-inline-start:auto;background:rgba(255,255,255,.08);color:#cbd5e1;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700}
.nav-item.active .badge{background:var(--grad-brand);color:#fff}
.side-bottom{padding:12px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:3px;position:relative;z-index:1}
.side-btn{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:11px;border:0;background:transparent;color:#94a3b8;font-weight:600;text-align:start;width:100%;font-size:13px;transition:all .18s}
.side-btn:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.side-btn .si{font-size:16px;width:20px;text-align:center}
.user-box{display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:8px;background:rgba(255,255,255,.05);border-radius:13px;border:1px solid rgba(255,255,255,.06)}
.ub-avatar{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;background:var(--grad-brand);box-shadow:0 6px 16px -6px rgba(99,102,241,.7)}
.ub-info{flex:1;min-width:0}
.ub-name{color:#fff;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ub-role{color:#94a3b8;font-size:11px;margin-top:1px;font-weight:500}
.ub-out{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:#94a3b8;display:grid;place-items:center;font-size:14px;transition:.15s}
.ub-out:hover{background:rgba(239,68,68,.18);color:#fca5a5}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 24px;background:rgba(255,255,255,.75);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.topbar h1{margin:0;font-size:17px;font-weight:800;flex:1;min-width:120px;color:var(--text);letter-spacing:-.3px}
.topbar-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text-2);display:grid;place-items:center;font-size:15px;transition:all .18s;position:relative}
.icon-btn:hover{background:var(--bg-2);border-color:#d1d5db;color:var(--text);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.icon-btn.danger:hover{background:var(--red-soft);border-color:#fecaca;color:var(--red)}
.icon-btn.wa{background:linear-gradient(135deg,#25D366,#128C7E);border-color:transparent;color:#fff;box-shadow:0 6px 16px -6px rgba(37,211,102,.5)}
.icon-btn.wa:hover{box-shadow:0 8px 22px -6px rgba(37,211,102,.7);transform:translateY(-1px)}
.notif-badge{position:absolute;top:-5px;inset-inline-end:-5px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff;box-shadow:0 4px 10px -2px rgba(239,68,68,.6)}
#menuBtn{display:none}
.view{padding:26px;display:flex;flex-direction:column;gap:22px;max-width:1600px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);transition:box-shadow .25s,border-color .25s,transform .25s;overflow:hidden;position:relative}
.card:hover{box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--border-2);font-weight:700;font-size:14.5px;flex-wrap:wrap;color:var(--text);letter-spacing:-.2px;background:linear-gradient(180deg,#fff,#fcfcfe)}
.card-head .spacer{flex:1}
.card-body{padding:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:12.5px}
.empty{padding:48px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text-2);font-weight:600;font-size:13.5px;transition:all .18s;white-space:nowrap}
.btn:hover{background:var(--bg-2);border-color:#d1d5db;color:var(--text);box-shadow:var(--shadow-xs)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--grad-brand);border-color:transparent;color:#fff;box-shadow:var(--shadow-glow)}
.btn-primary:hover{filter:brightness(1.06);color:#fff;transform:translateY(-1px);box-shadow:0 14px 30px -12px rgba(99,102,241,.75)}
.btn-danger{background:var(--red-soft);border-color:#fecaca;color:var(--red-ink)}
.btn-danger:hover{background:#fee2e2;border-color:#fca5a5;color:var(--red-ink)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 10px}
.btn-ghost:hover{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:10px}
.btn:focus-visible,.icon-btn:focus-visible,.tool-btn:focus-visible{outline:0;box-shadow:var(--focus)}
.view-toggle{display:inline-flex;gap:3px;background:var(--bg-3);padding:3px;border-radius:11px;border:1px solid var(--border)}
.view-toggle button{padding:5px 12px;border:0;background:transparent;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .18s}
.view-toggle button:hover{color:var(--text)}
.view-toggle button.active{background:var(--card);color:var(--primary);font-weight:700;box-shadow:var(--shadow-xs)}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);transition:box-shadow .25s,transform .25s,border-color .25s;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;inset-inline-start:0;width:100%;height:3px;background:linear-gradient(90deg,var(--k),transparent);opacity:.7}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:#d1d5db}
.kpi-top{display:flex;align-items:flex-start;gap:14px}
.kpi-icon{width:48px;height:48px;flex:0 0 48px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--k) 12%,#fff);color:var(--k);border:1px solid color-mix(in srgb,var(--k) 22%,#fff);box-shadow:0 6px 14px -8px color-mix(in srgb,var(--k) 60%,transparent)}
.kpi-label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.2px;text-transform:uppercase}
.kpi-value{font-size:28px;font-weight:800;line-height:1.05;letter-spacing:-.8px;margin-top:4px;color:var(--text);font-variant-numeric:tabular-nums}
.kpi-delta{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;align-self:flex-start}
.kpi-delta.up{background:var(--green-soft);color:var(--green-ink)}
.kpi-delta.down{background:var(--red-soft);color:var(--red-ink)}
.kpi-spark svg{display:block;width:100%;height:38px}
.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--border);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
thead th{background:linear-gradient(180deg,#fafbfd,#f3f5fa);text-align:start;padding:13px 16px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tbody td{padding:14px 16px;border-bottom:1px solid var(--border-2);vertical-align:middle;color:var(--text-2)}
tbody tr{transition:background .15s}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:linear-gradient(90deg,var(--primary-soft),transparent 60%)}
.tbl-actions{display:flex;gap:4px;justify-content:flex-end}
.cards-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px;transition:all .25s;box-shadow:var(--shadow-xs);position:relative;overflow:hidden}
.item-card::before{content:'';position:absolute;top:0;inset-inline-start:0;width:100%;height:3px;background:var(--grad-brand);opacity:0;transition:opacity .25s}
.item-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:#d1d5db}
.item-card:hover::before{opacity:1}
.item-card .ic-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.item-card .ic-avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:17px;font-weight:800;background:var(--grad-brand);flex:0 0 44px;box-shadow:0 8px 18px -8px rgba(99,102,241,.7)}
.item-card .ic-name{font-weight:700;font-size:14.5px;color:var(--text)}
.item-card .ic-sub{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
.item-card .ic-rows{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.item-card .ic-rows > div{display:flex;justify-content:space-between;gap:8px}
.item-card .ic-rows .k{color:var(--muted);font-weight:500}
.item-card .ic-rows .v{font-weight:700;color:var(--text)}
.item-card .ic-actions{display:flex;gap:4px;margin-top:14px;justify-content:flex-end;border-top:1px solid var(--border-2);padding-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:9px;font-size:11.5px;font-weight:700;line-height:1.6}
.chip.green{background:var(--green-soft);color:var(--green-ink)}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.amber{background:var(--amber-soft);color:var(--amber-ink)}
.chip.blue{background:#eff6ff;color:#1d4ed8}
.chip.gray{background:var(--bg-3);color:var(--muted)}
.chip.violet{background:#f5f3ff;color:#6d28d9}
.chip.grade{width:34px;height:34px;padding:0;justify-content:center;border-radius:10px;font-size:15px;font-weight:800;color:#fff;box-shadow:0 4px 10px -4px rgba(15,23,42,.35)}
.chip.grade.A{background:linear-gradient(135deg,#10b981,#059669)}
.chip.grade.B{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.chip.grade.C{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.chip.grade.D{background:linear-gradient(135deg,#f59e0b,#d97706)}
.chip.grade.E{background:linear-gradient(135deg,#f97316,#ea580c)}
.chip.grade.F{background:linear-gradient(135deg,#ef4444,#dc2626)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.field .req{color:var(--red)}
input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:11px;background:var(--card);outline:none;transition:border-color .18s,box-shadow .18s,background .18s;font-size:13.5px}
input::placeholder,textarea::placeholder{color:var(--muted-2)}
input:hover,select:hover,textarea:hover{border-color:#d1d5db}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:var(--focus);background:#fff}
input[readonly]{background:#f8fafc!important;font-weight:800;cursor:not-allowed}
textarea{resize:vertical;min-height:70px}
.form-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.hint{font-size:11.5px;color:var(--muted)}
.err{color:var(--red);font-size:12.5px;font-weight:600;margin-top:6px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.cax{font-size:11px;fill:var(--muted-2);font-weight:600}
.cval{font-size:11.5px;fill:var(--text-2);font-weight:700}
.dnum{font-size:28px;font-weight:800;fill:var(--text)}
.dlbl{font-size:11px;fill:var(--muted);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:16px}
.legend span{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block}
.chart-type-selector{display:inline-flex;gap:3px;background:var(--bg-3);padding:3px;border-radius:10px;border:1px solid var(--border)}
.chart-type-selector button{padding:5px 10px;border:0;background:transparent;border-radius:7px;font-size:13px;color:var(--muted);transition:all .18s}
.chart-type-selector button:hover{color:var(--text)}
.chart-type-selector button.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow-xs)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:rgba(255,255,255,.85);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);position:sticky;top:78px;z-index:20}
.tool-btn{display:inline-flex;align-items:center;height:44px;width:44px;padding:0;overflow:hidden;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text-2);font-weight:600;font-size:13.5px;transition:all .3s cubic-bezier(.4,0,.2,1);white-space:nowrap}
.tool-btn .ti{width:42px;flex:0 0 42px;text-align:center;font-size:15px}
.tool-btn .tt{opacity:0;transition:opacity .2s .06s;padding-inline-end:16px}
.tool-btn:hover,.tool-btn:focus-visible{width:170px;background:var(--grad-brand);border-color:transparent;color:#fff;box-shadow:var(--shadow-glow)}
.tool-btn:hover .tt,.tool-btn:focus-visible .tt{opacity:1}
.tool-btn.danger:hover{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 12px 28px -12px rgba(239,68,68,.7)}
.toolbar.idle .tool-btn{width:44px}
.toolbar.idle .tool-btn .tt{opacity:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--bg-3);padding:5px;border-radius:14px;border:1px solid var(--border);width:fit-content}
.tab{padding:9px 16px;border-radius:9px;border:0;background:transparent;font-weight:600;font-size:13px;color:var(--muted);transition:.18s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--card);color:var(--primary);font-weight:700;box-shadow:var(--shadow-xs)}
.overlay{position:fixed;inset:0;background:rgba(11,18,32,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;z-index:100;padding:18px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:22px;width:min(900px, calc(100% / var(--fs-scale,1)));max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .28s cubic-bezier(.34,1.3,.64,1);overflow:hidden;border:1px solid var(--border);zoom:var(--fs-scale,1)}
.modal.wide{width:min(1150px, calc(100% / var(--fs-scale,1)))}
@keyframes pop{from{transform:scale(.96) translateY(14px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;padding:20px 24px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#fff,#fafbfd)}
.modal-head h3{margin:0;font-size:16px;font-weight:800;flex:1;color:var(--text);letter-spacing:-.2px}
.modal-body{padding:24px;overflow-y:auto}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--bg-2)}
.notif-panel{position:fixed;top:80px;inset-inline-end:18px;width:min(410px,calc(100vw - 36px));max-height:min(580px,76vh);background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg);z-index:150;display:none;flex-direction:column;overflow:hidden}
.notif-panel.open{display:flex;animation:pop .22s}
.notif-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#fff,#fafbfd)}
.notif-head h4{margin:0;flex:1;font-size:14.5px;font-weight:800;color:var(--text)}
.notif-list{flex:1;overflow-y:auto}
.notif-item{padding:15px 20px;border-bottom:1px solid var(--border-2);display:flex;gap:12px;align-items:flex-start;transition:background .18s}
.notif-item:last-child{border-bottom:0}
.notif-item:hover{background:var(--bg-2)}
.notif-item.unread{background:linear-gradient(90deg,var(--primary-soft),transparent)}
.notif-item .ni{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--bg-3)}
.notif-item .nt{font-weight:700;font-size:13.5px;margin-bottom:3px;color:var(--text)}
.notif-item .nb{font-size:12.5px;color:var(--muted);line-height:1.55}
.notif-item .nd{font-size:11px;color:var(--muted-2);margin-top:6px;font-weight:600}
#toast{position:fixed;bottom:26px;inset-inline-start:26px;display:flex;flex-direction:column;gap:10px;z-index:600}
.toast{background:var(--text);color:#f8fafc;padding:13px 18px;border-radius:14px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow-lg);animation:slide .28s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;gap:10px;max-width:380px;border:1px solid rgba(255,255,255,.08)}
.toast.ok{background:linear-gradient(135deg,#047857,#10b981)}
.toast.err{background:linear-gradient(135deg,#b91c1c,#ef4444)}
.toast.warn{background:linear-gradient(135deg,#b45309,#f59e0b)}
@keyframes slide{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.perm-list{display:flex;flex-direction:column;gap:10px}
.perm-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--card);flex-wrap:wrap;transition:.18s}
.perm-row:hover{border-color:var(--primary);box-shadow:var(--shadow-xs)}
.perm-row .pn{font-weight:700;font-size:13.5px;min-width:130px;color:var(--text)}
.perm-row .pc{display:flex;gap:6px;flex-wrap:wrap}
.perm-check{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);padding:7px 12px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;transition:.18s;color:var(--text-2)}
.perm-check:hover{border-color:var(--primary);background:var(--primary-soft)}
.perm-check input{width:auto;padding:0;margin:0;accent-color:var(--primary)}
.perm-check:has(input:checked){background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark);font-weight:700}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:11px;border:2px solid var(--card);cursor:pointer;transition:.18s;box-shadow:0 0 0 1px var(--border)}
.swatch:hover{transform:scale(1.12)}
.swatch.sel{box-shadow:0 0 0 3px var(--text);transform:scale(1.06)}
.share-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.share-box input{font-size:12px;direction:ltr;text-align:left;flex:1;min-width:180px}
.checkbox-list{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:14px;padding:12px;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));background:var(--bg-2)}
.login-screen{position:fixed;inset:0;background:radial-gradient(1000px 700px at 15% 20%,rgba(139,92,246,.45),transparent 55%),radial-gradient(1000px 700px at 85% 80%,rgba(6,182,212,.32),transparent 55%),linear-gradient(135deg,#070b18,#121a3d 55%,#1e1b4b);display:grid;place-items:center;z-index:500;padding:20px;overflow:hidden}
.login-screen::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 30%,rgba(139,92,246,.22),transparent 40%),radial-gradient(circle at 70% 70%,rgba(6,182,212,.20),transparent 40%);animation:float 22s ease-in-out infinite;pointer-events:none}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(2%,2%)}}
.login-card{background:rgba(255,255,255,.98);border-radius:26px;padding:42px 36px;width:min(460px, calc(100% / var(--fs-scale,1)));box-shadow:0 60px 120px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);animation:pop .38s;position:relative;z-index:1;backdrop-filter:blur(10px);zoom:var(--fs-scale,1)}
.login-logo{width:80px;height:80px;border-radius:22px;margin:0 auto 20px;overflow:hidden;display:grid;place-items:center;font-size:36px;color:#fff;background:var(--grad-brand);box-shadow:0 20px 44px -14px rgba(99,102,241,.75)}
.login-logo img{width:100%;height:100%;object-fit:cover;border-radius:22px}
.login-card h2{margin:0 0 6px;text-align:center;font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.5px}
.login-card>.sub{text-align:center;margin:0 0 28px;color:var(--muted);font-size:13.5px;font-weight:500}
.login-card form{display:flex;flex-direction:column;gap:16px}
.login-card .btn{justify-content:center;padding:13px;font-size:14.5px;border-radius:13px}
.login-hint{margin-top:24px;padding:14px 16px;background:var(--bg-3);border-radius:14px;font-size:12px;color:var(--text-2);text-align:center;line-height:1.6;border:1px solid var(--border)}
.login-hint b{color:var(--text);font-size:12.5px;display:block;margin-bottom:4px;font-weight:700}
.perf-hero{background:var(--grad-hero);border-radius:24px;padding:32px;color:#fff;position:relative;overflow:hidden;box-shadow:0 28px 60px -24px rgba(30,27,75,.7),inset 0 0 0 1px rgba(255,255,255,.06);display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center}
.perf-hero::before{content:'';position:absolute;top:-100px;right:-80px;width:340px;height:340px;background:radial-gradient(circle,rgba(139,92,246,.65),transparent 65%);pointer-events:none}
.perf-hero::after{content:'';position:absolute;bottom:-120px;left:-100px;width:380px;height:380px;background:radial-gradient(circle,rgba(6,182,212,.45),transparent 65%);pointer-events:none}
.perf-hero-info{position:relative;z-index:1}
.perf-hero-info .ph-sub{font-size:12.5px;color:#a5b4fc;font-weight:700;margin-bottom:8px;letter-spacing:.3px}
.perf-hero-info .ph-title{font-size:27px;font-weight:800;letter-spacing:-.7px;margin-bottom:12px}
.perf-hero-info .ph-desc{font-size:13.5px;color:#c7d2fe;line-height:1.65;font-weight:500;max-width:560px}
.perf-hero-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px;position:relative;z-index:1}
.ph-stat{display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);min-width:120px}
.ph-stat .phs-v{font-size:23px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.ph-stat .phs-l{font-size:11px;color:#a5b4fc;font-weight:700}
.perf-ring{position:relative;z-index:1;width:180px;height:180px;flex:0 0 180px}
.perf-ring svg{transform:rotate(-90deg);width:100%;height:100%}
.perf-ring .pr-bg{fill:none;stroke:rgba(255,255,255,.10);stroke-width:13}
.perf-ring .pr-fg{fill:none;stroke:url(#ringGrad);stroke-width:13;stroke-linecap:round;transition:stroke-dasharray 1.2s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 0 12px rgba(139,92,246,.6))}
.perf-ring .pr-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.perf-ring .pr-num{font-size:40px;font-weight:800;letter-spacing:-1.4px;line-height:1;font-variant-numeric:tabular-nums}
.perf-ring .pr-lbl{font-size:11px;color:#a5b4fc;font-weight:700;margin-top:6px;letter-spacing:.3px}
.cloud-status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted)}
.cloud-status.on{color:var(--green-ink);background:var(--green-soft);border-color:#a7f3d0}
.cloud-status.off{color:var(--amber-ink);background:var(--amber-soft);border-color:#fde68a}
.cloud-status.syncing{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}
.goal-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;position:relative;overflow:hidden;transition:.25s}
.goal-card:hover{box-shadow:var(--shadow);border-color:#d1d5db}
.goal-card::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--grad-brand)}
.goal-title{font-weight:700;font-size:13.5px;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.goal-values{display:flex;justify-content:space-between;margin-bottom:12px;font-size:12.5px}
.goal-values .gv-l{color:var(--muted);font-weight:500}
.goal-values .gv-v{font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.goal-bar{height:9px;border-radius:9px;background:var(--bg-3);overflow:hidden;position:relative}
.goal-bar > i{display:block;height:100%;border-radius:9px;transition:width .9s cubic-bezier(.4,0,.2,1);background:var(--grad-brand);box-shadow:0 0 12px rgba(99,102,241,.5)}
.goal-bar.exceed > i{background:linear-gradient(90deg,#10b981,#06b6d4);box-shadow:0 0 12px rgba(16,185,129,.5)}
.goal-pct{margin-top:10px;font-size:12px;font-weight:800;text-align:center}
.logo-upload{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-preview{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--grad-brand);color:#fff;overflow:hidden;flex:0 0 64px;box-shadow:0 10px 24px -10px rgba(99,102,241,.65)}
.logo-preview img{width:100%;height:100%;object-fit:cover}
.grades-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:12px}
.grades-grid.daily{grid-template-columns:repeat(4,1fr)}
.grade-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:14px;background:var(--bg-2);border:1px solid var(--border);transition:.2s}
.grade-box:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.grade-box .gb-letter{font-size:21px;font-weight:800;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px rgba(15,23,42,.4)}
.grade-box .gb-letter.A{background:linear-gradient(135deg,#10b981,#059669)}
.grade-box .gb-letter.B{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.grade-box .gb-letter.C{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.grade-box .gb-letter.D{background:linear-gradient(135deg,#f59e0b,#d97706)}
.grade-box .gb-letter.E{background:linear-gradient(135deg,#f97316,#ea580c)}
.grade-box .gb-letter.F{background:linear-gradient(135deg,#ef4444,#dc2626)}
.grade-box input{text-align:center;font-weight:800;font-size:14px;padding:6px 4px}
.grade-box .gb-lbl{font-size:10.5px;color:var(--muted);font-weight:600;text-align:center}
.insight-tile{padding:18px;border-radius:16px;border:1px solid var(--border);background:linear-gradient(180deg,#fff,#fafbfd);transition:.25s;position:relative;overflow:hidden}
.insight-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.insight-tile .it-label{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.2px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.insight-tile .it-value{font-size:20px;font-weight:800;margin-top:8px;color:var(--text);letter-spacing:-.4px}
.insight-tile .it-sub{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:500}
.insight-tile.tone-green{background:linear-gradient(180deg,#ecfdf5,#f6fffb);border-color:#a7f3d0}
.insight-tile.tone-green .it-label{color:#047857}
.insight-tile.tone-green .it-value{color:#065f46}
.insight-tile.tone-amber{background:linear-gradient(180deg,#fffbeb,#fffdf5);border-color:#fde68a}
.insight-tile.tone-amber .it-label{color:#b45309}
.insight-tile.tone-amber .it-value{color:#92400e}
.insight-tile.tone-blue{background:linear-gradient(180deg,#eff6ff,#f7faff);border-color:#bfdbfe}
.insight-tile.tone-blue .it-label{color:#1d4ed8}
.insight-tile.tone-blue .it-value{color:#1e3a8a}
.bulk-table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
.bulk-table th{background:linear-gradient(180deg,#fafbfd,#f3f5fa);text-align:center;padding:10px 8px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.bulk-table td{padding:8px;border-bottom:1px solid var(--border-2);vertical-align:middle;text-align:center}
.bulk-table td:first-child{text-align:start;padding-inline-start:14px}
.bulk-table input{padding:8px 10px;border-radius:9px;font-size:13px;text-align:center;min-width:60px}
.bulk-table input[type=text]{text-align:start;min-width:120px}
.bulk-table tr:hover{background:linear-gradient(90deg,var(--primary-soft),transparent 60%)}
.bulk-table .rep-name{font-weight:700;color:var(--text);font-size:13px}
.bulk-table .rep-sub{font-size:11px;color:var(--muted);margin-top:2px}
#loadingOverlay{position:fixed;inset:0;display:none;place-items:center;background:radial-gradient(1000px 700px at 15% 20%,rgba(139,92,246,.45),transparent 55%),radial-gradient(1000px 700px at 85% 80%,rgba(6,182,212,.32),transparent 55%),linear-gradient(135deg,#070b18,#121a3d 55%,#1e1b4b);z-index:9999;color:#fff;font-family:inherit}
#loadingOverlay.show{display:grid}
#loadingOverlay .lo-box{text-align:center;animation:pop .35s}
#loadingOverlay .lo-icon{font-size:56px;margin-bottom:16px;display:block;animation:pulse 1.4s ease-in-out infinite}
#loadingOverlay .lo-title{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
#loadingOverlay .lo-sub{font-size:13px;color:#a5b4fc;font-weight:500}
#loadingOverlay .lo-bar{width:220px;height:4px;background:rgba(255,255,255,.12);border-radius:4px;margin:22px auto 0;overflow:hidden}
#loadingOverlay .lo-bar i{display:block;height:100%;width:40%;border-radius:4px;background:var(--grad-brand);animation:slide-bar 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
@keyframes slide-bar{0%{margin-inline-start:-40%}100%{margin-inline-start:100%}}
@media(max-width:980px){
  .sidebar{position:fixed;inset-inline-start:0;top:0;transform:translateX(100%)}
  [dir=ltr] .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  #menuBtn{display:grid}
  .view{padding:18px}.toolbar{top:70px}
  .perf-hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .perf-hero-stats{justify-content:center}
  .grades-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:600px){
  .kpi-value{font-size:22px}
  .topbar h1{font-size:15px}
  .topbar{padding:12px 14px;gap:6px}
  .perf-ring{width:150px;height:150px;flex:0 0 150px}
  .perf-ring .pr-num{font-size:30px}
  .login-card{padding:30px 24px}
  .grades-grid{grid-template-columns:repeat(2,1fr)}
  .view{padding:14px;gap:16px}
  .modal{border-radius:18px}
  .modal-body{padding:18px}
  .perf-hero{padding:24px}
}
</style>
</head>
<body>

<div class="app" id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo" id="sidebarLogo">📊</div>
      <div>
        <div class="brand-title" id="brandTitle">تحليل أداء السائقين</div>
        <div class="brand-sub" id="brandSub">نظام المتابعة والتقارير</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-bottom">
      <div class="user-box" id="userBox"></div>
      <button class="side-btn" id="btnPerm"><span class="si">🛡️</span><span id="permLbl">الصلاحيات (المالك)</span></button>
      <button class="side-btn" id="btnPwd"><span class="si">🔑</span><span id="pwdLbl">تغيير كلمة المرور</span></button>
      <button class="side-btn" id="btnSet"><span class="si">⚙️</span><span id="setLbl">الإعدادات</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn">☰</button>
      <h1 id="pageTitle"></h1>
      <div class="topbar-actions">
        <span class="cloud-status off" id="cloudStatus">☁️ <span id="cloudText">غير متصل</span></span>
        <button class="icon-btn" id="syncBtn" title="مزامنة سحابية">🔄</button>
        <button class="icon-btn" id="shareBtn" title="نسخ رابط المشاركة">🔗</button>
        <button class="icon-btn" id="importBtn" title="استيراد">📥</button>
        <button class="icon-btn" id="exportBtn" title="تصدير">📤</button>
        <button class="icon-btn danger" id="resetBtn" title="إعادة تعيين">♻️</button>
        <button class="icon-btn wa" id="waBtn" title="تواصل واتساب">💬</button>
        <button class="icon-btn" id="notifBtn" title="الإشعارات">
          🔔<span class="notif-badge" id="notifBadge" style="display:none">0</span>
        </button>
        <button class="icon-btn" id="langBtn" title="Language">🌐</button>
        <button class="icon-btn" id="topSet" title="الإعدادات">⚙️</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="login-screen" id="loginScreen" style="display:none">
  <div class="login-card">
    <div class="login-logo" id="loginLogo">📊</div>
    <h2 id="lgTitle">تسجيل الدخول</h2>
    <p class="sub" id="lgSub">نظام تحليل أداء السائقين</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label id="lgIdLbl">البريد الإلكتروني أو رقم الجوال <span class="req">*</span></label>
        <input name="identifier" id="lgId" required autocomplete="username" dir="ltr" placeholder="example@domain.com">
      </div>
      <div class="field">
        <label id="lgPwLbl">كلمة المرور <span class="req">*</span></label>
        <input type="password" name="password" id="lgPw" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="err" id="lgErr" style="display:none"></div>
      <button type="submit" class="btn btn-primary" id="lgBtn">🔓 دخول</button>
    </form>
    <div class="login-hint" id="lgHint">
      <b>🔒 بيانات الدخول محمية</b>
      للحصول على بيانات الدخول، يُرجى التواصل مع مالك النظام.
    </div>
  </div>
</div>

<div class="notif-panel" id="notifPanel">
  <div class="notif-head">
    <h4>🔔 <span id="ntfTitle">الإشعارات</span></h4>
    <button class="btn btn-sm" id="markAllRead">تحديد الكل كمقروء</button>
    <button class="icon-btn" id="closeNotif" style="width:32px;height:32px">✕</button>
  </div>
  <div class="notif-list" id="notifList"></div>
</div>

<div id="loadingOverlay">
  <div class="lo-box">
    <span class="lo-icon">☁️</span>
    <div class="lo-title" id="loTitle">جاري تحميل البيانات من السحابة…</div>
    <div class="lo-sub" id="loSub">يرجى الانتظار لحظات</div>
    <div class="lo-bar"><i></i></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* ==========================================================================
   1) الترجمة
   ========================================================================== */
const I18N = {
  ar:{
    nav_dashboard:'لوحة التحكم', nav_daily:'التقارير اليومية', nav_reps:'السائقين',
    nav_supervisors:'المشرفين', nav_cars:'السيارات', nav_analytics:'التحليلات', nav_goals:'الأهداف',
    btn_add:'إضافة', btn_edit:'تعديل', btn_save:'حفظ', btn_cancel:'إلغاء', btn_close:'إغلاق',
    btn_search:'بحث', btn_export:'تصدير', btn_import:'استيراد',

const num = v => { const n = parseFloat(v); return isNaN(n)?0:n; };
const sum = (arr,k)=> arr.reduce((a,b)=>a+num(b[k]),0);
const round1 = n => Math.round(n*10)/10;

  const days = state.lang==='ar'
    ? ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']
    : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return days[new Date(d+'T00:00:00').getDay()];
};
const shortLabel = (s,n=11)=>{ s = String(s||''); return s.length>n ? s.slice(0,n)+'…' : s; };
const monthStart = ()=>{ const d = new Date(); d.setDate(1); return d.toISOString().slice(0,10); };
const weekStart = ()=>{ const d = new Date(); d.setDate(d.getDate()-6); return d.toISOString().slice(0,10); };
function hashPwd(pwd){
  let h = 0; pwd = String(pwd||'');
  for(let i=0;i<pwd.length;i++){ h = ((h<<5)-h) + pwd.charCodeAt(i); h |= 0; }
  return 'h' + Math.abs(h).toString(36) + '_' + pwd.length;
}
function toast(msg,type=''){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span>${type==='ok'?'✅':type==='err'?'⛔':type==='warn'?'⚠️':'ℹ️'}</span><span>${esc(msg)}</span>`;
  $('#toast').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(10px)'; el.style.transition='.3s'; },2400);
  setTimeout(()=> el.remove(), 2800);
}
function timeAgo(iso){
  const d = (Date.now() - new Date(iso).getTime())/1000;
  if(d < 60) return 'الآن';
  if(d < 3600) return Math.floor(d/60) + ' د';
  if(d < 86400) return Math.floor(d/3600) + ' س';
  return Math.floor(d/86400) + ' ي';
}
function calcPerfScore(days=7){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-(days-1));
  const cutoffStr = cutoff.toISOString().slice(0,10);
  const rs = visibleReports().filter(r=> r.date >= cutoffStr);
  const reps = visibleReps();
  if(!rs.length || !reps.length) return 0;
  const totalOrders = sum(rs,'orders');
  const totalHours = sum(rs,'hours');
  const totalViol = sum(rs,'violations');
  const totalAccepted = sum(rs,'accepted');
  const avgOrders = totalOrders / reps.length;
  const avgHours = totalHours / reps.length;
  const acceptRate = totalViol > 0 ? (totalAccepted/totalViol) : 1;
  return Math.round(
    Math.min(avgOrders/25, 1) * 50 +
    Math.min(avgHours/8, 1) * 30 +
    acceptRate * 20
  );
}
function perfLabel(score){
  if(score >= 80) return { txt: t('perf_excellent') };
  if(score >= 60) return { txt: t('perf_good') };
  if(score >= 40) return { txt: t('perf_fair') };
  return { txt: t('perf_poor') };
}
function sparkline(values, color){
  if(!values.length) return '';
  const W=160, H=38, P=4;
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const range = (max - min) || 1;
  const step = (W - P*2) / Math.max(values.length-1, 1);
  const pts = values.map((v,i)=>{
    const x = P + i*step;
    const y = H - P - ((v-min)/range) * (H - P*2);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i?'L':'M') + p[0] + ' ' + p[1]).join(' ');
  const areaPath = path + ` L ${pts[pts.length-1][0]} ${H-P} L ${pts[0][0]} ${H-P} Z`;
  const id = 'sp' + Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".35"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#${id})"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

    d.auth.owner.password = hashPwd(d.auth.owner.password);

const JSONBIN_BASE = 'https://api.jsonbin.io/v3';
function setCloudStatus(mode){
  const el = $('#cloudStatus'); const txt = $('#cloudText');
  if(!el || !txt) return;
  el.className = 'cloud-status ' + (mode==='on'?'on':mode==='syncing'?'syncing':'off');
  txt.textContent = mode==='on' ? t('msg_cloud_ok')
                  : mode==='syncing' ? t('msg_cloud_sync')

function isCloudReady(){ return !!(cloudCfg.key && cloudCfg.binId); }

async function pushToCloud(silent){
  if(!isCloudReady()){ if(!silent) toast(t('msg_no_cloud'),'warn'); return false; }
  if(state.cloudBusy) return false;
  state.cloudBusy = true; setCloudStatus('syncing');
  try{
    const res = await fetch(`${JSONBIN_BASE}/b/${cloudCfg.binId}`, {
      method:'PUT',
      headers:{ 'Content-Type':'application/json','X-Master-Key': cloudCfg.key },
      body: JSON.stringify({ data: db, updatedAt: new Date().toISOString(),
        updatedBy: state.user ? state.user.name : 'system' })
    });
    if(!res.ok) throw new Error(await res.text());
    setCloudStatus('on');
    if(!silent){ toast(t('msg_synced'),'ok'); addNotif('مزامنة سحابية','تم رفع البيانات','ok'); }
    return true;
  }catch(e){
    setCloudStatus('off');
    if(!silent) toast(t('msg_cloud_fail') + ': ' + e.message, 'err');
    return false;
  } finally { state.cloudBusy = false; }
}
async function pullFromCloud(silent){
  if(!isCloudReady()){ if(!silent) toast(t('msg_no_cloud'),'warn'); return false; }
  if(state.cloudBusy) return false;
  state.cloudBusy = true; setCloudStatus('syncing');
  try{
    const res = await fetch(`${JSONBIN_BASE}/b/${cloudCfg.binId}/latest`,
      { headers:{ 'X-Master-Key': cloudCfg.key } });
    if(!res.ok) throw new Error(await res.text());
    const json = await res.json();
    const rec = json.record || json;
    const cloudData = rec.data || rec;
    db = normalizeDB(cloudData);
    cleanupRelations(); saveDB(); setCloudStatus('on');
    if(!silent){ render(); toast(t('msg_cloud_pull'),'ok');
      addNotif('تحديث سحابي','تم جلب البيانات','ok'); }
    return true;
  }catch(e){
    setCloudStatus('off');
    if(!silent) toast(t('msg_cloud_fail') + ': ' + e.message, 'err');
    return false;
  } finally { state.cloudBusy = false; }
}

  u.searchParams.set('bin', cloudCfg.binId);

  if(!isCloudReady()){ toast(t('msg_set_cloud'),'warn'); return; }

function loadSession(){
  try{
    const raw = sessionStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.role === 'owner'){ if(!db.auth?.owner) return null; return s; }
    if(s.role === 'supervisor'){ if(!db.supervisors.find(x=>x.id === s.id)) return null; return s; }
  }catch(e){}
  return null;
}
function saveSession(u){
  if(u) sessionStorage.setItem(SESSION_KEY, JSON.stringify(u));
  else sessionStorage.removeItem(SESSION_KEY);
}
function tryLogin(identifier, password){
  const id = String(identifier||'').trim().toLowerCase();
  const rawPwd = String(password||'');
  if(!id || !rawPwd) return null;
  const pwd = hashPwd(rawPwd);
  const owner = db.auth?.owner;
  if(owner){
    const ownerEmail = (owner.email||'').toLowerCase();
    const ownerPhone = (owner.phone||'').replace(/\s+/g,'');
    if((ownerEmail === id || ownerPhone === String(identifier).replace(/\s+/g,'')) && owner.password === pwd){
      return { id:'owner', role:'owner', name: t('role_owner'), loginAt: new Date().toISOString() };
    }
  }
  const sup = db.supervisors.find(s=>{
    const sEmail = (s.email||'').toLowerCase();
    const sPhone = (s.phone||'').replace(/\s+/g,'');
    return (sEmail === id || sPhone === String(identifier).replace(/\s+/g,'')) && s.password === pwd;
  });
  if(sup) return { id:sup.id, role:'supervisor', name:sup.name, loginAt:new Date().toISOString() };
  return null;
}
function doLogin(identifier, password){
  const u = tryLogin(identifier, password);
  if(!u) return false;
  state.user = u; saveSession(u);
  const allowed = allowedSections();
  if(!allowed.includes(state.section)) state.section = allowed[0] || 'dashboard';
  addNotif(t('welcome') + ' 👋', u.name + ' — ' + (u.role==='owner'?t('role_owner'):t('role_supervisor')), 'ok');
  showApp();
  toast(t('welcome') + ' ' + u.name, 'ok');
  return true;
}

function hexToRgba(hex,a){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function shade(hex,p){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h,16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r = Math.max(0,Math.min(255, Math.round(r + 255*p/100)));
  g = Math.max(0,Math.min(255, Math.round(g + 255*p/100)));
  b = Math.max(0,Math.min(255, Math.round(b + 255*p/100)));
  return '#' + [r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function chartBar(data, color, height=280){
  if(!data.length) return `<div class="empty">${t('no_data')}</div>`;
  const W=640, H=height, P={t:32,r:18,b:58,l:48};
  const max = Math.max(...data.map(d=>num(d.value)),1);
  const iw = W-P.l-P.r, ih = H-P.t-P.b, bw = iw/data.length;
  const gid = 'bg'+Math.random().toString(36).slice(2,7);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="1"/><stop offset="100%" stop-color="${color}" stop-opacity=".55"/></linearGradient></defs>`;
  for(let i=0;i<=4;i++){
    const y = P.t + ih*i/4;
    s += `<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="rgba(15,23,42,.06)" stroke-dasharray="3 5"/>`;
    s += `<text x="${P.l-8}" y="${y+4}" text-anchor="end" class="cax">${Math.round(max*(1-i/4))}</text>`;
  }
  data.forEach((d,i)=>{
    const h = ih*(num(d.value)/max);
    const x = P.l + i*bw + bw*0.2, w = bw*0.6, y = P.t + ih - h;
    s += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,2)}" rx="8" fill="url(#${gid})"><title>${esc(d.label)}: ${d.value}</title></rect>`;
    s += `<text x="${x+w/2}" y="${H-P.b+20}" text-anchor="middle" class="cax">${esc(shortLabel(d.label))}</text>`;
    s += `<text x="${x+w/2}" y="${y-8}" text-anchor="middle" class="cval">${d.value}</text>`;
  });
  return s + `</svg>`;
}
function chartLine(data, color){
  if(!data.length) return `<div class="empty">${t('no_data')}</div>`;
  const W=640,H=280,P={t:32,r:22,b:56,l:48};
  const max = Math.max(...data.map(d=>num(d.value)),1);
  const iw = W-P.l-P.r, ih = H-P.t-P.b;
  const step = data.length>1 ? iw/(data.length-1) : 0;
  const pts = data.map((d,i)=>[P.l+i*step, P.t+ih-ih*(num(d.value)/max)]);
  const gid = 'lg'+Math.random().toString(36).slice(2,7);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
  for(let i=0;i<=4;i++){
    const y = P.t + ih*i/4;
    s += `<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="rgba(15,23,42,.06)" stroke-dasharray="3 5"/>`;
    s += `<text x="${P.l-8}" y="${y+4}" text-anchor="end" class="cax">${Math.round(max*(1-i/4))}</text>`;
  }
  const path = pts.map((p,i)=> (i?'L':'M') + p[0] + ' ' + p[1]).join(' ');
  s += `<path d="${path} L ${pts[pts.length-1][0]} ${P.t+ih} L ${pts[0][0]} ${P.t+ih} Z" fill="url(#${gid})"/>`;
  s += `<path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{
    s += `<circle cx="${p[0]}" cy="${p[1]}" r="5.5" fill="#fff" stroke="${color}" stroke-width="3"><title>${esc(data[i].label)}: ${data[i].value}</title></circle>`;
    s += `<text x="${p[0]}" y="${p[1]-13}" text-anchor="middle" class="cval">${data[i].value}</text>`;
    s += `<text x="${p[0]}" y="${H-P.b+20}" text-anchor="middle" class="cax">${esc(shortLabel(data[i].label,9))}</text>`;
  });
  return s + `</svg>`;
}
function chartDonut(data, colors, hollow=true){
  const total = data.reduce((a,b)=>a+num(b.value),0);
  if(!total) return `<div class="empty">${t('no_data')}</div>`;
  const R = hollow ? 70 : 72, C = 2*Math.PI*R;
  let off=0, s = `<svg viewBox="0 0 200 200" class="chart" style="max-width:240px;margin:auto">`;
  data.forEach((d,i)=>{
    const len = C*(num(d.value)/total);
    s += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="${hollow?30:60}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(d.label)}: ${d.value}</title></circle>`;
    off += len;
  });
  if(hollow){
    s += `<text x="100" y="97" text-anchor="middle" class="dnum">${total}</text>`;
    s += `<text x="100" y="120" text-anchor="middle" class="dlbl">${t('total')}</text>`;
  }
  s += `</svg>`;
  s += `<div class="legend">` + data.map((d,i)=>
    `<span><i style="background:${colors[i%colors.length]}"></i>${esc(d.label)} — ${d.value}</span>`).join('') + `</div>`;
  return s;
}
function chartBarGrouped(rows, colorA, colorB, labelA, labelB){
  if(!rows.length) return `<div class="empty">${t('no_data')}</div>`;
  const W=680, H=300, P={t:32,r:18,b:60,l:48};
  const max = Math.max(...rows.flatMap(r=>[num(r.a),num(r.b)]),1);
  const iw = W-P.l-P.r, ih = H-P.t-P.b, gw = iw/rows.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  for(let i=0;i<=4;i++){
    const y = P.t + ih*i/4;
    s += `<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="rgba(15,23,42,.06)" stroke-dasharray="3 5"/>`;
    s += `<text x="${P.l-8}" y="${y+4}" text-anchor="end" class="cax">${Math.round(max*(1-i/4))}</text>`;
  }
  rows.forEach((r,i)=>{
    const bx = P.l + i*gw;
    const w = gw*0.28, gap = gw*0.05;
    [['a',colorA,bx+gw*0.15],['b',colorB,bx+gw*0.15+w+gap]].forEach(([k,c,x])=>{
      const v = num(r[k]), h = ih*(v/max), y = P.t+ih-h;
      s += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,2)}" rx="6" fill="${c}"><title>${esc(r.label)}: ${v}</title></rect>`;
      s += `<text x="${x+w/2}" y="${y-6}" text-anchor="middle" class="cval">${v}</text>`;
    });
    s += `<text x="${bx+gw/2}" y="${H-P.b+20}" text-anchor="middle" class="cax">${esc(shortLabel(r.label))}</text>`;
  });
  s += `</svg>`;
  s += `<div class="legend"><span><i style="background:${colorA}"></i>${esc(labelA)}</span><span><i style="background:${colorB}"></i>${esc(labelB)}</span></div>`;
  return s;
}
function renderChart(type, data, color, colors){
  switch(type){
    case 'line': return chartLine(data, color);
    case 'donut': return chartDonut(data, colors || ['#6366f1','#8b5cf6','#06b6d4','#10b981'], true);
    case 'pie': return chartDonut(data, colors || ['#6366f1','#8b5cf6','#06b6d4','#10b981'], false);
    default: return chartBar(data, color);
  }
}

  const ordersYest  = sum(yReports,'orders');
  const deltaOrders = ordersYest ? Math.round(((ordersToday-ordersYest)/ordersYest)*100) : null;

  const hoursYest = round1(sum(yReports,'hours'));

function viewDaily(){

  const tableHTML = `
    <div class="tbl-wrap" style="border:0"><table><thead><tr>

            <div><span class="k">${t('daily_grades_table')}</span><span class="v">${dailyGradeChip(r)}</span></div>
            <div><span class="k">${t('fld_accepted')}</span><span class="v"><span class="chip green">${r.accepted}</span></span></div>

    ${kpiCard('⏱️', t('kpi_hours'), A.hours + (d2?` / ${B.hours}`:''), '#10b981',
      d2 && B.hours ? Math.round(((A.hours-B.hours)/B.hours)*100) : null)}
    ${kpiCard('⚠️', t('kpi_violations'), A.violations + (d2?` / ${B.violations}`:''), '#f59e0b',
      d2 && B.violations ? Math.round(((A.violations-B.violations)/B.violations)*100) : null)}
    ${kpiCard('📊', t('kpi_avg'), (list1.length?round1(A.orders/list1.length):0) +

  </div>
  <div class="grid g2">
    <div class="card"><div class="card-head">📦 ${d2 ? t('t_compare') : t('t_orders_rep')}</div>
      <div class="card-body">${
        d2 ? chartBarGrouped(compareRows, '#94a3b8', db.settings.color, d1, d2)
           : renderChart(db.settings.chartTypes.orders || 'bar',
               reps.map(r=>({label:r.name, value:sum(list1.filter(x=>x.repId===r.id),'orders')})),
               db.settings.color,

    <div class="card"><div class="card-head">⭐ ${t('driver_rating_title')}</div>
      <div class="card-body">${
        (()=>{
          const dist = {A:0,B:0,C:0,D:0,E:0,F:0};
          [...list1, ...list2].forEach(r=>{ const l = r.rating || calcRating(r.orders); if(dist[l]!==undefined) dist[l]++; });
          return chartDonut(
            ['A','B','C','D','E','F'].map(l=>({label:l, value:dist[l]})),
            ['#10b981','#3b82f6','#8b5cf6','#f59e0b','#f97316','#ef4444'], true);
        })()
      }</div></div>
  </div>
  <div class="card">
    <div class="card-head">📋 ${t('t_daily')} — ${d1} ${d2?' | '+d2:''}</div>
    ${mode==='table' ? tableHTML : `<div class="card-body">${cardsHTML}</div>`}
  </div>`;
}
function agg(list){
  return {
    count:list.length, orders: sum(list,'orders'), hours: round1(sum(list,'hours')),
    violations: sum(list,'violations'), accepted: sum(list,'accepted'), rejected: sum(list,'rejected')
  };
}
function afterDaily(){
  $('#d1')?.addEventListener('change', e=>{ state.daily.d1 = e.target.value; render(); });
  $('#d2')?.addEventListener('change', e=>{ state.daily.d2 = e.target.value; render(); });
  $('#applyDates')?.addEventListener('click', ()=>{
    state.daily.d1 = $('#d1').value || todayStr();
    state.daily.d2 = $('#d2').value || '';
    render(); toast(t('msg_updated'),'ok');
  });
  $('#clearD2')?.addEventListener('click', ()=>{ state.daily.d2=''; render(); });

function bindViewToggles(){
  $$('[data-view]').forEach(b=> b.onclick = ()=>{

function bindChartTypeButtons(){
  $$('[data-ct]').forEach(b=> b.onclick = ()=>{

    saveDB(); render();

}
function bindReportActions(){
  if(!canModify()) return;
  $$('[data-edit-report]').forEach(b=> b.onclick = ()=> reportModal(b.dataset.editReport));
  $$('[data-del-report]').forEach(b=> b.onclick = ()=>{
    if(!confirm(t('msg_confirm_del'))) return;
    const rec = db.reports.find(x=>x.id===b.dataset.delReport);
    db.reports = db.reports.filter(x=>x.id!==b.dataset.delReport);
    saveDB(); render(); toast(t('msg_deleted'),'ok');
    if(rec) addNotif('حذف تقرير', `${repName(rec.repId)} — ${rec.date}`, 'err');
    if(isCloudReady()) pushToCloud(true);
  });
}

/* ★ نموذج الإضافة الجماعية - جدول بكل السائقين */
function dailyReportModal(){
  if(!state.user) return;
  const reps = visibleReps();
  if(!reps.length){
    toast(isSupervisor()?'لا يوجد سائقون مسندون إليك':'أضف سائقاً أولاً','warn');
    return;
  }
  const initDate = state.daily.d1 || todayStr();

  const buildRows = (dateStr)=> reps.map(r=>{
    const existing = db.reports.find(x=> x.repId===r.id && x.date===dateStr);
    return `<tr data-rep-row="${r.id}">
      <td>
        <div class="rep-name">${esc(r.name)}</div>
        <div class="rep-sub">${esc(supName(r.supervisorId))} · ${esc(r.code)}</div>
      </td>
      <td><input type="number" min="0" step="1" data-f="orders" value="${existing?existing.orders:''}" placeholder="0"></td>
      <td><input type="number" min="0" step="0.1" data-f="hours" value="${existing?existing.hours:''}" placeholder="0"></td>
      <td><input type="number" min="0" step="1" data-f="accepted" value="${existing?existing.accepted:0}"></td>
      <td><input type="number" min="0" step="1" data-f="rejected" value="${existing?existing.rejected:0}"></td>
      <td><span class="chip amber" data-f="total">${existing?existing.violations:0}</span></td>
      <td><input type="text" data-f="notes" value="${esc(existing?.notes||'')}" placeholder="${t('fld_notes')}"></td>
    </tr>`;
  }).join('');

  const buildBody = (dateStr)=> `
    <form id="drForm" novalidate>
      <div class="field" style="margin-bottom:16px;max-width:280px">
        <label>${t('fld_date')} <span class="req">*</span></label>
        <input type="date" id="bulkDate" required value="${dateStr}">
      </div>
      <div class="tbl-wrap" style="max-height:52vh;overflow-y:auto">
        <table class="bulk-table">
          <thead><tr>
            <th>${t('fld_rep')}</th>
            <th>${t('fld_orders')}</th>
            <th>${t('fld_hours')}</th>
            <th>${t('fld_accepted')}</th>
            <th>${t('fld_rejected')}</th>
            <th>${t('kpi_violations')}</th>
            <th>${t('fld_notes')}</th>
          </tr></thead>
          <tbody id="bulkRows">${buildRows(dateStr)}</tbody>
        </table>
      </div>
      <div class="small muted" style="margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--border)">
        💡 ${t('t_bulk_hint')}
      </div>
      <div id="drErr" class="err" style="display:none;margin-top:10px"></div>
    </form>`;

  openModal({
    title: `➕ ${t('t_bulk_daily')} ${isSupervisor()?`· ${t('my_reps')}`:''}`,
    body: buildBody(initDate),
    wide: true,
    submitText: t('btn_save'),
    onMount(root){
      const dateInp = root.querySelector('#bulkDate');
      const rowsContainer = root.querySelector('#bulkRows');
      const recompute = ()=>{
        rowsContainer.querySelectorAll('[data-rep-row]').forEach(row=>{
          const acc = num(row.querySelector('[data-f=accepted]').value);
          const rej = num(row.querySelector('[data-f=rejected]').value);
          row.querySelector('[data-f=total]').textContent = acc + rej;
        });
      };
      rowsContainer.addEventListener('input', e=>{
        if(e.target.dataset.f === 'accepted' || e.target.dataset.f === 'rejected') recompute();
      });
      dateInp.addEventListener('change', ()=>{
        const newDate = dateInp.value;
        if(!newDate) return;
        rowsContainer.innerHTML = buildRows(newDate);
        recompute();
      });
      recompute();
    },
    onSubmit(root){
      const date = root.querySelector('#bulkDate').value;
      const err = root.querySelector('#drErr');
      if(!date){ err.textContent = t('msg_required'); err.style.display='block'; return false; }

      let saved = 0;
      $$('[data-rep-row]', root).forEach(row=>{
        const repId = row.dataset.repRow;
        const ordersRaw = row.querySelector('[data-f=orders]').value;
        const hoursRaw = row.querySelector('[data-f=hours]').value;
        const accepted = num(row.querySelector('[data-f=accepted]').value);
        const rejected = num(row.querySelector('[data-f=rejected]').value);
        const notes = row.querySelector('[data-f=notes]').value.trim();

        const isEmpty = ordersRaw === '' && hoursRaw === '' && !accepted && !rejected && !notes;
        if(isEmpty) return;

        const orders = num(ordersRaw);
        const hours = num(hoursRaw);
        const violations = accepted + rejected; // ★ محسوب تلقائياً
        const rating = calcRating(orders);

        const existing = db.reports.find(x=> x.repId===repId && x.date===date);
        if(existing){
          Object.assign(existing, { orders, hours, violations, accepted, rejected, rating, notes: notes || '' });
        } else {
          db.reports.push({
            id: uid(), repId, date, orders, hours,
            startTime:'', endTime:'',
            violations, accepted, rejected, rating,
            notes: notes || '',
            createdAt: new Date().toISOString()
          });
        }
        saved++;
      });

      if(!saved){
        err.textContent = t('msg_bulk_empty'); err.style.display='block'; return false;
      }
      saveDB(); render();
      addNotif('تقرير يومي', `${saved} ${t('nav_reps')} — ${date}`, 'ok');
      toast(t('msg_bulk_saved').replace('{n}', saved).replace('{d}', date), 'ok');
      if(isCloudReady()) pushToCloud(true);
      return true;
    }
  });
}

/* نموذج تعديل تقرير فردي */
function reportModal(id){

  const reps = visibleReps();
  if(!reps.length){ toast('أضف سائقاً أولاً','warn'); return; }

  const body = `

          ${reps.map(r=>`<option value="${r.id}" ${rec&&rec.repId===r.id?'selected':''}>${esc(r.name)} — ${esc(supName(r.supervisorId))}</option>`).join('')}</select></div>
      <div class="field"><label>${t('fld_date')} <span class="req">*</span></label>
        <input type="date" name="date" required value="${rec?rec.date:(state.daily.d1||todayStr())}"></div>
      <div class="field"><label>${t('fld_orders')} <span class="req">*</span></label>
        <input type="number" name="orders" min="0" step="1" required value="${rec?rec.orders:''}" placeholder="0"></div>
      <div class="field"><label>${t('fld_hours')} <span class="req">*</span></label>
        <input type="number" name="hours" min="0" step="0.1" required value="${rec?rec.hours:''}" placeholder="0.0"></div>
      <div class="field"><label>${t('fld_start')} ${t('fld_optional')}</label>
        <input type="time" name="startTime" value="${rec?rec.startTime||'':''}"></div>
      <div class="field"><label>${t('fld_end')} ${t('fld_optional')}</label>
        <input type="time" name="endTime" value="${rec?rec.endTime||'':''}"></div>
      <div class="field"><label>${t('fld_rating')} (A-F)</label>
        <div style="display:flex;align-items:center;gap:8px;padding:6px 0">
          <span class="chip grade ${rec?rec.rating||calcRating(rec.orders):calcRating(0)}" id="ratingChip">${rec?rec.rating||calcRating(rec.orders):calcRating(0)}</span>
        </div></div>
      <div class="field"><label>${t('fld_accepted')} <span class="req">*</span></label>
        <input type="number" name="accepted" min="0" step="1" required value="${rec?rec.accepted:0}" id="accInp"></div>
      <div class="field"><label>${t('fld_rejected')} <span class="req">*</span></label>
        <input type="number" name="rejected" min="0" step="1" required value="${rec?rec.rejected:0}" id="rejInp"></div>
      <div class="field"><label>${t('kpi_violations')} <span class="small muted">${t('fld_auto_total')}</span></label>
        <input type="number" name="violations" readonly value="${rec?rec.violations:0}" id="violOut"></div>
      <div class="field" style="grid-column:1/-1"><label>${t('fld_notes')}</label>
        <textarea name="notes" rows="2">${esc(rec?.notes||'')}</textarea></div>
      <div id="rErr" class="err" style="grid-column:1/-1;display:none"></div>
    </form>`;
  openModal({
    title: rec ? `${t('btn_edit')} — ${t('t_daily')}` : `${t('btn_add')} — ${t('t_daily')}`,
    body,
    onMount(root){
      const form = $('#rForm', root);
      const ordersInp = form.orders;
      const accInp = form.accepted;
      const rejInp = form.rejected;
      const violOut = $('#violOut', root);
      const upd = ()=>{
        violOut.value = num(accInp.value) + num(rejInp.value);
        const l = calcRating(num(ordersInp.value));
        const chip = $('#ratingChip', root);
        if(chip){ chip.className = 'chip grade ' + l; chip.textContent = l; }
      };
      ordersInp.addEventListener('input', upd);
      accInp.addEventListener('input', upd);
      rejInp.addEventListener('input', upd);
      upd();
    },
    onSubmit(root){
      const form = $('#rForm', root), err = $('#rErr', root);
      const data = Object.fromEntries(new FormData(form));
      const req = ['repId','date','orders','hours','accepted','rejected'];
      if(req.some(k=> data[k]==='' || data[k]==null)){
        err.textContent = t('msg_required'); err.style.display='block'; return false;
      }
      if(isSupervisor() && !isRepVisible(data.repId)){
        err.textContent = t('msg_no_perm'); err.style.display='block'; return false;
      }
      const a = num(data.accepted), rj = num(data.rejected);
      const v = a + rj;
      const hours = num(data.hours);
      const rating = calcRating(num(data.orders));
      if(rec){
        if(!canModify()){ err.textContent = t('msg_no_perm'); err.style.display='block'; return false; }
        Object.assign(rec, {
          repId:data.repId, date:data.date, orders:num(data.orders),
          startTime:data.startTime||'', endTime:data.endTime||'', hours,
          violations:v, accepted:a, rejected:rj, rating, notes:data.notes||''
        });
        addNotif('تعديل تقرير', `${repName(data.repId)} — ${data.date}`, 'warn');
        toast(t('msg_updated'),'ok');
      } else {
        db.reports.push({
          id:uid(), repId:data.repId, date:data.date, orders:num(data.orders),
          startTime:data.startTime||'', endTime:data.endTime||'', hours,
          violations:v, accepted:a, rejected:rj, rating, notes:data.notes||'',
          createdAt:new Date().toISOString()
        });
        addNotif('تقرير جديد', `${repName(data.repId)} — ${data.orders} طلب (${rating})`, 'ok');
        toast(t('msg_saved'),'ok');
      }
      saveDB(); render();
      if(isCloudReady()) pushToCloud(true);
      return true;
    }
  });
}

    <div class="field"><label>${t('fld_name')} <span class="req">*</span></label>
      <input name="name" required value="${esc(rec?.name||'')}"></div>
    <div class="field"><label>${t('fld_phone')} <span class="req">*</span></label>

    title: rec ? `${t('btn_edit')} — ${t('nav_supervisors')}` : `${t('btn_add')} — ${t('nav_supervisors')}`,
    body,
    onSubmit(root){
      const form = $('#supForm', root), err = $('#supErr', root);
      const d = Object.fromEntries(new FormData(form));
      if(!d.name || !d.phone || !d.code || !d.email){
        err.textContent = t('msg_required'); err.style.display='block'; return false;
      }
      const perms = NAV.filter(n=> d['perm_'+n.id]).map(n=>n.id);
      if(rec){
        const patch = {name:d.name, phone:d.phone, code:d.code, email:d.email, permissions:perms};
        if(d.password) patch.password = hashPwd(d.password);
        Object.assign(rec, patch);
        addNotif('تعديل مشرف', d.name, 'warn'); toast(t('msg_updated'),'ok');

      saveDB(); render();
      if(isCloudReady()) pushToCloud(true);
      return true;
    }
  });

function assignModal(supId){
  if(!isOwner()){ toast(t('msg_no_perm'),'warn'); return; }
  const sup = getSup(supId);
  if(!sup) return;
  const body = `
    <div class="small muted" style="margin-bottom:12px">اختر السائقين التابعين للمشرف: <b>${esc(sup.name)}</b></div>
    <div class="checkbox-list" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));max-height:340px">
      ${db.reps.map(r=>`<label class="perm-check">
        <input type="checkbox" data-asg="${r.id}" ${r.supervisorId===supId?'checked':''}>
        ${esc(r.name)} <span class="muted small">(${esc(r.region)})</span>
      </label>`).join('') || `<div class="empty">${t('no_data')}</div>`}
    </div>`;
  openModal({
    title:`🔗 ${t('nav_reps')} ← ${esc(sup.name)}`,
    body, submitText:t('btn_save'),
    onSubmit(root){
      let changed = 0;
      $$('[data-asg]', root).forEach(cb=>{
        const r = getRep(cb.dataset.asg);
        if(!r) return;
        if(cb.checked && r.supervisorId !== supId){ r.supervisorId = supId; changed++; }
        else if(!cb.checked && r.supervisorId===supId){ r.supervisorId = ''; changed++; }
      });
      saveDB(); render();
      if(changed) addNotif('إسناد سائقين', `${changed} سائق → ${sup.name}`, 'info');
      toast(t('msg_updated'),'ok');
      if(isCloudReady() && changed) pushToCloud(true);
      return true;
    }
  });
}

function statusChip(s){
  const map = { available:['green','st_available'], in_use:['blue','st_active'],
                maintenance:['amber','st_maintenance'], broken:['red','st_broken'] };
  const [c,k] = map[s] || ['gray','st_inactive'];
  return `<span class="chip ${c}">${t(k)}</span>`;
}
function currentKm(carId){
  const us = db.usage.filter(u=>u.carId===carId);
  if(!us.length) return 0;
  const last = us.sort((a,b)=> (b.startDate||'').localeCompare(a.startDate||''))[0];
  return num(last.endKm || last.startKm);
}

function computeGoalActuals(period){
  const start = period==='today' ? todayStr() : period==='week' ? weekStart() : monthStart();
  const reports = visibleReports();
  const reps = visibleReps();
  const rs = reports.filter(r=> r.date >= start);
  const daysCount = Math.max(1, Math.ceil((Date.now()-new Date(start).getTime())/864e5));
  return {
    orders: sum(rs,'orders'),
    hours: round1(sum(rs,'hours')),
    violations: sum(rs,'violations'),
    acceptRate: sum(rs,'violations') ? Math.round((sum(rs,'accepted')/sum(rs,'violations'))*100) : 100,
    perRepDaily: reps.length ? round1(sum(rs,'orders') / reps.length / daysCount) : 0,
    reps: reps.length,
    reportsCount: rs.length
  };
}
function goalCard({icon,label,target,actual,unit='',inverse=false}){
  if(!target){ return `<div class="goal-card" style="opacity:.7">
    <div class="goal-title">${icon} ${label}</div>
    <div class="small muted">${t('goals_no_goal')}</div>
  </div>`; }
  const pct = target ? Math.round((actual/target)*100) : 0;
  const exceed = inverse ? (actual <= target) : (actual >= target);
  const status = exceed ? t('goals_exceeded') : (pct >= 70 ? t('goals_on_track') : t('goals_behind'));
  const remaining = Math.max(0, target - actual);
  return `<div class="goal-card">
    <div class="goal-title">${icon} ${label}</div>
    <div class="goal-values">
      <div><div class="gv-l">${t('goals_actual')}</div><div class="gv-v">${actual}${unit}</div></div>
      <div style="text-align:center"><div class="gv-l">${t('goals_target')}</div><div class="gv-v">${target}${unit}</div></div>
      <div style="text-align:end"><div class="gv-l">${t('goals_remaining')}</div><div class="gv-v">${inverse? Math.max(0,actual-target) : remaining}${unit}</div></div>
    </div>
    <div class="goal-bar ${exceed?'exceed':''}"><i style="width:${Math.min(100, pct)}%"></i></div>
    <div class="goal-pct" style="color:${exceed?'#047857':pct>=70?'#1d4ed8':'#b45309'}">${pct}% · ${status}</div>
  </div>`;
}
function viewGoals(){
  const g = db.goals || emptyDB().goals;
  const currentPeriod = state.goalPeriod || 'month';
  const actuals = computeGoalActuals(currentPeriod);
  const periods = [['month', t('goals_period_month')],['week', t('goals_period_week')],['today', t('goals_period_today')]];
  let goalScore = 0, goalsCount = 0;
  const evaluate = (target, actual, inverse=false)=>{
    if(!target) return;
    goalsCount++;
    const pct = inverse ? Math.min(100, (target/Math.max(actual,1))*100) : Math.min(100, (actual/target)*100);
    goalScore += pct;
  };
  evaluate(g.monthlyOrders, actuals.orders);
  evaluate(g.monthlyHours, actuals.hours);
  evaluate(g.maxViolations, actuals.violations, true);
  evaluate(g.minAcceptRate, actuals.acceptRate);
  evaluate(g.perRepDaily, actuals.perRepDaily);
  const overallGoalScore = goalsCount ? Math.round(goalScore/goalsCount) : 0;
  const sups = isOwner() ? db.supervisors : db.supervisors.filter(s=>s.id===state.user.id);
  const supGoals = sups.map(s=>{
    const reps = db.reps.filter(r=>r.supervisorId===s.id);
    const start = currentPeriod==='today' ? todayStr() : currentPeriod==='week' ? weekStart() : monthStart();
    const rs = visibleReports().filter(x=> x.date >= start && reps.some(r=>r.id===x.repId));
    const orders = sum(rs,'orders');
    const target = g.monthlyOrders && db.reps.length ? Math.round(g.monthlyOrders * (reps.length/db.reps.length)) : 0;
    return { name:s.name, orders, target, pct: target ? Math.round((orders/target)*100) : 0 };
  }).filter(x=>x.target).sort((a,b)=>b.pct-a.pct);

  return `
  <div class="grid g4">
    ${kpiCard('🎯', t('goals_overall'), overallGoalScore + '%', '#6366f1')}
    ${kpiCard('📦', t('goals_actual')+' '+t('kpi_orders'), actuals.orders, '#10b981')}
    ${kpiCard('⏱️', t('goals_actual')+' '+t('kpi_hours'), actuals.hours + 'h', '#06b6d4')}
    ${kpiCard('⚠️', t('goals_actual')+' '+t('kpi_violations'), actuals.violations, '#f59e0b')}
  </div>
  <div class="card">
    <div class="card-head">🎯 ${t('goals_title')} <span class="spacer"></span>
      ${periods.map(([id,lb])=>`<button class="btn btn-sm ${currentPeriod===id?'btn-primary':''}" data-period="${id}">${lb}</button>`).join('')}
      ${isOwner()?`<button class="btn btn-sm btn-primary" id="editGoals">✏️ ${t('goals_save')}</button>`:''}
    </div>
    <div class="card-body">
      <div class="small muted" style="margin-bottom:14px">${t('goals_desc')}</div>
      <div class="grid g3">
        ${goalCard({icon:'📦', label:t('goals_monthly_orders'), target:g.monthlyOrders, actual:actuals.orders})}
        ${goalCard({icon:'⏱️', label:t('goals_monthly_hours'), target:g.monthlyHours, actual:actuals.hours, unit:'h'})}
        ${goalCard({icon:'⚠️', label:t('goals_max_violations'), target:g.maxViolations, actual:actuals.violations, inverse:true})}
        ${goalCard({icon:'✅', label:t('goals_min_accept_rate'), target:g.minAcceptRate, actual:actuals.acceptRate, unit:'%'})}
        ${goalCard({icon:'🚗', label:t('goals_per_rep_daily'), target:g.perRepDaily, actual:actuals.perRepDaily})}
      </div>
    </div>
  </div>
  ${supGoals.length ? `<div class="card">
    <div class="card-head">👔 ${t('t_sup_perf')} — ${t('goals_title')}</div>
    <div class="card-body">
      ${supGoals.map(s=>`
        <div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px">
            <b>${esc(s.name)}</b>
            <span class="muted">${s.orders} / ${s.target} · ${s.pct}%</span>
          </div>
          <div class="goal-bar ${s.pct>=100?'exceed':''}"><i style="width:${Math.min(100,s.pct)}%"></i></div>
        </div>`).join('')}
    </div>
  </div>` : ''}`;
}

function toolAction(act){
  switch(act){
    case 'lang':
      state.lang = state.lang==='ar' ? 'en' : 'ar';
      render(); toast(state.lang==='ar'?'تم التبديل إلى العربية':'Switched to English','ok');
      break;
    case 'sync':
      if(!isCloudReady()){ settingsModal(); return; }
      pushToCloud().then(ok => { if(ok) render(); }); break;
    case 'share': copyShareLink(); break;
    case 'export': exportJSON(); break;
    case 'import':
      if(!canModify()){ toast(t('msg_no_perm'),'warn'); return; }
      openImportDialog(); break;
    case 'reset':
      if(!canModify()){ toast(t('msg_no_perm'),'warn'); return; }
      if(confirm(t('msg_confirm_reset'))){
        db = seedDB(); saveDB(); state.section='dashboard'; render();
        toast(t('msg_reset'),'ok');
        if(isCloudReady()) pushToCloud(true);
      } break;
    case 'refresh':
      if(isCloudReady()){ pullFromCloud().then(ok => { if(ok) render(); }); }
      else { db = loadDB() || db; applySettings(); render(); toast(t('msg_updated'),'ok'); }
      break;
    case 'settings': settingsModal(); break;
  }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `drivers-performance-${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast(t('btn_export')+' ✓','ok');
}
function openImportDialog(){
  if(!canModify()){ toast(t('msg_no_perm'),'warn'); return; }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const data = JSON.parse(rd.result);
        db = normalizeDB(data);
        cleanupRelations(); saveDB(); render();
        toast(t('msg_imported'),'ok');
        if(isCloudReady()) pushToCloud(true);
      }catch(err){ toast(t('msg_import_err'),'err'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
