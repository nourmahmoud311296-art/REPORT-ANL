      <div class="field"><label>${t('fld_end_km_report')}</label>
        <input type="number" name="endKm" min="0" step="1" value="${endKmVal}" id="eKmInp" placeholder="0"></div>
      <div class="field"><label>${t('fld_total_km')} <span class="small muted">${t('fld_auto_total')}</span></label>
        <input type="number" name="totalKm" readonly value="${rec && rec.totalKm!=='' ? num(rec.totalKm) : ''}" id="tKmOut"></div>
      <div class="field"><label>${t('fld_start')} ${t('fld_optional')}</label>
        <input type="time" name="startTime" value="${rec?rec.startTime||'':''}"></div>
      <div class="field"><label>${t('fld_end')} ${t('fld_optional')}</label>
        <input type="time" name="endTime" value="${rec?rec.endTime||'':''}"></div>
      <div class="field"><label>${t('fld_rating')} (A-F)</label>
        <div style="display:flex;align-items:center;gap:8px;padding:6px 0">
          <span class="chip grade ${rec?rec.rating||calcRating(rec.orders):calcRating(0)}" id="ratingChip">${rec?rec.rating||calcRating(rec.orders):calcRating(0)}</span>
        </div></div>
      <div class="field"><label>${t('fld_accepted')} <span class="req">*</span></label>
        <input type="number" name="accepted" min="0" step="1" required value="${rec?rec.accepted:0}" id="accInp"></div>
      <div class="field"><label>${t('fld_rejected')} <span class="req">*</span></label>
        <input type="number" name="rejected" min="0" step="1" required value="${rec?rec.rejected:0}" id="rejInp"></div>
      <div class="field"><label>${t('kpi_violations')} <span class="small muted">${t('fld_auto_total')}</span></label>
        <input type="number" name="violations" readonly value="${rec?rec.violations:0}" id="violOut"></div>
      <div class="field" style="grid-column:1/-1"><label>${t('fld_notes')}</label>
        <textarea name="notes" rows="2">${esc(rec?.notes||'')}</textarea></div>
      <div id="rErr" class="err" style="grid-column:1/-1;display:none"></div>
    </form>`;
  openModal({
    title: rec ? `${t('btn_edit')} — ${t('t_daily')}` : `${t('btn_create_report')}`,
    body,
    onMount(root){
      bindQuickAdd(root, () => reportModal(id));
      const form = $('#rForm', root);
      if(!form) return;
      const ordersInp = form.orders;
      const accInp = form.accepted;
      const rejInp = form.rejected;
      const sKm = $('#sKmInp', root);
      const eKm = $('#eKmInp', root);
      const tKm = $('#tKmOut', root);
      const violOut = $('#violOut', root);
      const sysRejInp = $('#sysRejInp', root);
      const drvRejInp = $('#drvRejInp', root);
      const totalOrdOut = $('#totalOrdOut', root);
      const delivRateOut = $('#delivRateOut', root);
      const upd = ()=>{
        violOut.value = num(accInp.value) + num(rejInp.value);
        const l = calcRating(num(ordersInp.value));
        const chip = $('#ratingChip', root);
        if(chip){ chip.className = 'chip grade ' + l; chip.textContent = l; }
        if(sKm.value !== '' && eKm.value !== ''){
          tKm.value = Math.max(0, num(eKm.value) - num(sKm.value));
        } else { tKm.value = ''; }
        const delivered = num(ordersInp.value);
        const sysR = num(sysRejInp.value);
        const drvR = num(drvRejInp.value);
        const total = delivered + sysR + drvR;
        const rate = total > 0 ? Math.round((delivered/total)*100) : 0;
        totalOrdOut.value = total;
        delivRateOut.value = rate + '%';
      };
      ordersInp.addEventListener('input', upd);
      accInp.addEventListener('input', upd);
      rejInp.addEventListener('input', upd);
      sKm.addEventListener('input', upd);
      eKm.addEventListener('input', upd);
      sysRejInp.addEventListener('input', upd);
      drvRejInp.addEventListener('input', upd);
      upd();
    },
    onSubmit(root){
      const form = $('#rForm', root), err = $('#rErr', root);
      if(!reps.length){ err.textContent = t('msg_no_reps'); err.style.display='block'; return false; }
      const data = Object.fromEntries(new FormData(form));
      const req = ['repId','date','orders','hours','accepted','rejected'];
      if(req.some(k=> data[k]==='' || data[k]==null)){
        err.textContent = t('msg_required'); err.style.display='block'; return false;
      }
      if(isSupervisor() && !isRepVisible(data.repId)){
        err.textContent = t('msg_no_perm'); err.style.display='block'; return false;
      }
      const a = num(data.accepted), rj = num(data.rejected);
      const v = a + rj;
      const hours = num(data.hours);
      const rating = calcRating(num(data.orders));
      const startKm = data.startKm === '' ? '' : num(data.startKm);
      const endKm = data.endKm === '' ? '' : num(data.endKm);
      const totalKm = (startKm !== '' && endKm !== '') ? Math.max(0, endKm - startKm) : '';
      const systemRejected = num(data.systemRejected);
      const driverRejected = num(data.driverRejected);
      const totalOrders = num(data.orders) + systemRejected + driverRejected;
      const deliveryRate = totalOrders > 0 ? Math.round((num(data.orders)/totalOrders)*100) : 0;
      const now = new Date().toISOString();
      if(rec){
        if(!canEditSection('daily')){ err.textContent = t('msg_no_perm'); err.style.display='block'; return false; }
        Object.assign(rec, {
          repId:data.repId, date:data.date, orders:num(data.orders),
          systemRejected, driverRejected, totalOrders, deliveryRate,
          startTime:data.startTime||'', endTime:data.endTime||'', hours,
          startKm, endKm, totalKm,
          violations:v, accepted:a, rejected:rj, rating, notes:data.notes||'',
          updatedAt: now, syncedAt: null
        });
        addNotif('تعديل تقرير', `${repName(data.repId)} — ${data.date}`, 'warn');
        toast(t('msg_updated'),'ok');
      } else {
        db.reports.push({
          id:uid(), repId:data.repId, date:data.date, orders:num(data.orders),
          systemRejected, driverRejected, totalOrders, deliveryRate,
          startTime:data.startTime||'', endTime:data.endTime||'', hours,
          startKm, endKm, totalKm,
          violations:v, accepted:a, rejected:rj, rating, notes:data.notes||'',
          createdAt: now, updatedAt: now, syncedAt: null
        });
        addNotif('تقرير جديد', `${repName(data.repId)} — ${data.orders} طلب (${rating})`, 'ok');
        toast(t('msg_saved_local'),'ok');
      }
      db.cars.forEach(c => checkOilForCar(c.id));
      saveDB(); render();
      // ✅ تحقق صريح من الوضع اليدوي
      const mode = (db.settings && db.settings.supervisorSyncMode) || 'auto';
      if(isCloudReady() && mode === 'auto'){
        pushToCloud(true).then(ok => {
          if(ok){
            const syncNow = new Date().toISOString();
            db.reports.forEach(r => { if(!r.syncedAt) r.syncedAt = syncNow; });
            saveDB();
            $$('[data-sync-chip]').forEach(el=>{
              el.className = 'chip green';
              el.textContent = '☁️ ' + t('msg_synced');
            });
            toast(t('msg_report_sent'), 'ok');
          }
        });
      } else if(isCloudReady() && mode === 'manual'){
        toast(t('msg_sync_manual_only'), 'warn');
      }
      return true;
    }
  });
}

  const cardsHTML = `

      ${rows.length ? rows.map(r=>`

function afterReps(){
  $('#repDayPicker')?.addEventListener('change', e=>{
    state.repsDay = e.target.value || todayStr();
    render();
  });
  $('#repTodayBtn')?.addEventListener('click', ()=>{
    state.repsDay = todayStr();
    render();
  });
  $('#addRep') && ($('#addRep').onclick = ()=> repModal());
  $('#repSearch') && ($('#repSearch').oninput = e=>{ state.repQuery = e.target.value; render();
    const el = $('#repSearch'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length);} });
  bindViewToggles();
  if(!canEditSection('reps')) return;
  $$('[data-edit-rep]').forEach(b=> b.onclick = ()=> repModal(b.dataset.editRep));
  $$('[data-del-rep]').forEach(b=> b.onclick = ()=>{
    if(!confirm(t('msg_confirm_del'))) return;
    const id = b.dataset.delRep, nm = repName(id);
    db.reps = db.reps.filter(r=>r.id!==id);
    cleanupRelations(); saveDB(); render();
    addNotif('حذف سائق', nm, 'err');
    toast(t('msg_deleted'),'ok');
    autoSyncAfterSave();
  });
}
function repModal(id){
  if(!canEditSection('reps')){ toast(t('msg_no_perm'),'warn'); return; }
  const rec = id ? getRep(id) : null;
  const appsList = getAppsList();
  const regionsList = getRegionsList();
  const body = `<form id="repForm" class="form-grid" novalidate>
    <div class="field"><label>${t('fld_name')} <span class="req">*</span></label>
      <input name="name" required value="${esc(rec?.name||'')}"></div>
    <div class="field"><label>${t('fld_phone')} <span class="req">*</span></label>
      <input name="phone" required dir="ltr" value="${esc(rec?.phone||'')}" placeholder="05XXXXXXXX"></div>
    <div class="field"><label>${t('fld_code')} <span class="req">*</span></label>
      <input name="code" required dir="ltr" value="${esc(rec?.code||'DR-'+String(1000+db.reps.length+1))}"></div>
    <div class="field"><label>${t('fld_app')} <span class="req">*</span></label>
      <select name="app" required>
        <option value="">${t('fld_none')}</option>
        ${appsList.map(v=>`<option value="${esc(v)}" ${rec&&rec.app===v?'selected':''}>${esc(v)}</option>`).join('')}
      </select></div>
    <div class="field" style="grid-column:1/-1">
      <label>${t('fld_car_assigned')} <span class="small muted">${t('fld_optional')}</span></label>
      ${db.cars.length ? `
      <input type="text" id="carSearchInput" placeholder="🔍 ${t('search_car')}" style="margin-bottom:8px">
      ${selectWithAdd({
        name:'carId', id:'carSelect', selected: rec?.carId,
        addType:'car', addLabel: t('add_car_quick'),
        options:[{value:'', label:t('fld_none')},
          ...db.cars.map(c=>({
            value:c.id,
            label:`${c.brand} ${c.model} — ${c.plate}${
              c.assignedRepId && (!rec || c.assignedRepId!==rec.id) ? ' (مُسندة لسائق آخر)' : ''}`,
            dataSearch:(c.brand+' '+c.model+' '+c.plate).toLowerCase()
          }))]
      })}` : emptySelectHTML(t('msg_no_cars'),'car',t('add_car_quick'))}
    </div>
    <div class="field"><label>${t('fld_supervisor')} <span class="req">*</span></label>
      ${db.supervisors.length ? selectWithAdd({
        name:'supervisorId', required:true, selected: rec?.supervisorId,
        addType:'sup', addLabel: t('add_sup_quick'),
        options:[{value:'', label:t('fld_none')},
          ...db.supervisors.map(s=>({value:s.id, label:s.name}))]
      }) : emptySelectHTML(t('msg_no_sups'),'sup',t('add_sup_quick'))}
    </div>
    <div class="field"><label>${t('fld_region')} <span class="req">*</span></label>
      <input name="region" required list="regionsDatalist" value="${esc(rec?.region||'')}">
      <datalist id="regionsDatalist">
        ${regionsList.map(v=>`<option value="${esc(v)}"></option>`).join('')}
      </datalist>
    </div>
    <div class="field" style="grid-column:1/-1"><label>${t('fld_created')}</label>
      <input type="text" readonly dir="ltr" value="${rec?esc(rec.createdAt||''):new Date().toISOString()}"></div>
    <div id="repErr" class="err" style="grid-column:1/-1;display:none"></div>
  </form>`;
  openModal({
    title: rec ? `${t('btn_edit')} — ${t('nav_reps')}` : `${t('btn_add')} — ${t('nav_reps')}`,
    body, tableId:'reps', record: rec,
    onMount(root){
      bindQuickAdd(root, () => repModal(id));
      const search = root.querySelector('#carSearchInput');
      const sel = root.querySelector('#carSelect');
      if(search && sel){
        const options = [...sel.options];
        search.addEventListener('input', ()=>{
          const q = search.value.trim().toLowerCase();
          options.forEach(op=>{
            if(op.value === '') return;
            const match = !q || (op.dataset.search||'').includes(q);
            op.style.display = match ? '' : 'none';
          });
          const cur = options.find(o=>o.value===sel.value);
          if(cur && cur.style.display==='none' && cur.value) cur.style.display = '';
        });
      }
    },
    onSubmit(root){
      const form = $('#repForm', root), err = $('#repErr', root);
      const d = Object.fromEntries(new FormData(form));
      if(!d.name || !d.phone || !d.code || !d.app || !d.supervisorId || !d.region){
        err.textContent = t('msg_required'); err.style.display='block'; return false;
      }
      const car = d.carId ? getCar(d.carId) : null;
      const payload = {
        name:d.name, phone:d.phone, code:d.code, app:d.app,
        plate: car ? car.plate : (rec?.plate||''),
        startKm: rec ? rec.startKm : 0,
        carId: d.carId || '',
        supervisorId:d.supervisorId, region:d.region,
        custom: readCustomValues(root),
        updatedAt: new Date().toISOString()
      };
      if(rec && rec.carId && rec.carId !== payload.carId){
        const oldCar = getCar(rec.carId);
        if(oldCar && oldCar.assignedRepId === rec.id) oldCar.assignedRepId = '';
      }
      if(rec){
        Object.assign(rec, payload);
        if(payload.carId){
          const newCar = getCar(payload.carId);
          if(newCar){
            if(newCar.assignedRepId && newCar.assignedRepId !== rec.id){
              const oldRep = getRep(newCar.assignedRepId);
              if(oldRep) oldRep.carId = '';
            }
            newCar.assignedRepId = rec.id;
          }
        }
        addNotif('تعديل سائق', d.name, 'warn'); toast(t('msg_updated'),'ok');
      } else {
        const newRep = {
          id:uid(), ...payload, status:'active',
          createdAt: new Date().toISOString()
        };
        db.reps.push(newRep);
        if(payload.carId){
          const newCar = getCar(payload.carId);
          if(newCar){
            if(newCar.assignedRepId && newCar.assignedRepId !== newRep.id){
              const oldRep = getRep(newCar.assignedRepId);
              if(oldRep){ oldRep.carId=''; }
            }
            newCar.assignedRepId = newRep.id;
          }
        }
        addNotif('سائق جديد', d.name, 'ok'); toast(t('msg_saved'),'ok');
      }
      saveDB(); render();
      autoSyncAfterSave();
      return true;
    }
  });
}

    if(!isOwner()) return '<span class="small muted">—</span>';

      <button class="btn btn-ghost btn-sm" data-assign="${s.id}" title="إسناد السائقين">🔗</button>
      <button class="btn btn-ghost btn-sm" data-edit-sup="${s.id}">✏️</button>
      <button class="btn btn-ghost btn-sm" data-del-sup="${s.id}">🗑️</button>
    </div>`;
  };
  const weekStartStr = addDaysStr(todayStr(), -6);
  const prevWeekStartStr = addDaysStr(todayStr(), -13);
  const prevWeekEndStr = addDaysStr(todayStr(), -7);
  const weekSup = (supId)=>{
    const reps = db.reps.filter(r=>r.supervisorId===supId);
    const rs = db.reports.filter(x=> reps.some(r=>r.id===x.repId) && x.date>=weekStartStr);
    return { orders: sum(rs,'orders'), hours: round1(sum(rs,'hours')) };
  };
  const prevWeekSup = (supId)=>{
    const reps = db.reps.filter(r=>r.supervisorId===supId);
    const rs = db.reports.filter(x=> reps.some(r=>r.id===x.repId) && x.date>=prevWeekStartStr && x.date<=prevWeekEndStr);
    return { orders: sum(rs,'orders'), hours: round1(sum(rs,'hours')) };
  };
  const permChips = (s)=>{
    const p = s.permissions || [];
    const chips = [];
    PERM_TREE.forEach(sec=>{
      if(!permHasView(p, sec.id)) return;
      const hasE = permHasEdit(p, sec.id);
      chips.push(`<span class="chip ${hasE?'amber':'violet'}" style="margin:2px">${sec.icon} ${esc(t(sec.key))}${hasE?' · تعديل':' · عرض'}</span>`);
      if(!hasE && sec.branches && sec.branches.length){
        sec.branches.forEach(b=>{
          if(permHasView(p, sec.id, b.id) && permHasEdit(p, sec.id, b.id)){
            chips.push(`<span class="chip amber" style="margin:2px;font-size:10.5px">↳ ${esc(t(b.key))} · تعديل</span>`);
          }
        });
      }
    });
    return chips.length ? chips.join('') : '<span class="chip red">—</span>';
  };
  const tableHTML = `
    <div class="tbl-wrap" style="border:0"><table><thead><tr>
      <th>${t('fld_name')}</th><th>${t('fld_code')}</th>
      ${isOwner()?`<th>${t('fld_email')}</th>`:''}
      <th>${t('nav_reps')}</th><th>${t('fld_orders')} (7d)</th><th>${t('fld_hours')} (7d)</th>
      <th>${t('fld_permissions')}</th>
      ${customHeadHTML('supervisors')}
      <th></th>
    </tr></thead><tbody>
      ${sups.length ? sups.map(s=>{
        const reps = db.reps.filter(r=>r.supervisorId===s.id);
        const cw = weekSup(s.id);
        const pw = prevWeekSup(s.id);
        return `<tr>
          <td><b>${esc(s.name)}</b></td>
          <td><span class="chip gray">${esc(s.code)}</span></td>
          ${isOwner()?`<td>${credCell(s)}</td>`:''}
          <td><span class="chip blue">${reps.length}</span></td>
          <td><b>${cw.orders}</b> ${deltaChip(cw.orders, pw.orders)}</td>
          <td>${cw.hours} ${deltaChip(cw.hours, pw.hours)}</td>
          <td>${permChips(s)}</td>
          ${customCellsHTML('supervisors', s)}
          <td>${actionsCell(s)}</td>
        </tr>`;
      }).join('') : emptyRow((isOwner()?8:7)+customCols('supervisors').length)}
    </tbody></table></div>`;
  const cardsHTML = `
    <div class="cards-grid">
      ${sups.length ? sups.map(s=>{
        const reps = db.reps.filter(r=>r.supervisorId===s.id);
        const cw = weekSup(s.id);
        const pw = prevWeekSup(s.id);
        return `<div class="item-card">
          <div class="ic-header">
            <div class="ic-avatar">${esc((s.name||'?').charAt(0))}</div>
            <div style="flex:1;min-width:0">
              <div class="ic-name">${esc(s.name)}</div>
              <div class="ic-sub">${esc(s.code)}</div>
            </div>
          </div>
          <div class="ic-rows">
            ${isOwner()?`<div><span class="k">${t('fld_email')}</span><span class="v" style="font-size:11px">${credCell(s)}</span></div>`:''}
            <div><span class="k">${t('nav_reps')}</span><span class="v">${reps.length}</span></div>
            <div><span class="k">${t('fld_orders')} (7d)</span><span class="v">${cw.orders} ${deltaChip(cw.orders, pw.orders)}</span></div>
            <div><span class="k">${t('fld_hours')} (7d)</span><span class="v">${cw.hours} ${deltaChip(cw.hours, pw.hours)}</span></div>
            ${customCardRows('supervisors', s)}
          </div>
          ${isOwner()?`<div class="ic-actions">
            <button class="btn btn-ghost btn-sm" data-assign="${s.id}" title="إسناد السائقين">🔗</button>
            <button class="btn btn-ghost btn-sm" data-edit-sup="${s.id}">✏️</button>
            <button class="btn btn-ghost btn-sm" data-del-sup="${s.id}">🗑️</button>
          </div>`:''}
        </div>`;
      }).join('') : `<div class="empty" style="grid-column:1/-1">${t('no_data')}</div>`}
    </div>`;
  const assignBox = isOwner() ? `
  <div class="card">
    <div class="card-head">🔗 ${t('nav_reps')} ← ${t('fld_supervisor')}</div>
    <div class="card-body grid g3">
      ${db.reps.map(r=>`
        <div class="card" style="box-shadow:none;padding:12px;display:flex;gap:10px;align-items:center;background:var(--bg-2)">
          <div style="flex:1;min-width:0">

            <div class="small muted">${esc(r.region)}</div>

            <option value="">${t('fld_none')}</option>
            ${db.supervisors.map(s=>`<option value="${s.id}" ${r.supervisorId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
          </select>
        </div>`).join('') || `<div class="empty">${t('no_data')}</div>`}
    </div>
  </div>` : '';
  return `
  <div class="card">
    <div class="card-head">👔 ${t('t_sups')} <span class="spacer"></span>
      ${toggleHTML}

        <button data-view="supervisors:table" class="${mode==='table'?'active':''}">📋 ${t('view_table')}</button>
        <button data-view="supervisors:cards" class="${mode==='cards'?'active':''}">🎴 ${t('view_cards')}</button>

      ${isOwner()?`<button class="btn btn-sm" id="permBtn2">🛡️ ${t('fld_permissions')}</button>`:''}

    </div>
    ${mode==='table' ? tableHTML : `<div class="card-body">${cardsHTML}</div>`}
  </div>
  ${assignBox}`;
}
function afterSupervisors(){
  bindViewToggles();
  $('#toggleCreds') && ($('#toggleCreds').onclick = ()=>{
    db.settings.showCredentials = !db.settings.showCredentials;
    saveDB(); render();
    toast(db.settings.showCredentials?t('msg_creds_shown'):t('msg_creds_hidden'),'ok');
  });
  $('#addSup') && ($('#addSup').onclick = ()=> supModal());
  $('#permBtn2') && ($('#permBtn2').onclick = ()=> permModal());
  if(!isOwner()) return;
  $$('[data-edit-sup]').forEach(b=> b.onclick = ()=> supModal(b.dataset.editSup));
  $$('[data-del-sup]').forEach(b=> b.onclick = ()=>{
    if(!confirm(t('msg_confirm_del'))) return;
    const s = getSup(b.dataset.delSup);
    db.supervisors = db.supervisors.filter(x=>x.id!==b.dataset.delSup);
    cleanupRelations(); saveDB(); render();
    addNotif('حذف مشرف', s?.name||'', 'err');
    toast(t('msg_deleted'),'ok');
    autoSyncAfterSave();
  });
  $$('[data-assign]').forEach(b=> b.onclick = ()=> assignModal(b.dataset.assign));
  $$('[data-quick-sup]').forEach(sel=> sel.onchange = ()=>{
    const r = getRep(sel.dataset.quickSup);
    if(r){
      r.supervisorId = sel.value; saveDB();
      addNotif('تغيير مشرف', `${r.name} → ${r.supervisorId?supName(r.supervisorId):'بدون'}`, 'info');
      toast(t('msg_updated'),'ok'); render();
      autoSyncAfterSave();
    }
  });
}
function supModal(id){
  if(!isOwner()){ toast(t('msg_no_perm'),'warn'); return; }
  const rec = id ? getSup(id) : null;
  const body = `<form id="supForm" class="form-grid" novalidate>
    <div class="field"><label>${t('fld_name')} <span class="req">*</span></label>
      <input name="name" required value="${esc(rec?.name||'')}"></div>
    <div class="field"><label>${t('fld_phone')} <span class="req">*</span></label>
      <input name="phone" required dir="ltr" value="${esc(rec?.phone||'')}"></div>
    <div class="field"><label>${t('fld_code')} <span class="req">*</span></label>
      <input name="code" required dir="ltr" value="${esc(rec?.code||'SUP-'+String(db.supervisors.length+1).padStart(3,'0'))}"></div>
    <div class="field"><label>${t('fld_email')} <span class="req">*</span></label>
      <input type="email" name="email" required dir="ltr" value="${esc(rec?.email||'')}" placeholder="supervisor@rep.com">
      <span class="hint">يُستخدم لتسجيل الدخول</span></div>
    <div class="field"><label>${t('fld_password')} ${rec?'':'<span class="req">*</span>'}</label>
      <input type="text" name="password" ${rec?'':'required'} value="" placeholder="${rec?'اتركها فارغة للإبقاء':'••••••'}"></div>
    <div class="field" style="grid-column:1/-1">
      <label>${t('fld_permissions')}</label>
      <div class="small muted" style="padding:12px 14px;border-radius:11px;background:var(--primary-soft);border:1px solid var(--border);line-height:1.65">
        ℹ️ لتحديد صلاحيات هذا المشرف (عرض/تعديل لكل قسم وفرع)، استخدم زر
        <b>🛡️ ${t('btn_permissions')}</b> في القائمة الجانبية بعد حفظ المشرف.
      </div>
    </div>
    <div id="supErr" class="err" style="grid-column:1/-1;display:none"></div>
  </form>`;
  openModal({
    title: rec ? `${t('btn_edit')} — ${t('nav_supervisors')}` : `${t('btn_add')} — ${t('nav_supervisors')}`,
    body, tableId:'supervisors', record: rec,
    onSubmit(root){
      const form = $('#supForm', root), err = $('#supErr', root);
      const d = Object.fromEntries(new FormData(form));
      if(!d.name || !d.phone || !d.code || !d.email){
        err.textContent = t('msg_required'); err.style.display='block'; return false;
      }
      if(rec){
        const patch = {name:d.name, phone:d.phone, code:d.code, email:d.email,
          custom: readCustomValues(root), updatedAt:new Date().toISOString()};
        if(d.password) patch.password = hashPwd(d.password);
        Object.assign(rec, patch);
        addNotif('تعديل مشرف', d.name, 'warn'); toast(t('msg_updated'),'ok');
      } else {
        if(!d.password){ err.textContent = t('msg_required'); err.style.display='block'; return false; }
        db.supervisors.push({
          id:uid(), name:d.name, phone:d.phone, code:d.code, email:d.email,
          password:hashPwd(d.password),
          permissions:['dashboard','daily','daily_edit','reps','reps_edit','analytics','goals'],
          custom: readCustomValues(root),
          goals: defaultGoals(), createdAt:new Date().toISOString()
        });
        addNotif('مشرف جديد', d.name, 'ok'); toast(t('msg_saved'),'ok');
      }
      saveDB(); render();
      autoSyncAfterSave();
      return true;
    }
  });
}
function assignModal(supId){
  if(!isOwner()){ toast(t('msg_no_perm'),'warn'); return; }
  const sup = getSup(supId);
  if(!sup) return;
  const body = `
    <div class="small muted" style="margin-bottom:12px">اختر السائقين التابعين للمشرف: <b>${esc(sup.name)}</b></div>
    <div class="checkbox-list" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));max-height:340px">
      ${db.reps.map(r=>`<label class="perm-check">
        <input type="checkbox" data-asg="${r.id}" ${r.supervisorId===supId?'checked':''}>
        ${esc(r.name)} <span class="muted small">(${esc(r.region)})</span>
      </label>`).join('') || `<div class="empty">${t('no_data')}</div>`}
    </div>`;
  openModal({
    title:`🔗 ${t('nav_reps')} ← ${esc(sup.name)}`,
    body, submitText:t('btn_save'),
    onSubmit(root){
      let changed = 0;
      $$('[data-asg]', root).forEach(cb=>{
        const r = getRep(cb.dataset.asg);
        if(!r) return;
        if(cb.checked && r.supervisorId !== supId){ r.supervisorId = supId; changed++; }
        else if(!cb.checked && r.supervisorId===supId){ r.supervisorId = ''; changed++; }
      });
      saveDB(); render();
      if(changed) addNotif('إسناد سائقين', `${changed} سائق → ${sup.name}`, 'info');
      toast(t('msg_updated'),'ok');
      if(changed) autoSyncAfterSave();
      return true;
    }
  });
}

function latestKmForCar(carId){
  const car = getCar(carId);
  if(!car) return 0;
  let maxKm = 0;
  if(car.assignedRepId){
    db.reports.forEach(r => {
      if(r.repId !== car.assignedRepId) return;
      const eK = (r.endKm !== '' && r.endKm !== undefined) ? num(r.endKm) : 0;
      const sK = (r.startKm !== '' && r.startKm !== undefined) ? num(r.startKm) : 0;
      const km = Math.max(eK, sK);
      if(km > maxKm) maxKm = km;
    });
  }
  db.usage.filter(u => u.carId === carId).forEach(u => {
    const eK = (u.endKm !== '' && u.endKm !== undefined) ? num(u.endKm) : 0;
    const sK = (u.startKm !== '' && u.startKm !== undefined) ? num(u.startKm) : 0;
    const km = Math.max(eK, sK);
    if(km > maxKm) maxKm = km;
  });
  return maxKm;
}
function currentKm(carId){ return latestKmForCar(carId); }
function checkOilForCar(carId){
  const car = getCar(carId);
  if(!car) return;
  const oils = db.oil.filter(o => o.carId === carId && num(o.nextKm) > 0);
  if(!oils.length) return;
  const latest = oils.slice().sort((a,b) => num(b.km) - num(a.km))[0];
  const nextKm = num(latest.nextKm);
  const currentKmv = latestKmForCar(carId);
  if(!currentKmv) return;
  const remain = nextKm - currentKmv;
  if(remain <= 0 && !latest.notifiedDue){
    latest.notifiedDue = true;
    addNotif('🛢️ موعد تغيير الزيت',
      `${carName(carId)} — القراءة الحالية ${currentKmv} كم (الموعد المحدد: ${nextKm} كم)`, 'warn');
  } else if(remain > 0 && remain <= 500 && !latest.notifiedSoon){
    latest.notifiedSoon = true;
    addNotif('🛢️ تغيير زيت قريب',
      `${carName(carId)} — متبقٍ ${remain} كم لتغيير الزيت (القراءة: ${currentKmv} كم)`, 'info');
  }
}

function analyticsFilterRange(){
  const f = state.analyticsFilter;
  switch(f.type){
    case 'rep': return { from:'', to:'', repId:f.repId };
    case 'day': return { from:f.date, to:f.date };
    case 'week': { const s = weekStartOf(f.weekDate); return { from:s, to:addDaysStr(s,6) }; }
    case 'month': { const s = f.month+'-01'; return { from:s, to:monthEndOf(s) }; }
    case 'range_days': return { from:f.d1, to:f.d2 };
    case 'range_weeks': { const s=weekStartOf(f.w1); const e=addDaysStr(weekStartOf(f.w2),6); return { from:s, to:e }; }
    case 'range_months': { const s=f.m1+'-01'; const e=monthEndOf(f.m2+'-01'); return { from:s, to:e }; }
    default: return { from:'', to:'' };
  }
}
function applyAnalyticsFilter(reports){
  const f = state.analyticsFilter;
  const r = analyticsFilterRange();
  let out = reports;
  if(r.from && r.to) out = out.filter(x=> x.date >= r.from && x.date <= r.to);
  else if(r.from) out = out.filter(x=> x.date >= r.from);
  else if(r.to) out = out.filter(x=> x.date <= r.to);
  if(f.type==='rep' && f.repId) out = out.filter(x=> x.repId === f.repId);
  return out;
}
function analyticsPrevRange(){
  const f = state.analyticsFilter;
  if(f.type==='all') return null;
  if(f.type==='rep'){
    const today = todayStr();
    const from = addDaysStr(today, -29);
    const pTo = addDaysStr(from, -1);
    const pFrom = addDaysStr(pTo, -29);
    return { from:pFrom, to:pTo, repId:f.repId };
  }
  const r = analyticsFilterRange();
  if(!r.from || !r.to) return null;
  const fromD = new Date(r.from+'T00:00:00');
  const toD = new Date(r.to+'T00:00:00');
  const days = Math.round((toD - fromD)/86400000) + 1;
  const pTo = addDaysStr(r.from, -1);
  const pFrom = addDaysStr(pTo, -(days-1));
  return { from:pFrom, to:pTo };
}
function applyPrevFilter(reports, pr){
  if(!pr) return [];
  let out = reports.filter(x=> x.date >= pr.from && x.date <= pr.to);
  if(pr.repId) out = out.filter(x=> x.repId === pr.repId);
  return out;
}

    case 'day': return `${dayName(f.date)} ${f.date}`;
    case 'week': { const s=weekStartOf(f.weekDate); return `${s} → ${addDaysStr(s,6)}`; }
    case 'month': return f.month;
    case 'range_days': return `${f.d1} → ${f.d2}`;
    case 'range_weeks': { const s=weekStartOf(f.w1); const e=addDaysStr(weekStartOf(f.w2),6); return `${s} → ${e}`; }
    case 'range_months': return `${f.m1} → ${f.m2}`;
    default: return t('all_days');
  }
}

function goalsForTarget(targetId){
  if(targetId === 'owner') return db.goals || defaultGoals();
  const s = getSup(targetId);
  return (s && s.goals) || defaultGoals();
}
function computeGoalActuals(period, supId){
  const start = period==='daily' ? todayStr() : period==='weekly' ? weekStart() : monthStart();
  const reports = supId ? reportsForSupervisor(supId) : visibleReports();
  const reps = supId ? repsForSupervisor(supId) : visibleReps();
  const rs = reports.filter(r=> r.date >= start);
  const daysCount = Math.max(1, Math.ceil((Date.now()-new Date(start).getTime())/864e5));
  return {
    orders: sum(rs,'orders'),
    hours: round1(sum(rs,'hours')),
    violations: sum(rs,'violations'),
    acceptRate: sum(rs,'violations') ? Math.round((sum(rs,'accepted')/sum(rs,'violations'))*100) : 100,
    perRepDaily: reps.length ? round1(sum(rs,'orders') / reps.length / daysCount) : 0,
    reps: reps.length,
    reportsCount: rs.length
  };
}
function goalCard({icon,label,target,actual,unit='',inverse=false}){
  if(!target || num(target) === 0) return '';
  const pct = inverse
    ? Math.round((num(target) / Math.max(num(actual), 1)) * 100)
    : Math.round((num(actual) / num(target)) * 100);
  const exceed = inverse ? (num(actual) <= num(target)) : (num(actual) >= num(target));
  const status = exceed ? t('goals_exceeded') : (pct >= 70 ? t('goals_on_track') : t('goals_behind'));
  const remaining = Math.max(0, num(target) - num(actual));
  const barWidth = Math.min(100, pct);
  return `<div class="goal-card">
    <div class="goal-title">${icon} ${label}</div>
    <div class="goal-values">
      <div><div class="gv-l">${t('goals_actual')}</div><div class="gv-v">${actual}${unit}</div></div>
      <div style="text-align:center"><div class="gv-l">${t('goals_target')}</div><div class="gv-v">${target}${unit}</div></div>
      <div style="text-align:end"><div class="gv-l">${t('goals_remaining')}</div><div class="gv-v">${inverse? Math.max(0,num(actual)-num(target)) : remaining}${unit}</div></div>
    </div>
    <div class="goal-bar ${exceed?'exceed':''}"><i style="width:${barWidth}%"></i></div>
    <div class="goal-pct" style="color:${exceed?'#047857':pct>=70?'#1d4ed8':'#b45309'}">${pct}% · ${status}</div>
  </div>`;
}

}

        s.goals[period] = Object.assign({}, existingS, { orders });
        savedCount++;
      });
      saveDB(); render();
      addNotif('🎯 إنشاء هدف', `${t('goals_general_target')}: ${generalOrders} | ${savedCount} ${t('nav_supervisors')}`, 'ok');
      toast(t('msg_goal_sent'), 'ok');
      autoSyncAfterSave();
      return true;
    }
  });
}

function computeInternetRow(x){
  const today = todayStr();
  const prev = x.prevRenewal || '';
  const next = x.nextRenewal || '';
  let daysLeft = null, actualDuration = 28;
  if(next){ daysLeft = Math.floor((new Date(next) - new Date(today))/86400000); }
  if(prev){
    const elapsed = Math.floor((new Date(today) - new Date(prev))/86400000);
    actualDuration = Math.max(0, 28 - elapsed);
  }
  return { ...x, daysLeft, actualDuration };
}
function checkInternetExpiry(){
  const today = todayStr();
  (db.internet||[]).forEach(sub=>{
    if(!sub.nextRenewal) return;
    const days = Math.floor((new Date(sub.nextRenewal) - new Date(today))/86400000);
    if(days <= 0 && !sub.notifiedExpired){
      sub.notifiedExpired = true;
      addNotif(t('msg_internet_expired'), `${repName(sub.repId)} — ${sub.nextRenewal}`, 'err');
    } else if(days === 1 && !sub.notified1day){
      sub.notified1day = true;
      addNotif(t('msg_internet_1day'), `${repName(sub.repId)} — ${sub.nextRenewal}`, 'warn');
    } else if(days === 2 && !sub.notified2day){
      sub.notified2day = true;
      addNotif(t('msg_internet_2day'), `${repName(sub.repId)} — ${sub.nextRenewal}`, 'info');
    }
  });
  saveDB();
}

function toolAction(act){
  switch(act){
    case 'lang':
      state.lang = state.lang==='ar' ? 'en' : 'ar';
      render(); toast(state.lang==='ar'?'تم التبديل إلى العربية':'Switched to English','ok');
      break;
    case 'sync':
      if(!isCloudReady()){ settingsModal(); return; }
      fullSync().then(ok => { if(ok) render(); });
      break;
    case 'share': copyShareLink(); break;
    case 'print': window.print(); break;
    case 'export': exportJSON(); break;
    case 'import':
      if(!canEditSection('daily')){ toast(t('msg_no_perm'),'warn'); return; }
      openImportDialog(); break;
    case 'reset':
      if(!isOwner()){ toast(t('msg_no_perm'),'warn'); return; }
      if(confirm(t('msg_confirm_reset'))){
        db = seedDB(); saveDB(); state.section='dashboard'; render();
        toast(t('msg_reset'),'ok');
        autoSyncAfterSave();
      } break;
    case 'refresh':
      if(isCloudReady()){ fullSync().then(ok => { if(ok) render(); }); }
      else { db = loadDB() || db; applySettings(); render(); toast(t('msg_updated'),'ok'); }
      break;
    case 'settings': settingsModal(); break;
  }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `drivers-performance-${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast(t('btn_export')+' ✓','ok');
}
function openImportDialog(){
  if(!canEditSection('daily')){ toast(t('msg_no_perm'),'warn'); return; }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const data = JSON.parse(rd.result);
        db = normalizeDB(data);
        cleanupRelations(); saveDB(); render();
        toast(t('msg_imported'),'ok');
        autoSyncAfterSave();
      }catch(err){ toast(t('msg_import_err'),'err'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

  const builtinKeys = def.builtin.map(([k])=>k);
  const order = getColumnOrder(current, builtinKeys);
  const customsMap = Object.fromEntries(customCols(current).map(c=>[c.id, c]));

  const buildRowFor = (key)=>{
    const custom = customsMap[key];
    const bt = def.builtin.find(([k])=>k===key);
    if(custom){
      return `<tr data-col-custom="1" data-col-id="${esc(custom.id)}" draggable="true">
        <td style="padding-inline-start:10px">
          <span class="muted" style="cursor:grab;margin-inline-end:6px;font-size:14px" title="اسحب للتحريك">⋮⋮</span>
          <input data-col-label value="${esc(custom.label)}" placeholder="${t('fld_name')}" style="display:inline-block;width:calc(100% - 40px)">
        </td>
        <td style="text-align:center"><span class="chip violet">${t('col_custom')}</span></td>
        <td style="text-align:center">
          <div class="tbl-actions" style="justify-content:center">
            <button type="button" class="btn btn-ghost btn-sm" data-col-up title="⬆️">⬆️</button>
            <button type="button" class="btn btn-ghost btn-sm" data-col-down title="⬇️">⬇️</button>
            <button type="button" class="btn btn-ghost btn-sm" data-col-edit style="color:var(--primary)" title="${t('btn_edit')}">✏️</button>
            <button type="button" class="btn btn-ghost btn-sm" data-col-del style="color:var(--red)" title="${t('btn_delete_col')}">🗑️</button>
          </div>
        </td>
      </tr>`;
    }
    if(bt){
      return `<tr data-col-locked="1" data-col-key="${esc(bt[0])}">
        <td style="padding-inline-start:10px"><input value="${esc(bt[1]())}" readonly></td>
        <td style="text-align:center"><span class="chip gray">🔒 ${t('col_builtin')}</span></td>
        <td style="text-align:center"><span class="muted small">—</span></td>
      </tr>`;
    }
    return '';
  };

  const body = `
    <div class="small muted" style="margin-bottom:12px;line-height:1.7">${t('col_manager_hint')}</div>
    <div class="small muted" style="margin-bottom:12px;padding:8px 12px;border-radius:9px;background:var(--amber-soft);border:1px solid #fde68a">
      💡 يمكنك تحريك الأعمدة المضافة باستخدام أزرار ⬆️ ⬇️ أو السحب والإفلات. الترتيب يُحفظ تلقائياً.
    </div>
    <div class="tbl-wrap" style="max-height:58vh;overflow-y:auto;border-radius:12px">
      <table>
        <thead>
          <tr>
            <th>${t('col_header_name')}</th>
            <th style="text-align:center;width:150px">${t('col_type')}</th>
            <th style="text-align:center;width:280px">
              <div style="display:flex;align-items:center;justify-content:center;gap:8px">
                <span class="chip blue" id="tmCount" style="font-size:11px">📊 ${order.length}</span>
                <button class="btn btn-primary btn-sm" id="tmAdd" type="button" style="padding:5px 12px;font-size:12px">➕ ${t('col_add')}</button>
              </div>
            </th>
          </tr>
        </thead>
        <tbody id="tmBody">${order.map(buildRowFor).join('')}</tbody>
      </table>
    </div>
  `;

  openModal({
    title: `📋 ${def.icon} ${def.name()}`,
    body,
    submitText: t('btn_save'),
    wide: true,
    onMount(root){
      const bodyEl = root.querySelector('#tmBody');
      const countEl = root.querySelector('#tmCount');
      const updateCount = ()=>{ if(countEl) countEl.textContent = '📊 ' + bodyEl.querySelectorAll('tr').length; };

      const bindDel = ()=>{
        bodyEl.querySelectorAll('[data-col-del]').forEach(b=>{
          b.onclick = ()=>{
            if(!confirm(t('msg_confirm_del'))) return;
            const tr = b.closest('tr');
            if(tr) tr.remove();
            updateCount();
          };
        });
      };
      const bindEdit = ()=>{
        bodyEl.querySelectorAll('[data-col-edit]').forEach(b=>{
          b.onclick = ()=>{
            const tr = b.closest('tr');
            const inp = tr.querySelector('[data-col-label]');
            if(!inp) return;
            inp.classList.add('editing');
            inp.focus(); inp.select();
            inp.onblur = ()=> inp.classList.remove('editing');
          };
        });
      };
      const isCustomTr = (el)=> el && el.dataset && el.dataset.colCustom === '1';
      const bindMove = ()=>{
        bodyEl.querySelectorAll('[data-col-up]').forEach(b=>{
          b.onclick = ()=>{
            const tr = b.closest('tr');
            const prev = tr.previousElementSibling;
            if(isCustomTr(prev)){
              bodyEl.insertBefore(tr, prev);
              tr.style.transition = 'background .3s';
              tr.style.background = 'var(--primary-soft)';
              setTimeout(()=> tr.style.background = '', 400);
            }
          };
        });
        bodyEl.querySelectorAll('[data-col-down]').forEach(b=>{
          b.onclick = ()=>{
            const tr = b.closest('tr');
            const next = tr.nextElementSibling;
            if(isCustomTr(next)){
              bodyEl.insertBefore(next, tr);
              tr.style.transition = 'background .3s';
              tr.style.background = 'var(--primary-soft)';
              setTimeout(()=> tr.style.background = '', 400);
            }
          };
        });
      };
      const bindDrag = ()=>{
        bodyEl.querySelectorAll('tr[data-col-custom]').forEach(tr=>{
          tr.ondragstart = e=>{
            state._dragSrc = tr;
            e.dataTransfer.effectAllowed = 'move';
            try{ e.dataTransfer.setData('text/plain', tr.dataset.colId); }catch(_){}
            tr.style.opacity = '0.5';
          };
          tr.ondragend = ()=>{ tr.style.opacity = ''; state._dragSrc = null; };
          tr.ondragover = e=>{ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
          tr.ondrop = e=>{
            e.preventDefault();
            const dragSrc = state._dragSrc;
            if(!dragSrc || dragSrc === tr) return;
            if(!isCustomTr(tr)) return;
            const rect = tr.getBoundingClientRect();
            const after = (e.clientY - rect.top) > rect.height / 2;
            bodyEl.insertBefore(dragSrc, after ? tr.nextSibling : tr);
            bodyEl.querySelectorAll('tr').forEach(x=> x.classList.remove('drop-target'));
            tr.classList.add('drop-target');
            setTimeout(()=> tr.classList.remove('drop-target'), 600);
          };
        });
      };
      const addRow = (label='')=>{
        const id = 'cc_' + uid();
        const tr = document.createElement('tr');
        tr.dataset.colCustom = '1';
        tr.dataset.colId = id;
        tr.draggable = true;
        tr.innerHTML = `<td style="padding-inline-start:10px">
            <span class="muted" style="cursor:grab;margin-inline-end:6px;font-size:14px" title="اسحب للتحريك">⋮⋮</span>
            <input data-col-label value="${esc(label)}" placeholder="${t('fld_name')}" style="display:inline-block;width:calc(100% - 40px)">
          </td>
          <td style="text-align:center"><span class="chip violet">${t('col_custom')}</span></td>
          <td style="text-align:center">
            <div class="tbl-actions" style="justify-content:center">
              <button type="button" class="btn btn-ghost btn-sm" data-col-up title="⬆️">⬆️</button>
              <button type="button" class="btn btn-ghost btn-sm" data-col-down title="⬇️">⬇️</button>
              <button type="button" class="btn btn-ghost btn-sm" data-col-edit style="color:var(--primary)" title="${t('btn_edit')}">✏️</button>
              <button type="button" class="btn btn-ghost btn-sm" data-col-del style="color:var(--red)" title="${t('btn_delete_col')}">🗑️</button>
            </div>
          </td>`;
        bodyEl.appendChild(tr);
        bindDel(); bindEdit(); bindMove(); bindDrag();
        updateCount();
        const inp = tr.querySelector('input');
        if(inp){ inp.classList.add('editing'); inp.focus(); }
      };
      root.querySelector('#tmAdd')?.addEventListener('click', ()=> addRow());
      bindDel(); bindEdit(); bindMove(); bindDrag();
      updateCount();
    },
    onSubmit(root){
      const fullOrder = [];
      root.querySelectorAll('#tmBody tr').forEach(tr=>{
        if(tr.dataset.colCustom === '1'){
          const label = (tr.querySelector('[data-col-label]')?.value || '').trim();
          if(!label) return;
          fullOrder.push({ type:'custom', id: tr.dataset.colId, label });
        } else if(tr.dataset.colLocked === '1'){
          fullOrder.push({ type:'builtin', key: tr.dataset.colKey });
        }
      });
      db.settings.customColumns = db.settings.customColumns || {};
      db.settings.customColumns[current] = fullOrder
        .filter(x=> x.type==='custom')
        .map(x=>({ id:x.id, label:x.label }));
      setColumnOrder(current, fullOrder.map(x=> x.type==='custom' ? x.id : x.key));
      saveDB(); render();
      toast(t('col_saved'), 'ok');
      autoSyncAfterSave();
      return true;
    }
  });
}

function permModal(){
  if(!isOwner()){ toast(t('msg_no_perm'),'warn'); return; }
  const renderSupCard = (s)=>{
    const p = s.permissions || [];
    const rows = [];
    PERM_TREE.forEach(sec=>{
      const hasV = permHasView(p, sec.id);
      const hasE = !sec.viewOnly && permHasEdit(p, sec.id);
      rows.push(`<tr class="sec-row" data-sec="${sec.id}">
        <td><span class="section-icon">${sec.icon}</span><b>${esc(t(sec.key))}</b></td>
        <td class="chk-cell"><input type="checkbox"
            data-sup="${s.id}" data-sec="${sec.id}" data-kind="view" ${hasV?'checked':''}></td>
        <td class="chk-cell">${
          sec.viewOnly
            ? '<span class="muted small">—</span>'
            : `<input type="checkbox" data-sup="${s.id}" data-sec="${sec.id}" data-kind="edit" ${hasE?'checked':''}>`
        }</td>
      </tr>`);
      (sec.branches||[]).forEach(b=>{
        const bHasV = permHasView(p, sec.id, b.id);
        const bHasE = permHasEdit(p, sec.id, b.id);
        rows.push(`<tr class="branch" data-sec="${sec.id}" data-branch="${b.id}">
          <td><span class="section-icon">${b.icon}</span>${esc(t(b.key))}</td>
          <td class="chk-cell"><input type="checkbox"
              data-sup="${s.id}" data-sec="${sec.id}" data-branch="${b.id}" data-kind="view" ${bHasV?'checked':''}></td>
          <td class="chk-cell"><input type="checkbox"
              data-sup="${s.id}" data-sec="${sec.id}" data-branch="${b.id}" data-kind="edit" ${bHasE?'checked':''}></td>
        </tr>`);
      });
    });
    return `<div class="perm-card" data-perm-card="${s.id}">
      <div class="perm-card-head">
        <div class="ic-avatar" style="width:34px;height:34px;font-size:14px">${esc((s.name||'?').charAt(0))}</div>
        <div style="flex:1;min-width:0">
          <div class="perm-card-title">${esc(s.name)}</div>
          <div class="small muted" dir="ltr">${esc(s.email||'')}</div>
        </div>
        <button type="button" class="perm-toggle" data-perm-toggle="${s.id}"
                title="${t('credentials_show')}/${t('credentials_hide')}">👁️</button>
      </div>
      <div class="perm-table-wrap" data-perm-body="${s.id}">
        <table class="perm-table">
          <thead><tr>
            <th>${t('fld_sections')} / ${t('perm_branches')}</th>
            <th>👁️ ${t('perm_view_col')}</th>
            <th>✏️ ${t('perm_edit_col')}</th>
          </tr></thead>
          <tbody>${rows.join('')}</tbody>
        </table>
      </div>
    </div>`;
  };
  const body = `
    <div class="small muted" style="margin-bottom:14px;line-height:1.7">${t('perm_intro')}</div>
    <div class="row" style="margin-bottom:12px;justify-content:flex-end">
      <button type="button" class="btn btn-sm" id="permToggleAll">👁️ ${t('credentials_show')} / ${t('credentials_hide')} — ${t('fld_all')}</button>
    </div>
    <div class="perm-list">
      ${db.supervisors.length ? db.supervisors.map(renderSupCard).join('') : `<div class="empty">${t('no_data')}</div>`}
    </div>
    <div class="small muted" style="margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--border)">
      ${t('perm_owner_note')}
    </div>`;
  openModal({
    title:`🛡️ ${t('btn_permissions')}`,
    body, wide:true, submitText:t('btn_save'),
    onMount(root){
      const toggleBody = (id, btn)=>{
        const card = root.querySelector(`[data-perm-card="${id}"]`);
        if(!card) return;
        const collapsed = card.classList.toggle('collapsed');
        if(btn) btn.textContent = collapsed ? '🙈' : '👁️';
      };
      root.querySelectorAll('[data-perm-toggle]').forEach(btn=>{
        btn.onclick = ()=> toggleBody(btn.dataset.permToggle, btn);
      });
      const toggleAllBtn = root.querySelector('#permToggleAll');
      if(toggleAllBtn){
        toggleAllBtn.onclick = ()=>{
          const cards = root.querySelectorAll('[data-perm-card]');
          const anyOpen = [...cards].some(c=> !c.classList.contains('collapsed'));
          cards.forEach(card=>{
            const id = card.dataset.permCard;
            const btn = root.querySelector(`[data-perm-toggle="${id}"]`);
            if(anyOpen){ card.classList.add('collapsed'); if(btn) btn.textContent = '🙈'; }
            else { card.classList.remove('collapsed'); if(btn) btn.textContent = '👁️'; }
          });
        };
      }
      const get = (supId, secId, branchId, kind)=>{
        const sel = branchId
          ? `input[data-sup="${supId}"][data-sec="${secId}"][data-branch="${branchId}"][data-kind="${kind}"]`
          : `input[data-sup="${supId}"][data-sec="${secId}"][data-kind="${kind}"]:not([data-branch])`;
        return root.querySelector(sel);
      };
      const setChk = (el,v)=>{ if(el) el.checked = v; };
      const syncFromSection = (supId, secId)=>{
        const v = get(supId, secId, '', 'view');
        const e = get(supId, secId, '', 'edit');
        const sec = PERM_TREE.find(x=>x.id===secId);
        const branches = sec?.branches || [];
        if(v && !v.checked){
          setChk(e,false);
          branches.forEach(b=>{
            setChk(get(supId,secId,b.id,'view'),false);
            setChk(get(supId,secId,b.id,'edit'),false);
          });
        }
        if(v && v.checked){ branches.forEach(b=> setChk(get(supId,secId,b.id,'view'),true)); }
        if(e && e.checked){
          setChk(v,true);
          branches.forEach(b=>{
            setChk(get(supId,secId,b.id,'view'),true);
            setChk(get(supId,secId,b.id,'edit'),true);
          });
        }
      };
      const syncFromBranch = (supId, secId, branchId)=>{
        const bv = get(supId,secId,branchId,'view');
        const be = get(supId,secId,branchId,'edit');
        if(be && be.checked) setChk(bv,true);
        if(bv && !bv.checked) setChk(be,false);
        if((bv && bv.checked) || (be && be.checked)){ setChk(get(supId,secId,'','view'), true); }
        const sec = PERM_TREE.find(x=>x.id===secId);
        if(sec && sec.branches.length){
          const anyV = sec.branches.some(b=>{ const el = get(supId,secId,b.id,'view'); return el && el.checked; });
          const anyE = sec.branches.some(b=>{ const el = get(supId,secId,b.id,'edit'); return el && el.checked; });
          if(!anyV && !anyE){
            setChk(get(supId,secId,'','view'),false);
            setChk(get(supId,secId,'','edit'),false);
          }
        }
      };
      root.addEventListener('change', e=>{
        const cb = e.target;
        if(!cb.matches('input[type=checkbox][data-kind]')) return;
        const supId = cb.dataset.sup, secId = cb.dataset.sec;
        const branchId = cb.dataset.branch || '';
        if(branchId) syncFromBranch(supId, secId, branchId);
        else syncFromSection(supId, secId);
      });
    },
    onSubmit(root){
      db.supervisors.forEach(s=>{
        const perms = [];
        root.querySelectorAll(`input[data-kind="view"][data-sup="${s.id}"]`).forEach(cb=>{
          if(!cb.checked) return;
          const secId = cb.dataset.sec, branchId = cb.dataset.branch || '';
          perms.push(branchId ? `${secId}.${branchId}` : secId);
        });
        root.querySelectorAll(`input[data-kind="edit"][data-sup="${s.id}"]`).forEach(cb=>{
          if(!cb.checked) return;
          const secId = cb.dataset.sec, branchId = cb.dataset.branch || '';
          perms.push(branchId ? `${secId}.${branchId}_edit` : `${secId}_edit`);
        });
        s.permissions = perms;
      });
      saveDB(); render();
      toast(t('msg_updated'),'ok');
      autoSyncAfterSave();
      return true;
    }
  });
}

      <div class="field"><label>${t('pwd_new')} <span class="req">*</span></label>
        <input type="password" name="newPwd" required autocomplete="new-password"></div>
      <div class="field"><label>${t('pwd_confirm')} <span class="req">*</span></label>
        <input type="password" name="confirmPwd" required autocomplete="new-password"></div>
      ${isOwnerUser?`<div class="small muted" style="grid-column:1/-1;padding:10px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--border)">${t('pwd_owner_note')}</div>`:''}
      <div id="pErr" class="err" style="grid-column:1/-1;display:none"></div>
    </form>`;
  openModal({
    title:`🔑 ${t('pwd_section')}`, body, submitText:t('pwd_save'),
    onSubmit(root){
      const d = Object.fromEntries(new FormData($('#pwdForm', root)));
      const err = $('#pErr', root);
      if(!d.currentPwd || !d.newPwd || !d.confirmPwd){
        err.textContent = t('msg_required'); err.style.display='block'; return false;
      }
      const curHash = hashPwd(d.currentPwd);
      let stored = null;
      if(isOwnerUser) stored = db.auth?.owner?.password;
      else { const sup = db.supervisors.find(s=>s.id===state.user.id); stored = sup?.password; }
      if(stored !== curHash){ err.textContent = t('msg_pwd_wrong'); err.style.display='block'; return false; }
      if(d.newPwd.length < 4){ err.textContent = t('msg_pwd_short'); err.style.display='block'; return false; }
      if(d.newPwd !== d.confirmPwd){ err.textContent = t('msg_pwd_mismatch'); err.style.display='block'; return false; }
      const newHash = hashPwd(d.newPwd);
      if(isOwnerUser) db.auth.owner.password = newHash;
      else { const sup = db.supervisors.find(s=>s.id===state.user.id); if(sup) sup.password = newHash; }
      saveDB();
      toast(t('msg_pwd_changed'),'ok');
      autoSyncAfterSave();
      return true;
    }
  });
}

        cloudCfg.key = k; cloudCfg.binId = bin; saveCloudCfg();
        setCloudStatus('syncing');
        try{
          const res = await fetch(`${JSONBIN_BASE}/b/${cloudCfg.binId}/latest`, { headers:{ 'X-Master-Key': cloudCfg.key } });
          if(!res.ok) throw new Error(await res.text());
          setCloudStatus('on'); toast(t('msg_conn_ok'),'ok');
        }catch(e){ setCloudStatus('off'); toast(t('msg_conn_fail') + ': ' + e.message,'err'); }
      });
      $('#cancelCloudEdit', root)?.addEventListener('click', ()=>{ state.cloudEdit = false; settingsModal(); });
      $('#editCloud', root)?.addEventListener('click', ()=>{ state.cloudEdit = true; settingsModal(); });
      $('#disconnectCloud', root)?.addEventListener('click', ()=>{
        if(!confirm(t('msg_confirm_disconnect'))) return;

        localStorage.removeItem(CLOUD_CFG_KEY);
        sessionStorage.removeItem(CLOUD_SESSION_KEY);

        state.cloudEdit = false;
        setCloudStatus('off');
        settingsModal();
        toast(t('msg_cloud_disconnected'),'ok');

function openModal({title, body, onSubmit, onMount, submitText, wide, tableId, record}){
  const root = $('#modalRoot');
  root.innerHTML = `
    <div class="overlay" id="ovl">
      <div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3>${title}</h3>
          <button class="icon-btn" id="mClose">✕</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">
          <button class="btn" id="mCancel">${t('btn_cancel')}</button>
          <button class="btn btn-primary" id="mSave">${submitText || t('btn_save')}</button>
        </div>
      </div>
    </div>`;
  const close = ()=>{
    root.innerHTML = '';
    if(state.pendingReopen){
      const fn = state.pendingReopen;
      state.pendingReopen = null;
      setTimeout(fn, 200);
    }
  };
  $('#mClose').onclick = close;
  $('#mCancel').onclick = close;
  $('#ovl').onclick = e=>{ if(e.target.id==='ovl') close(); };
  $('#mSave').onclick = ()=>{
    const form = root.querySelector('form');
    if(form && !form.checkValidity()){
      form.querySelectorAll(':invalid')[0]?.focus();
      const err = root.querySelector('.err');
      if(err){ err.textContent = t('msg_required'); err.style.display='block'; }
      return;
    }
    if(onSubmit && onSubmit(root) === false) return;
    close();
  };
  document.addEventListener('keydown', function esc2(e){
    if(e.key==='Escape'){ close(); document.removeEventListener('keydown', esc2); }
  });
  if(tableId){
    const form = root.querySelector('form');
    if(form){
      const html = customFormFieldsHTML(tableId, record);
      if(html){
        const errEl = form.querySelector('.err');
        const grid   = form.querySelector('.form-grid');
        if(errEl)      errEl.insertAdjacentHTML('beforebegin', html);
        else if(grid)  grid.insertAdjacentHTML('beforeend', html);
        else           form.insertAdjacentHTML('beforeend', `<div class="form-grid">${html}</div>`);
      }
    }
  }
  if(onMount) onMount(root);
  root.querySelector('input,select,textarea')?.focus();
}

function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}

  const b = $('#fsBtn');

  b.textContent = isFullscreen() ? '🗗' : '⛶';

}
function toggleFullscreen(silent){
  const el = document.documentElement;
  if(!isFullscreen()){
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(!req){ if(!silent) toast(t('msg_fs_unsupported'),'warn'); return; }
    try{
      const p = req.call(el);
      if(p && p.catch) p.catch(()=>{ if(!silent) toast(t('msg_fs_failed'),'warn'); });
    }catch(e){ if(!silent) toast(t('msg_fs_failed'),'warn'); }
  } else {
    const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(ex){ try{ ex.call(document); }catch(e){} }
  }
}

    const mode = (db.settings && db.settings.supervisorSyncMode) || 'auto';

    }
  } else {
    showLogin();
  }
  // ✅ المؤقّت الداخلي مع التحقق الصريح من الوضع اليدوي
  setInterval(async ()=>{
    if(!isCloudReady() || !state.user || state.cloudBusy) return;
    const mode = (db.settings && db.settings.supervisorSyncMode) || 'auto';

      const ok = await pullFromCloud(true);

  );

    if(!state.cloudMode) saveDB();
  });
}

/* ───────────────────────────────────────────────────────────────
   5) تزيين رؤوس الجداول بعد كل render: data-col + التسمية + الترتيب
   ─────────────────────────────────────────────────────────────── */
function patchHeadersAndOrder(){
  const tableId = currentTableId();
  if(!tableId) return;
  const defs = DEFS[tableId];
  if(!defs) return;

  document.querySelectorAll('#view table').forEach(table => {
    const headerRow = table.querySelector('thead tr');
    if(!headerRow) return;
    const ths = [...headerRow.children];

    /* تعيين data-col للرؤوس الافتراضية + تطبيق التسمية */
    ths.forEach(th => {
      if(th.dataset.col) return;
      const txt = (th.textContent || '').trim();
      if(!txt) return;
      let matched = null;
      for(const [key, fn] of Object.entries(defs)){
        if(txt === fn()){ matched = key; break; }
      }
      if(!matched){
        for(const [key, fn] of Object.entries(defs)){
          if(txt.startsWith(fn())){ matched = key; break; }
        }
      }
      if(matched){
        th.dataset.col = matched;
        const defLabel = th.textContent;
        const custom = hdr(tableId, matched, defLabel);
        if(custom !== defLabel) th.textContent = custom;
      }
    });

    /* تطبيق الترتيب المحفوظ */
    const order = db?.settings?.columnOrder?.[tableId];
    if(!Array.isArray(order) || !order.length) return;
    const keys = ths.map(th => th.dataset.col || null);
    const desired = order.filter(k => keys.includes(k));
    const unknown = keys.filter(k => k && !order.includes(k));
    const finalDataCols = [...desired, ...unknown];
    if(!finalDataCols.length) return;
    const indices = finalDataCols.map(k => keys.indexOf(k));
    const extras = keys.map((k,i) => k ? -1 : i).filter(i => i >= 0);
    const finalIdx = [...indices, ...extras];
    if(finalIdx.length !== keys.length) return;
    if(finalIdx.every((v,i) => v === i)) return;

    table.querySelectorAll('tr').forEach(row => {
      const cells = [...row.children];
      if(cells.length !== keys.length) return;
      const reordered = finalIdx.map(i => cells[i]);
      cells.forEach(c => c.remove());
      reordered.forEach(c => row.appendChild(c));
    });
  });
}

function applyTMPatch(tableId){
  const modal = document.querySelector('#modalRoot .modal');
  if(!modal) return;
  const body = modal.querySelector('#tmBody');
  if(!body) return;

  /* (أ) تعزيز كل الصفوف الحالية */
  enhanceRows(body, tableId);

  /* (ب) حدث واحد على body لالتقاط الأزرار قبل معالجات الكود الأصلي
         (capture-phase يتغلب على onclick المرفق من bindMove الأصلي) */
  if(!body.dataset.tmPatched){
    body.dataset.tmPatched = '1';

    body.addEventListener('click', function(e){
      const btn = e.target.closest('[data-col-up],[data-col-down],[data-col-reset]');
      if(!btn) return;
      const tr = btn.closest('tr');
      if(!tr) return;
      e.preventDefault(); e.stopPropagation();
      if(btn.hasAttribute('data-col-up')){
        const p = tr.previousElementSibling;
        if(p) tr.parentNode.insertBefore(tr, p);
      } else if(btn.hasAttribute('data-col-down')){
        const n = tr.nextElementSibling;
        if(n) tr.parentNode.insertBefore(n, tr);
      } else {
        const inp = tr.querySelector('input');
        if(inp && inp.dataset.defaultLabel) inp.value = inp.dataset.defaultLabel;
      }
    }, true);

    body.addEventListener('dragstart', function(e){
      const tr = e.target.closest('tr'); if(!tr) return;
      window._tmSrc = tr;
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', tr.dataset.colKey || tr.dataset.colId || 'x'); }catch(_){}
      tr.style.opacity = '0.5';
    }, true);

    body.addEventListener('dragend', function(e){
      const tr = e.target.closest('tr'); if(tr) tr.style.opacity = '';
      window._tmSrc = null;
    }, true);

    body.addEventListener('dragover', function(e){
      e.preventDefault();
      const tr = e.target.closest('tr'); if(!tr) return;
      body.querySelectorAll('tr').forEach(x => x.classList.remove('drop-target'));
      tr.classList.add('drop-target');
    }, true);

    body.addEventListener('drop', function(e){
      e.preventDefault();
      const tr = e.target.closest('tr');
      if(!tr || !window._tmSrc || window._tmSrc === tr) return;
      const rect = tr.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height / 2;
      tr.parentNode.insertBefore(window._tmSrc, after ? tr.nextSibling : tr);
      body.querySelectorAll('tr').forEach(x => x.classList.remove('drop-target'));
    }, true);

    /* ⭐ التقاط أسماء الرؤوس المُعاد تسميتها BEFORE حفظ الكود الأصلي */
    modal.addEventListener('click', function(e){
      if(e.target.id !== 'mSave') return;

      const newHeaders = {};
      body.querySelectorAll('tr[data-col-locked]').forEach(tr => {
        const key = tr.dataset.colKey;
        const inp = tr.querySelector('input');
        if(!inp || !key) return;
        const label = (inp.value || '').trim();
        const defaultLabel = inp.dataset.defaultLabel || '';
        /* نحفظ فقط إذا اختلف عن الافتراضي */
        if(label && defaultLabel && label !== defaultLabel){
          newHeaders[key] = label;
        }
      });

      if(!db.settings.customHeaders) db.settings.customHeaders = {};
      db.settings.customHeaders[tableId] = newHeaders;
      console.log('[PATCH] Custom headers captured before save:', newHeaders);
      /* نترك معالج الحفظ الأصلي يكمل: يحفظ customColumns + columnOrder */
    }, true);
  }

  /* (ج) مراقبة الصفوف الجديدة (المضافة بزر ➕) لتعزيزها فوراً */
  const obs = new MutationObserver(() => enhanceRows(body, tableId));
  obs.observe(body, {childList:true});
}

/* تعزيز صف واحد (افتراضي أو مخصص) */
function enhanceRows(body, tableId){
  /* الصفوف الافتراضية → حوّلها قابلة للتعديل + أضف أزرار النقل */
  body.querySelectorAll('tr[data-col-locked]').forEach(tr => {
    if(tr.dataset.enhanced === '1') return;
    tr.dataset.enhanced = '1';

    const key = tr.dataset.colKey;
    const inp = tr.querySelector('input');
    if(!inp || !key) return;

    const defaultLabel = inp.value;
    const currentLabel = hdr(tableId, key, defaultLabel);
    inp.value = currentLabel;
    inp.readOnly = false;
    inp.dataset.defaultLabel = defaultLabel;
    inp.placeholder = 'اكتب اسماً مخصصاً…';
    inp.style.background = '';

    /* بدّل شارة "افتراضية" */
    const chip = tr.querySelector('.chip');
    if(chip) chip.innerHTML = '✏️ ' + (t('col_builtin') || 'قابلة للتعديل');

    /* أزرار النقل/الاستعادة */
    const actions = tr.children[2];
    if(actions){
      actions.innerHTML = `
        <div class="tbl-actions" style="justify-content:center">
          <button type="button" class="btn btn-ghost btn-sm" data-col-up title="أعلى">⬆️</button>
          <button type="button" class="btn btn-ghost btn-sm" data-col-down title="أسفل">⬇️</button>
          <button type="button" class="btn btn-ghost btn-sm" data-col-reset
                  style="color:var(--amber)" title="${t('col_reset') || 'استعادة الافتراضي'}">↺</button>
        </div>`;
    }
    tr.draggable = true;
  });

  /* الصفوف المخصصة → تأكد من colKey */
  body.querySelectorAll('tr[data-col-custom]').forEach(tr => {
    if(!tr.dataset.colKey) tr.dataset.colKey = tr.dataset.colId;
    if(tr.dataset.enhanced === '1') return;
    tr.dataset.enhanced = '1';
    tr.draggable = true;
  });
}

/* ───────────────────────────────────────────────────────────────
   7) ملاءمة الطباعة تلقائياً
   ─────────────────────────────────────────────────────────────── */
function autoFitPrint(){
  const view = document.getElementById('view');
  if(!view) return;
  const natural = view.getBoundingClientRect().width;
  const A4_PX = 718;
  const z = Math.min(1, A4_PX / Math.max(natural, A4_PX));
  document.documentElement.style.setProperty('--print-zoom', String(Math.max(0.3, z)));
}
window.addEventListener('beforeprint', autoFitPrint);
window.addEventListener('afterprint', () => {
  document.documentElement.style.removeProperty('--print-zoom');
});

console.log('%c[PATCH v2] ✅ جاهز — التعديلات تُحفظ فقط عند الضغط على "حفظ"',
            'color:#10b981;font-weight:bold;');
})();
</script>
<!-- ============================================================

<script>
(function(){
'use strict';
console.log('[PATCH v3] Loading...');

/* ───────────────────────────────────────────────────────────────
   1) حالة الفلترة بقسم التصفية
   ─────────────────────────────────────────────────────────────── */
if(typeof state !== 'undefined'){

/* ───────────────────────────────────────────────────────────────

   ─────────────────────────────────────────────────────────────── */
window.viewSettlement = function(){
  var canEdit = isOwner() || canEditSection('settlement');
  var sf = state.settlementFilter || { type:'all', value:'' };

  var allRows = (db.settlements || []).slice().sort(function(a,b){
    return (b.regTime || '').localeCompare(a.regTime || '');
  });

  var uniqueAppIds = Array.from(new Set(
    allRows.map(function(x){ return x.appId; }).filter(Boolean)
  )).sort();
  var uniqueResponsibles = Array.from(new Set(
    allRows.map(function(x){ return x.responsible; }).filter(Boolean)
  )).sort();

  /* تطبيق الفلترة */
  var rows = allRows;
  if(sf.type === 'appId' && sf.value){
    rows = allRows.filter(function(x){ return (x.appId || '') === sf.value; });
  } else if(sf.type === 'responsible' && sf.value){
    rows = allRows.filter(function(x){ return (x.responsible || '') === sf.value; });
  } else if(sf.type === 'month' && sf.value){
    rows = allRows.filter(function(x){ return (x.regTime || '').startsWith(sf.value); });
  }

  var totalAmount = sum(rows, 'amount');
  var totalDays  = sum(rows, 'days');

  /* واجهة الفلترة */
